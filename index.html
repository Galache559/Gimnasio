<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mi Gimnasio Pro v4.5</title>
<meta name="theme-color" content="#121212">

<style>
:root{
--bg:#121212;
--card:#1e1e1e;
--item:#252525;
--input:#2a2a2a;
--a:#00e676;
--txt:#fff;
--sub:#aaa;
--bor:#333;
--red:#ff5252;
--gold:#ffd700;
--blue:#29b6f6
}

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
-webkit-tap-highlight-color:transparent
}

body{
background:var(--bg);
color:var(--txt);
padding-bottom:80px
}

header{
position:sticky;
top:0;
z-index:10;
background:var(--card);
padding:12px;
text-align:center;
border-bottom:1px solid var(--bor)
}

h1{
font-size:1.15rem;
color:var(--a);
letter-spacing:1px
}

.container{
max-width:650px;
margin:auto;
padding:10px
}

nav{
position:fixed;
bottom:0;
left:0;
right:0;
z-index:20;
background:var(--card);
display:flex;
border-top:1px solid var(--bor);
padding:7px 0
}

nav button{
width:25%;
background:none;
border:0;
color:var(--sub);
font-size:.7rem;
display:flex;
flex-direction:column;
gap:2px;
align-items:center
}

nav button.active{
color:var(--a);
font-weight:bold
}

.tab{display:none}
.tab.active{display:block}

.card{
background:var(--card);
border:1px solid var(--bor);
border-radius:11px;
padding:12px;
margin-bottom:10px
}

.card h2{
font-size:1rem;
color:var(--a);
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center
}

button,.btn{cursor:pointer}

.btn{
background:var(--a);
color:#000;
border:0;
border-radius:7px;
padding:10px;
width:100%;
font-weight:bold
}

.out{
background:transparent;
color:var(--txt);
border:1px solid var(--bor)
}

.danger{
background:transparent;
color:var(--red);
border:1px solid var(--red)
}

.sm{
width:auto;
padding:5px 9px;
font-size:.75rem
}

input,select{
width:100%;
background:var(--input);
color:var(--txt);
border:1px solid var(--bor);
border-radius:6px;
padding:8px;
margin-bottom:7px;
font-size:.88rem
}

label{
font-size:.73rem;
color:var(--sub)
}

.days{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px
}

.group{
color:var(--sub);
font-size:.73rem;
text-transform:uppercase;
margin:12px 0 6px
}

.ex{
background:var(--item);
padding:9px;
border-radius:8px;
margin-bottom:8px
}

.exhead{
display:flex;
justify-content:space-between;
align-items:center;
font-weight:bold;
margin-bottom:6px
}

.badge{
background:var(--gold);
color:#000;
border-radius:4px;
padding:2px 5px;
font-size:.62rem
}

.last,.suggest,.history{
font-size:.7rem;
padding:5px;
border-radius:5px;
margin-bottom:5px
}

.last{
color:var(--a);
background:#07351f;
border:1px solid #176b43
}

.suggest{
color:var(--blue);
background:#062d3c;
border:1px solid #17607c;
cursor:pointer
}

table{
width:100%;
border-collapse:collapse
}

th{
color:var(--sub);
font-size:.63rem;
font-weight:normal
}

td{
text-align:center;
padding:1px
}

td input{
margin:0;
text-align:center;
padding:6px 1px
}

td select{
margin:0;
padding:6px 1px;
font-size:.68rem
}

.rm,.vol{
font-size:.7rem;
margin-top:5px
}

.rm{color:var(--gold)}
.vol{color:var(--a)}

.row{
display:flex;
gap:5px;
margin-top:6px
}

.finish{
background:#333;
color:#fff;
border:1px solid var(--bor);
padding:6px 9px;
border-radius:6px;
font-size:.68rem
}

/* NUEVO: BOTON GUARDAR EJERCICIO */

.saveex{
width:100%;
margin-top:7px;
background:var(--a);
color:#000;
border:0;
padding:8px;
border-radius:6px;
font-size:.72rem;
font-weight:bold
}

.saveex.saved{
background:#07351f;
color:var(--a);
border:1px solid #176b43
}

/* CRONOMETRO */

.restbtn{
width:100%;
margin-top:7px;
background:#333;
color:#fff;
border:1px solid var(--bor);
padding:8px;
border-radius:6px;
font-size:.72rem
}

/* VENTANA DEL CRONOMETRO */

.timerOverlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.72);
z-index:100;
align-items:center;
justify-content:center;
padding:20px
}

.timerBox{
width:min(320px,90vw);
background:var(--card);
border:1px solid var(--bor);
border-radius:16px;
padding:22px;
text-align:center;
box-shadow:0 10px 40px #000
}

.timerTitle{
color:var(--a);
font-size:.9rem;
margin-bottom:8px
}

.timerClock{
font-size:4rem;
font-weight:bold;
letter-spacing:2px;
margin:10px 0 16px;
color:var(--txt)
}

.timerClose{
background:#333;
color:#fff;
border:1px solid var(--bor);
padding:8px 18px;
border-radius:7px;
font-size:.75rem
}

.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:3px;
text-align:center
}

.cal{
padding:7px 2px;
background:var(--item);
border-radius:5px;
font-size:.75rem
}

.cal.on{
background:var(--a);
color:#000;
font-weight:bold
}

.cal.empty{
background:none
}

.statgrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:6px
}

.stat{
background:var(--item);
padding:8px;
border-radius:7px;
text-align:center
}

.stat b{
display:block;
color:var(--a);
font-size:1rem
}

.stat span{
font-size:.66rem;
color:var(--sub)
}

.report{
border-bottom:1px solid var(--bor);
padding:8px 0;
font-size:.76rem
}

.empty{
text-align:center;
color:var(--sub);
padding:15px;
font-size:.8rem
}

.imgbox{
display:none;
text-align:center;
margin:6px 0;
padding:6px;
background:#191919;
border:1px solid var(--bor);
border-radius:7px
}

.imgbox img{
max-width:100%;
max-height:320px;
border-radius:6px
}

.imgbtn{
background:#333;
color:#fff;
border:1px solid var(--bor);
padding:5px 9px;
border-radius:6px;
font-size:.68rem
}

.loaded{
color:var(--blue);
background:#062d3c;
border:1px solid #17607c;
border-radius:6px;
padding:6px;
margin-bottom:8px;
font-size:.7rem
}

.summary{
background:#07351f;
border:1px solid #176b43;
border-radius:9px;
padding:12px;
margin-top:10px
}

.summary h3{
color:var(--a);
font-size:1rem;
margin-bottom:8px;
text-align:center
}

.summary div{
font-size:.78rem;
padding:3px 0
}

.summary .big{
text-align:center;
font-size:1.1rem;
font-weight:bold;
color:var(--a);
margin:6px 0
}

.muscleReport{
background:var(--item);
border:1px solid var(--bor);
border-radius:8px;
padding:9px;
margin:7px 0
}

.muscleReport h3{
color:var(--a);
font-size:.9rem;
margin-bottom:6px
}

.muscleStats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:5px
}

.muscleStat{
text-align:center;
background:#191919;
border-radius:6px;
padding:6px
}

.muscleStat b{
display:block;
color:var(--a);
font-size:.85rem
}

.muscleStat span{
font-size:.6rem;
color:var(--sub)
}

@media(max-width:380px){

td input{
font-size:.7rem;
padding:5px 1px
}

th{
font-size:.58rem
}

.muscleStats{
grid-template-columns:1fr 1fr
}

.timerClock{
font-size:3.4rem
}

}

@media print{

nav,header,button,input,select,canvas,.timerOverlay{
display:none!important
}

body{
background:#fff;
color:#000
}

.card{
border:0;
background:#fff
}

.report{
color:#000
}

}
</style>
</head>

<body>

<header>
<h1>MI GIMNASIO PRO v4.5</h1>
</header>

<div class="container">

<!-- ================= ENTRENAR ================= -->

<section id="tab-entrenar" class="tab active">

<div class="card">

<h2>Selecciona el día</h2>

<div class="days">

<button class="btn out" onclick="selectDay(1)">
Día 1
</button>

<button class="btn out" onclick="selectDay(2)">
Día 2
</button>

<button class="btn out" onclick="selectDay(3)">
Día 3
</button>

<button class="btn out" onclick="selectDay(4)">
Día 4
</button>

</div>

</div>

<div id="work" style="display:none">

<div class="card">

<h2 id="daytitle">Día</h2>

<div id="loadedmsg"></div>

<label>Fecha</label>

<input type="date" id="date">

<div id="form"></div>

<button class="btn" onclick="saveWorkout()">
💾 Guardar entrenamiento
</button>

<div id="summary"></div>

</div>

</div>

</section>


<!-- ================= RUTINA ================= -->

<section id="tab-rutina" class="tab">

<div class="card">

<h2>⚙️ Configurar rutina</h2>

<label>Día</label>

<select id="cfgday" onchange="loadConfig()">

<option value="1">Día 1</option>
<option value="2">Día 2</option>
<option value="3">Día 3</option>
<option value="4">Día 4</option>

</select>

<div id="editor"></div>

<button class="btn" onclick="saveConfig()">
Guardar configuración
</button>

</div>


<div class="card">

<h2>💾 Copia de seguridad</h2>

<button class="btn out" onclick="exportData()">
📦 Exportar JSON
</button>

<br><br>

<button class="btn out" onclick="document.getElementById('file').click()">
📥 Importar JSON
</button>

<input
id="file"
type="file"
accept=".json"
style="display:none"
onchange="importData(event)"
>

</div>

</section>


<!-- ================= CALENDARIO ================= -->

<section id="tab-calendario" class="tab">

<div class="card">

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">

<button class="btn out sm" onclick="month(-1)">
❮
</button>

<h2 id="monthname" style="margin:0"></h2>

<button class="btn out sm" onclick="month(1)">
❯
</button>

</div>

<div class="calendar" id="calendar"></div>

<div id="detail"></div>

</div>

</section>


<!-- ================= INFORMES ================= -->

<section id="tab-informes" class="tab">

<div class="card">

<h2>📊 Resumen</h2>

<div id="stats" class="statgrid"></div>

</div>


<div class="card">

<h2>🏆 Récords</h2>

<div id="records"></div>

</div>


<div class="card">

<h2>📋 Informes por grupo muscular</h2>

<div style="display:flex;gap:5px;flex-wrap:wrap">

<button class="btn out sm" onclick="report(15)">
15 días
</button>

<button class="btn out sm" onclick="report(30)">
30 días
</button>

<button class="btn out sm" onclick="window.print()">
PDF
</button>

</div>

<div id="reports" class="empty">
Selecciona un periodo.
</div>

</div>

</section>

</div>


<!-- ================= MENU INFERIOR ================= -->

<nav>

<button
id="n-entrenar"
class="active"
onclick="tab('entrenar')">
🏋️
<span>Entrenar</span>
</button>

<button
id="n-rutina"
onclick="tab('rutina')">
⚙️
<span>Rutina</span>
</button>

<button
id="n-calendario"
onclick="tab('calendario')">
📅
<span>Calendario</span>
</button>

<button
id="n-informes"
onclick="tab('informes')">
📊
<span>Informes</span>
</button>

</nav>


<!-- ================= VENTANA CRONOMETRO ================= -->

<div id="timerOverlay" class="timerOverlay">

<div class="timerBox">

<div class="timerTitle">
⏱️ DESCANSO
</div>

<div id="timerClock" class="timerClock">
2:00
</div>

<button
class="timerClose"
onclick="closeTimer()">
Cerrar
</button>

</div>

</div>


<script>

"use strict";


/* ================= DATOS ================= */

const K='gym_',

D={
g1:'Grupo 1',
e1:['Ej 1','Ej 2'],
img1:[],
g2:'Grupo 2',
e2:['Ej 1','Ej 2'],
img2:[]
};


let routine=
JSON.parse(localStorage.getItem(K+'routine'))||{},

logs=
JSON.parse(localStorage.getItem(K+'logs'))||[],

day=null,

monthDate=new Date(),

interval=null,

seconds=0,

audioCtx=null,

currentDraft=null;


for(let i=1;i<5;i++){

if(!routine[i]){

routine[i]=
JSON.parse(JSON.stringify(D));

}

}


/* ================= FUNCIONES BASICAS ================= */

const esc=s=>
String(s??'').replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m])
);


const num=v=>
parseFloat(v)||0;


const save=()=>{

localStorage.setItem(
K+'routine',
JSON.stringify(routine)
);

localStorage.setItem(
K+'logs',
JSON.stringify(logs)
);

};


const rm=(w,r)=>
w&&r?w*(1+r/30):0;


const volume=s=>
(s||[]).reduce(
(a,x)=>a+num(x.weight)*num(x.reps),
0
);


/* ================= HISTORIAL ================= */

function history(ex){

let a=[];

logs.forEach(l=>

(l.groups||[]).forEach(g=>

(g.exercises||[]).forEach(e=>{

if(e.name===ex){

a.push({
date:new Date(l.date),
sets:e.sets||[]
});

}

})

)

);

return a.sort(
(a,b)=>a.date-b.date
);

}


function max(ex){

let m=0;

history(ex).forEach(x=>

(x.sets||[]).forEach(s=>

m=Math.max(
m,
num(s.weight)
)

)

);

return m;

}


function maxRM(ex){

let m=0;

history(ex).forEach(x=>

(x.sets||[]).forEach(s=>

m=Math.max(
m,
rm(
num(s.weight),
num(s.reps)
)
)

)

);

return Math.round(m*10)/10;

}


function maxSetRM(s){

return Math.round(

Math.max(
0,
...(s||[]).map(
x=>rm(
num(x.weight),
num(x.reps)
)
)
)*10

)/10;

}


/* ================= NAVEGACION ================= */

function tab(x){

document
.querySelectorAll('.tab')
.forEach(e=>
e.classList.remove('active')
);

document
.getElementById('tab-'+x)
.classList.add('active');


document
.querySelectorAll('nav button')
.forEach(e=>
e.classList.remove('active')
);

document
.getElementById('n-'+x)
.classList.add('active');


if(x==='rutina')
loadConfig();

if(x==='calendario')
renderCalendar();

if(x==='informes'){

stats();
records();

}

}


/* ================= CRONOMETRO ================= */

/*
2 minutos.
Pitido en 3, 2 y 1.
Al llegar a 0 desaparece.
*/

function timer(){

clearInterval(interval);

seconds=120;

document
.getElementById('timerOverlay')
.style.display='flex';

showClock();


try{

audioCtx=
audioCtx||
new(
window.AudioContext||
window.webkitAudioContext
)();

if(audioCtx.state==='suspended')
audioCtx.resume();

}catch(e){}


interval=setInterval(()=>{

seconds--;

showClock();


if(
seconds<=3 &&
seconds>0
){

beep();

}


if(seconds<=0){

clearInterval(interval);

setTimeout(
closeTimer,
450
);

}

},1000);

}


function showClock(){

let m=
Math.floor(seconds/60),

s=
seconds%60;

document
.getElementById('timerClock')
.innerText=
`${m}:${String(s).padStart(2,'0')}`;

}


function beep(){

try{

if(!audioCtx)
return;

let o=
audioCtx.createOscillator(),

g=
audioCtx.createGain();

o.connect(g);

g.connect(
audioCtx.destination
);

o.frequency.value=900;

g.gain.value=.7;

o.start();

o.stop(
audioCtx.currentTime+.18
);

}catch(e){}

}


function closeTimer(){

clearInterval(interval);

interval=null;

seconds=0;

document
.getElementById('timerOverlay')
.style.display='none';

}


/* ================= IMAGEN ================= */

function toggleImage(id){

let e=
document.getElementById(id);

if(e){

e.style.display=
e.style.display==='block'
?'none'
:'block';

}

}


/* ================= ULTIMO ENTRENAMIENTO ================= */

function previousDayLog(d){

let a=
logs.filter(
l=>Number(l.day)===Number(d)
);

return a.length
?
a.sort(
(x,y)=>
new Date(x.date)-
new Date(y.date)
)[a.length-1]
:null;

}


function getPreviousExercise(
log,
name
){

if(!log)
return null;

for(
let g of(log.groups||[])
){

for(
let e of(g.exercises||[])
){

if(e.name===name)
return e;

}

}

return null;

}


/* ================= SERIE VACIA ================= */

function blankSet(){

return{
reps:'',
weight:'',
type:'E'
};

}


/* ================= SELECCIONAR DIA ================= */

function selectDay(d){

day=d;

work.style.display='block';

daytitle.innerText=
'Entrenamiento - Día '+d;

date.value=
new Date()
.toISOString()
.slice(0,10);

summary.innerHTML='';


/*
Borrador individual de la sesión.
Sirve para que los ejercicios guardados
no se pierdan antes del guardado final.
*/

let draftRaw=
localStorage.getItem(
K+'draft_'+d+'_'+date.value
);


currentDraft=
draftRaw
?
JSON.parse(draftRaw)
:
{
day:d,
date:date.value,
exercises:{}
};


let previous=
previousDayLog(d);


loadedmsg.innerHTML=
previous
?
'<div class="loaded">🔄 Datos del último entrenamiento cargados. Puedes modificarlos antes de guardar.</div>'
:'';


let x=
routine[d],

html='';


[
['g1','e1'],
['g2','e2']
].forEach(a=>{

html+=
`<div class="group">
${esc(x[a[0]])}
</div>`;


(x[a[1]]||[])
.forEach((ex,i)=>{

let key=
a[0]+'-'+i,

saved=
currentDraft.exercises[key],

old=
getPreviousExercise(
previous,
ex
),


/*
IMPORTANTE:
si hay datos guardados individualmente,
se cargan esos datos.

Si no los hay:
se carga el último entrenamiento.

Si tampoco existe:
las tres series aparecen vacías.
*/

sets=
saved
?
(saved.sets||[]).slice(0,3)
:
(
old
?
(old.sets||[]).slice(0,3)
:
[]
);


while(
sets.length<3
){

sets.push(
blankSet()
);

}


let lw=
Math.max(
...sets.map(
s=>num(s.weight)
),
0
),


suggestion=
lw
?
Math.round(
lw*1.025*10
)/10
:0,


img=
(
x[
a[0]==='g1'
?'img1'
:'img2'
]||[]
)[i]||'',


iid=
`img-${a[0]}-${i}`;


html+=`

<div class="ex">


<div class="exhead">

<span>
${esc(ex)}
</span>

<span
id="pr-${a[0]}-${i}"
class="badge"
style="display:none">
🏆 PR
</span>

</div>


${
img
?
`

<button
class="imgbtn"
onclick="toggleImage('${iid}')">
🖼️ Ver imagen
</button>


<div
id="${iid}"
class="imgbox">


<img
src="${esc(img)}"
alt="${esc(ex)}"
onerror="this.style.display='none';this.nextElementSibling.style.display='block'">


<div
style="display:none;color:var(--red);font-size:.7rem;padding:5px">
⚠️ No se puede cargar la imagen.
</div>


<br>


<button
class="imgbtn"
onclick="toggleImage('${iid}')">
✕ Cerrar imagen
</button>


</div>

`
:''
}


${
old
?
`

<div class="last">

Último
${new Date(previous.date).toLocaleDateString('es-ES')}:

${sets.map(
(s,j)=>
`S${j+1} ${num(s.reps)}×${num(s.weight)}kg`
).join(' · ')}

</div>

`
:
`
<div class="last">
Sin registro previo
</div>
`
}


${
suggestion
?
`

<div
class="suggest"
onclick="suggest(
'${a[0]}',
${i},
${suggestion}
)">

💡 Propuesta:
${suggestion} kg (+2,5%)

</div>

`
:''
}


<table>

<thead>

<tr>

<th>S</th>
<th>Tipo</th>
<th>Reps</th>
<th>Kg</th>
<th></th>

</tr>

</thead>


<tbody>
`;


sets.forEach((s,j)=>{

html+=`

/* ================= OBTENER SERIES ================= */

function getExerciseSets(g,i){

let sets=[];

for(
let j=0;
j<3;
j++
){

let r=
document.getElementById(
`${g}-${i}-r${j}`
),

w=
document.getElementById(
`${g}-${i}-w${j}`
),

t=
document.getElementById(
`${g}-${i}-t${j}`
);


sets.push({

type:
t
?
t.value
:'E',

reps:
r
?
r.value
:'',

weight:
w
?
w.value
:''

});

}

return sets;

}


/* ================= DATOS REALES ================= */

/*
Una serie solo cuenta si tiene datos.
Así no se cuentan automáticamente
las tres series vacías.
*/

function hasDataSet(s){

return(
num(s.reps)>0 ||
num(s.weight)>0
);

}


/* ================= CALCULOS ================= */

function calc(g,i){

let best=0,
vol=0;


for(
let j=0;
j<3;
j++
){

let r=
document.getElementById(
`${g}-${i}-r${j}`
),

w=
document.getElementById(
`${g}-${i}-w${j}`
);


if(!r||!w)
continue;


let W=
num(w.value),

R=
num(r.value);


if(
W>0 &&
R>0
){

best=
Math.max(
best,
rm(W,R)
);

vol+=
W*R;

}

}


document.getElementById(
`rm-${g}-${i}`
).innerText=

`🔥 1RM estimado: ${
best
?
Math.round(best*10)/10+' kg'
:
'--'
}`;


document.getElementById(
`vol-${g}-${i}`
).innerText=

`📦 Volumen: ${
Math.round(vol*10)/10
} kg`;

}

function suggest(g,i,w){

let e=
document.getElementById(
`${g}-${i}-w2`
);


if(e){

e.value=w;

e.dispatchEvent(
new Event(
'input',
{bubbles:true}
)
);

}

}


/* ================= PR ================= */

function pr(g,i,ex){

let old=
max(ex),

v=0;


for(
let j=0;
j<3;
j++
){

let e=
document.getElementById(
`${g}-${i}-w${j}`
);

if(e)
v=
Math.max(
v,
num(e.value)
);

}


let b=
document.getElementById(
`pr-${g}-${i}`
);


if(b){

b.style.display=
v>old&&old>0
?
'inline'
:
'none';

}

}

/* ================= GUARDAR EJERCICIO ================= */

/*
Guarda solamente el ejercicio actual
en un borrador de la sesión.

IMPORTANTE:
NO lo añade todavía al historial definitivo.

El botón grande "Guardar entrenamiento"
será el que grabe definitivamente
la sesión completa.
*/

function saveExercise(g,i,ex){

if(!day)
return;


let key=
g+'-'+i,

sets=
getExerciseSets(g,i);


/*
Solo consideramos guardado un ejercicio
si al menos una serie tiene datos.
*/

let valid=
sets.some(
s=>hasDataSet(s)
);


if(!valid){

alert(
'Introduce al menos una serie antes de guardar el ejercicio.'
);

return;

}


currentDraft.exercises[key]={
name:ex,
sets:sets.map(s=>({
type:s.type,
reps:num(s.reps),
weight:num(s.weight)
}))
};


/*
Guardamos el borrador en localStorage.
Así, aunque se cambie de pestaña o se recargue,
el ejercicio individual queda conservado.
*/

localStorage.setItem(
K+'draft_'+day+'_'+date.value,
JSON.stringify(currentDraft)
);


let b=
document.getElementById(
`saveex-${g}-${i}`
);


if(b){

b.classList.add('saved');

b.innerText=
'✅ EJERCICIO GUARDADO';

}


/*
Pequeña confirmación visual,
sin utilizar alert.
*/

let old=
document.getElementById(
`save-msg-${g}-${i}`
);


if(old)
old.remove();


let msg=
document.createElement('div');

msg.id=
`save-msg-${g}-${i}`;

msg.style.cssText=
'font-size:.68rem;color:var(--a);text-align:center;padding:4px';

msg.innerText=
'✓ Guardado en la sesión';

b.parentNode.insertBefore(
msg,
b.nextSibling
);

}


/* ================= RECOGER EJERCICIO ================= */

function collectExercise(g,i,ex){

let sets=
getExerciseSets(g,i),

effective=
sets.filter(
s=>
s.type!=='W' &&
hasDataSet(s)
);


return{

name:ex,

sets:sets.map(s=>({

type:s.type,

reps:num(s.reps),

weight:num(s.weight)

})),

effective,

volume:volume(effective),

rm:maxSetRM(effective)

};

}


/* ================= GUARDAR ENTRENAMIENTO ================= */

function saveWorkout(){

if(!day)
return;


let x=
routine[day],

log={

id:Date.now(),

date:
new Date(
date.value+'T12:00:00'
).toISOString(),

day,

groups:[]

},

totalVol=0,

totalSets=0,

totalEx=0,

newPR=0;


/*
IMPORTANTE:
Aquí contamos únicamente las series
que realmente tienen REPETICIONES o PESO.

Por eso, si haces 18 series,
el resultado será 18.
*/

[
['g1','e1'],
['g2','e2']
].forEach(a=>{

let g={
name:x[a[0]],
exercises:[]
};


(x[a[1]]||[])
.forEach((ex,i)=>{

let exercise=
collectExercise(
a[0],
i,
ex
),

effective=
exercise.effective;


/*
No contamos ejercicios completamente vacíos.
*/

if(
effective.length>0
){

totalEx++;

totalSets+=
effective.length;

totalVol+=
exercise.volume;


/*
PR basado en el peso máximo.
*/

let old=
max(ex),

best=
Math.max(
...effective.map(
s=>num(s.weight)
),
0
);


if(
best>old &&
old>0
){

newPR++;

}

}


g.exercises.push({

name:exercise.name,

sets:exercise.sets,

volume:exercise.volume,

rm:exercise.rm

});

});


log.groups.push(g);

});


/*
Si no hay ninguna serie introducida,
no guardamos una sesión vacía.
*/

if(totalSets===0){

alert(
'No hay series introducidas. Introduce los resultados antes de guardar.'
);

return;

}


/*
Eliminamos una sesión anterior
del mismo día y fecha si existiera.

Esto evita duplicados si se pulsa
Guardar entrenamiento dos veces.
*/

logs=
logs.filter(l=>

!(
Number(l.day)===Number(day) &&
String(l.date).slice(0,10)===
String(log.date).slice(0,10)
)

);


logs.push(log);

save();


/*
El borrador ya no hace falta:
la sesión ha quedado guardada definitivamente.
*/

localStorage.removeItem(
K+'draft_'+day+'_'+date.value
);


currentDraft={
day,
date:date.value,
exercises:{}
};


/*
INFORME FINAL
*/

<div>

<div>

/* ================= CALENDARIO ================= */

/*
Se ha corregido la comprobación de fechas.

Los registros se guardan en ISO,
pero el calendario debe compararlos
por fecha local.

Además, se normaliza la fecha del log
antes de compararla.
*/

function getLogLocalDate(l){

if(!l || !l.date)
return null;

let z=
new Date(l.date);

if(isNaN(z.getTime()))
return null;

return{

year:z.getFullYear(),

month:z.getMonth(),

day:z.getDate()

};

}


function hasTrainingOnDate(y,m,d){

return logs.some(l=>{

let z=
getLogLocalDate(l);

return z &&
z.year===y &&
z.month===m &&
z.day===d;

});

}

);

/* ================= INFORMES ================= */

/*
Informes:
- 15 días = quincenal
- 30 días = mensual
- agrupados por grupo muscular
- abdominales excluidos
*/

function isAbsGroup(name){

let n=
String(name||'')
.toLowerCase()
.normalize('NFD')
.replace(
/[\u0300-\u036f]/g,
''
);

return /abdominal|abdomen|\babs\b/.test(n);

}


function report(days){

let cut=
Date.now()-
days*86400000;


let a=
logs
.filter(l=>
new Date(l.date).getTime()>=cut
)
.sort(
(x,y)=>
new Date(x.date)-
new Date(y.date)
);


if(!a.length){

reports.innerHTML=

`<div class="empty">

Sin entrenamientos en ${days} días.

</div>`;

return;

}


let groups={};


a.forEach(l=>

(l.groups||[])
.forEach(g=>{

/*
No incluimos abdominales
en los informes de volumen.
*/

if(
isAbsGroup(g.name)
)
return;


let key=
g.name||
'Sin grupo';


if(!groups[key]){

groups[key]={

volume:0,

sets:0,

exercises:new Set(),

sessions:new Set()

};

}


let z=
groups[key];


z.sessions.add(
l.id||l.date
);


(g.exercises||[])
.forEach(e=>{

/*
Solo series efectivas y con datos.
*/

let effective=
(e.sets||[])
.filter(
s=>
s.type!=='W' &&
hasDataSet(s)
);


if(effective.length){

z.exercises.add(
e.name
);

z.sets+=
effective.length;

z.volume+=
volume(effective);

}

});

})

);


let totalVol=0,

totalSets=0;


let h=`

<div class="report">

<b>

📊

${
days===15
?
'INFORME QUINCENAL (15 DÍAS)'
:
'INFORME MENSUAL (30 DÍAS)'
}

</b>

<br>

<span
style="color:var(--sub)">

Estadísticas agrupadas por grupo muscular · sin abdominales

</span>

</div>

`;


let entries=
Object.entries(groups)
.sort(
(a,b)=>
a[0].localeCompare(
b[0],
'es'
)
);


if(!entries.length){

reports.innerHTML=

h+

'<div class="empty">No hay datos con peso para grupos musculares en este periodo.</div>';

return;

}


entries.forEach(
([name,z])=>{

totalVol+=
z.volume;

totalSets+=
z.sets;


h+=`

<div class="muscleReport">

<h3>

💪 ${esc(name)}

</h3>


<div class="muscleStats">


<div class="muscleStat">

<b>
${Math.round(z.volume)} kg
</b>

<span>
Volumen
</span>

</div>


<div class="muscleStat">

<b>
${z.sets}
</b>

<span>
Series efectivas
</span>

</div>


<div class="muscleStat">

<b>
${z.exercises.size}
</b>

<span>
Ejercicios
</span>

</div>


</div>


<div
style="font-size:.65rem;color:var(--sub);margin-top:6px">

Sesiones:
${z.sessions.size}

</div>


</div>

`;

});


h+=`

<div class="summary">

<h3>

📈 TOTAL DEL PERIODO

</h3>


<div>

📦 <b>
${Math.round(totalVol)} kg
</b>

de volumen efectivo

</div>


<div>

🔢 <b>
${totalSets}
</b>

series efectivas

</div>


<div
style="font-size:.68rem;color:var(--sub);margin-top:5px">

Los abdominales no se incluyen en los kg ni en las estadísticas de volumen.

</div>


</div>

`;


reports.innerHTML=h;

}


/* ================= CAMBIO DE FECHA ================= */

/*
Si el usuario cambia la fecha después de
haber empezado una sesión, reconstruimos
la clave del borrador para esa fecha.
*/

date.addEventListener(
'change',
()=>{

if(!day)
return;


let oldKey=
K+'draft_'+
day+'_old';


/*
No necesitamos mover físicamente el borrador.
Al cambiar la fecha simplemente actualizamos
la fecha del borrador actual.
*/

if(currentDraft){

currentDraft.date=
date.value;

localStorage.setItem(

K+'draft_'+
day+'_'+
date.value,

JSON.stringify(
currentDraft
)

);

}

}
);


/* ================= RECUPERAR BORRADOR ================= */

/*
Cuando se abandona la pantalla Entrenar
no se elimina el borrador.

Así los ejercicios guardados individualmente
permanecen hasta Guardar entrenamiento.
*/


window.addEventListener(
'beforeunload',
()=>{

if(
day &&
currentDraft &&
Object.keys(
currentDraft.exercises||{}
).length
){

currentDraft.date=
date.value;

localStorage.setItem(

K+'draft_'+
day+'_'+
date.value,

JSON.stringify(
currentDraft
)

);

}

}
);


/* ================= INICIO ================= */

renderCalendar();

</script>

</body>
</html>
