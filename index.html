<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym App</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-color: #4CAF50;
            --danger-color: #ff5252;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        h2, h3 {
            margin-top: 0;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-color);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-sizing: border-box;
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
        }

        .day-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .timer-box {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .timer-display {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 10px 0;
            font-family: monospace;
        }

        .timer-presets {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .timer-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #2a2a2a;
            color: white;
            cursor: pointer;
        }

        input[type="number"], input[type="date"], select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #2a2a2a;
            color: white;
            margin-top: 5px;
            box-sizing: border-box;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid var(--border-color);
        }

        nav button {
            background: none;
            border: none;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
            cursor: pointer;
        }

        nav button.active {
            color: var(--accent-color);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .cal-day-name {
            font-weight: bold;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- VISTA 1: ENTRENAR -->
        <div id="tab-entrenar" class="tab-content active">
            <div class="timer-box">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span style="font-size:0.8rem; color:var(--text-secondary);">⏱️ Temporizador</span>
                    <button id="wakelock-btn" class="timer-btn" style="font-size:0.7rem; background:#333;" onclick="toggleWakeLock()">💡 MANTENER PANTALLA: OFF</button>
                </div>
                <div id="timer-display" class="timer-display">00:00</div>
                <div class="timer-presets">
                    <button class="timer-btn" onclick="startTimer(60)">60s</button>
                    <button class="timer-btn" onclick="startTimer(90)">90s</button>
                    <button class="timer-btn" onclick="startTimer(120)">120s</button>
                    <button class="timer-btn" style="color:var(--danger-color);" onclick="stopTimer()">Stop</button>
                </div>
            </div>

            <div class="card">
                <h2>Selecciona el día</h2>
                <div class="day-grid">
                    <button class="btn btn-outline" onclick="selectDay(1)">Día 1</button>
                    <button class="btn btn-outline" onclick="selectDay(2)">Día 2</button>
                    <button class="btn btn-outline" onclick="selectDay(3)">Día 3</button>
                    <button class="btn btn-outline" onclick="selectDay(4)">Día 4</button>
                </div>
            </div>

            <div id="workout-area" style="display: none;">
                <div class="card">
                    <h2 id="current-day-title">Día X</h2>
                   
                    <label for="workout-date" style="font-size: 0.8rem; color: var(--text-secondary);">Fecha del entrenamiento:</label>
                    <input type="date" id="workout-date">

                    <div id="workout-form"></div>
                    <button class="btn" style="margin-top: 15px;" onclick="saveWorkout()">Guardar Entrenamiento</button>
                </div>
            </div>
        </div>

        <!-- VISTA 2: CONFIGURACIÓN DE RUTINA -->
        <div id="tab-rutina" class="tab-content">
            <div class="card">
                <h2>Configurar Rutina</h2>
                <label for="config-day-select">Selecciona Día:</label>
                <select id="config-day-select" onchange="loadRoutineConfig()">
                    <option value="1">Día 1</option>
                    <option value="2">Día 2</option>
                    <option value="3">Día 3</option>
                    <option value="4">Día 4</option>
                </select>
               
                <div id="routine-editor"></div>
                <button class="btn" style="margin-top: 15px;" onclick="saveRoutineConfig()">Guardar Configuración</button>
            </div>

            <div class="card">
                <h2>Copia de Seguridad</h2>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button class="btn btn-outline" onclick="exportData()">📦 Exportar Datos (JSON)</button>
                    <button class="btn btn-outline" onclick="document.getElementById('import-file').click()">📥 Importar Datos (JSON)</button>
                    <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importData(event)">
                </div>
            </div>
        </div>

        <!-- VISTA 3: CALENDARIO -->
        <div id="tab-calendario" class="tab-content">
            <div class="card">
                <div class="calendar-header">
                    <button class="btn btn-outline" style="width:auto; padding: 4px 12px;" onclick="changeMonth(-1)">❮</button>
                    <h2 id="calendar-month-year" style="margin:0;">Mes Año</h2>
                    <button class="btn btn-outline" style="width:auto; padding: 4px 12px;" onclick="changeMonth(1)">❯</button>
                </div>
                <div class="calendar-grid">
                    <div class="cal-day-name">Lu</div>
                    <div class="cal-day-name">Ma</div>
                    <div class="cal-day-name">Mi</div>
                    <div class="cal-day-name">Ju</div>
                    <div class="cal-day-name">Vi</div>
                    <div class="cal-day-name">Sá</div>
                    <div class="cal-day-name">Do</div>
                </div>
                <div class="calendar-grid" id="calendar-body" style="margin-top:5px;"></div>
            </div>

            <div class="card" id="calendar-detail" style="display:none;">
                <h2 id="detail-date-title">Detalle</h2>
                <div id="detail-content"></div>
            </div>
        </div>

        <!-- VISTA 4: INFORMES Y GRÁFICOS -->
        <div id="tab-informes" class="tab-content">
            <div class="card">
                <h2>📈 Progresión de Fuerza</h2>
                <label for="chart-ex-select" style="font-size:0.8rem; color:var(--text-secondary);">Selecciona un Ejercicio:</label>
                <select id="chart-ex-select" onchange="renderProgressChart()">
                    <option value="">-- Elige un ejercicio --</option>
                </select>
                <canvas id="progressChart"></canvas>
            </div>

            <div class="card">
                <h2>Resumen de Sesiones</h2>
                <div style="display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap;">
                    <button class="btn btn-outline" style="flex:1;" onclick="generateReport(15)">Últimos 15 Días</button>
                    <button class="btn btn-outline" style="flex:1;" onclick="generateReport(30)">Último Mes</button>
                    <button class="btn btn-outline" style="width:100%;" onclick="window.print()">🖨️ Imprimir / Guardar en PDF</button>
                </div>
                <div id="report-results" class="report-section">
                    <div class="empty-state">Selecciona un periodo para ver el resumen.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- NAVEGACIÓN INFERIOR -->
    <nav>
        <button id="nav-entrenar" class="active" onclick="switchTab('entrenar')">
            <span>🏋️</span>
            <span>Entrenar</span>
        </button>
        <button id="nav-rutina" onclick="switchTab('rutina')">
            <span>⚙️</span>
            <span>Rutina</span>
        </button>
        <button id="nav-calendario" onclick="switchTab('calendario')">
            <span>📅</span>
            <span>Calendario</span>
        </button>
        <button id="nav-informes" onclick="switchTab('informes')">
            <span>📊</span>
            <span>Informes</span>
        </button>
    </nav>
    <script>
        let routineData = JSON.parse(localStorage.getItem('gym_routine')) || {};
        const defaultDay = { g1: "Grupo 1", e1: ["Ej 1", "Ej 2"], img1: ["",""], g2: "Grupo 2", e2: ["Ej 1", "Ej 2"], img2: ["",""] };
       
        for (let i = 1; i <= 4; i++) {
            if (!routineData[i]) {
                routineData[i] = JSON.parse(JSON.stringify(defaultDay));
            }
        }

        let currentActiveDay = null;
        let timerInterval = null;
        let remainingSeconds = 0;
        let wakeLock = null;

        window.onload = function() {
            const today = new Date().toISOString().split('T')[0];
            const dateInput = document.getElementById('workout-date');
            if (dateInput) dateInput.value = today;
        };

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
           
            document.getElementById(`tab-${tabId}`).classList.add('active');
            document.getElementById(`nav-${tabId}`).classList.add('active');
        }

        /* WAKE LOCK API */
        async function toggleWakeLock() {
            const btn = document.getElementById('wakelock-btn');
            if ('wakeLock' in navigator) {
                try {
                    if (!wakeLock) {
                        wakeLock = await navigator.wakeLock.request('screen');
                        btn.innerText = "💡 MANTENER PANTALLA: ON";
                        btn.style.background = "var(--accent-color)";
                        btn.style.color = "#000";
                    } else {
                        await wakeLock.release();
                        wakeLock = null;
                        btn.innerText = "💡 MANTENER PANTALLA: OFF";
                        btn.style.background = "#333";
                        btn.style.color = "#fff";
                    }
                } catch (err) {
                    alert('No se pudo activar el bloqueo de pantalla.');
                }
            } else {
                alert('Tu navegador no soporta la API Wake Lock.');
            }
        }

        /* TEMPORIZADOR */
        function startTimer(seconds) {
            clearInterval(timerInterval);
            remainingSeconds = seconds;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateTimerDisplay();

                if (remainingSeconds === 3 || remainingSeconds === 2 || remainingSeconds === 1) {
                    playShortBeep();
                } else if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    playFinalBeep();
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            remainingSeconds = 0;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const mins = Math.floor(remainingSeconds / 60);
            const secs = remainingSeconds % 60;
            const display = document.getElementById('timer-display');
            if (display) {
                display.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
        }

        function playShortBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = 600;
                osc.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.12);
            } catch (e) {}
        }

        function playFinalBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = 900;
                osc.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch (e) {}
        }

        /* CÁLCULO DE 1RM Y DATOS PREVIOS */
        function calculate1RM(weight, reps) {
            if (!weight || !reps || reps <= 0) return 0;
            if (reps === 1) return weight;
            return Math.round(weight * (1 + reps / 30));
        }

        function update1RMDisplay(exerciseContainer, exName) {
            if (!exerciseContainer) return;
            const setRows = exerciseContainer.querySelectorAll('.set-row');
            let maxRM = 0;

            setRows.forEach(row => {
                const r = parseInt(row.querySelector('.set-reps').value) || 0;
                const w = parseFloat(row.querySelector('.set-weight').value) || 0;
                const rm = calculate1RM(w, r);
                if (rm > maxRM) maxRM = rm;
            });

            const rmDisplay = exerciseContainer.querySelector('.rm-display');
            if (rmDisplay) {
                rmDisplay.innerText = maxRM > 0 ? `🔥 1RM Est. Máx: ~${maxRM} kg` : `🔥 1RM Est.: -- kg`;
            }
        }

        function getLastExerciseData(exName) {
            const logs = JSON.parse(localStorage.getItem('gym_logs')) || [];
            for (let i = logs.length - 1; i >= 0; i--) {
                const log = logs[i];
                if (!log.groups) continue;
                for (let g of log.groups) {
                    for (let e of g.exercises) {
                        if (e.name === exName) {
                            const dateStr = new Date(log.date).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });
                            return { date: dateStr, sets: e.sets || [{ reps: e.reps, weight: e.weight }] };
                        }
                    }
                }
            }
            return null;
        }

        /* DIBUJAR FORMULARIO DE ENTRENAMIENTO */
        function selectDay(dayNum) {
            currentActiveDay = dayNum;
            document.getElementById('workout-area').style.display = 'block';
            document.getElementById('current-day-title').innerText = `Día ${dayNum}`;
            renderWorkoutForm(dayNum);
        }

        function renderWorkoutForm(dayNum) {
            const dayData = routineData[dayNum];
            const container = document.getElementById('workout-form');
            container.innerHTML = '';

            if (!dayData) return;

            const groups = [
                { name: dayData.g1, exercises: dayData.e1 },
                { name: dayData.g2, exercises: dayData.e2 }
            ];

            groups.forEach((group, gIdx) => {
                if (!group.name) return;
                const groupTitle = document.createElement('h3');
                groupTitle.innerText = group.name;
                groupTitle.style.marginTop = '15px';
                container.appendChild(groupTitle);

                if (!group.exercises) return;

                group.exercises.forEach((exName, exIdx) => {
                    if (!exName) return;
                    const exDiv = document.createElement('div');
                    exDiv.className = 'card exercise-item';
                    exDiv.setAttribute('data-ex-name', exName);

                    const lastData = getLastExerciseData(exName);
                    let lastText = 'Sin registros previos';
                    if (lastData) {
                        const setsStr = lastData.sets.map(s => `${s.reps}x${s.weight}kg`).join(' | ');
                        lastText = `Último (${lastData.date}): ${setsStr}`;
                    }

                    const containerId = `sets-container-${gIdx}-${exIdx}`;

                    exDiv.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <strong>${exName}</strong>
                            <span class="rm-display" style="font-size:0.8rem; color:var(--text-secondary);">🔥 1RM Est.: -- kg</span>
                        </div>
                        <div style="font-size:0.75rem; color:#aaa; margin: 4px 0 10px 0;">${lastText}</div>
                        <div id="${containerId}" class="sets-list"></div>
                        <button type="button" class="btn btn-outline" style="margin-top:8px; font-size:0.8rem; padding:4px 8px;" onclick="addSetRow('${containerId}', 10, '', '${exName}')">+ Añadir Serie</button>
                    `;

                    container.appendChild(exDiv);

                    if (lastData && lastData.sets.length > 0) {
                        lastData.sets.forEach(s => addSetRow(containerId, s.reps, s.weight, exName));
                    } else {
                        addSetRow(containerId, 10, '', exName);
                        addSetRow(containerId, 10, '', exName);
                        addSetRow(containerId, 10, '', exName);
                    }
                });
            });
        }

        /* AÑADIR Y BORRAR FILAS DE SERIES */
        function addSetRow(containerId, reps = 10, weight = '', exName = '') {
            const container = document.getElementById(containerId);
            if (!container) return;

            const setNum = container.children.length + 1;
            const row = document.createElement('div');
            row.className = 'set-row';
            row.style.display = 'flex';
            row.style.gap = '8px';
            row.style.alignItems = 'center';
            row.style.marginTop = '6px';

            row.innerHTML = `
                <span class="set-label" style="min-width:25px; font-weight:bold;">S${setNum}</span>
                <input type="number" inputmode="numeric" class="set-reps" value="${reps}" placeholder="Reps" style="width:70px;" oninput="update1RMDisplay(this.closest('.exercise-item'), '${exName}')">
                <input type="number" inputmode="decimal" step="0.5" class="set-weight" value="${weight}" placeholder="Kg" style="width:70px;" oninput="update1RMDisplay(this.closest('.exercise-item'), '${exName}')">
                <button type="button" class="btn-del-set" style="background:none; border:none; color:red; font-size:1.2rem; cursor:pointer;" onclick="removeSetRow(this, '${containerId}', '${exName}')">×</button>
            `;

            container.appendChild(row);
            const exItem = container.closest('.exercise-item');
            if (exItem) update1RMDisplay(exItem, exName);
        }

        function removeSetRow(btn, containerId, exName) {
            const container = document.getElementById(containerId);
            if (container && container.children.length > 1) {
                const exItem = btn.closest('.exercise-item');
                btn.parentElement.remove();

                Array.from(container.children).forEach((child, idx) => {
                    const label = child.querySelector('.set-label');
                    if (label) label.innerText = `S${idx + 1}`;
                });
                if (exItem) update1RMDisplay(exItem, exName);
            } else {
                alert('Debe haber al menos una serie por ejercicio.');
            }
        }

        /* GUARDAR ENTRENAMIENTO EN LOCALSTORAGE */
        function saveWorkout() {
            const dateInput = document.getElementById('workout-date').value;
            if (!dateInput) {
                alert('Por favor selecciona una fecha.');
                return;
            }

            const workoutLog = {
                date: dateInput,
                day: currentActiveDay,
                groups: []
            };

            const exerciseItems = document.querySelectorAll('#workout-form .exercise-item');
            let currentGroup = { name: "General", exercises: [] };

            exerciseItems.forEach(item => {
                const exName = item.getAttribute('data-ex-name');
                const setRows = item.querySelectorAll('.set-row');
                const sets = [];

                setRows.forEach(row => {
                    const reps = parseInt(row.querySelector('.set-reps').value) || 0;
                    const weight = parseFloat(row.querySelector('.set-weight').value) || 0;
                    sets.push({ reps, weight });
                });

                currentGroup.exercises.push({ name: exName, sets: sets });
            });

            workoutLog.groups.push(currentGroup);

            const logs = JSON.parse(localStorage.getItem('gym_logs')) || [];
            logs.push(workoutLog);
            localStorage.setItem('gym_logs', JSON.stringify(logs));

            alert('¡Entrenamiento guardado con éxito!');
            document.getElementById('workout-area').style.display = 'none';
        }

        /* EXPORTAR E IMPORTAR DATOS JSON */
        function exportData() {
            const data = {
                routine: JSON.parse(localStorage.getItem('gym_routine')),
                logs: JSON.parse(localStorage.getItem('gym_logs'))
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `gym_backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const parsedData = JSON.parse(e.target.result);
                    if (parsedData.routine) localStorage.setItem('gym_routine', JSON.stringify(parsedData.routine));
                    if (parsedData.logs) localStorage.setItem('gym_logs', JSON.stringify(parsedData.logs));
                    alert('¡Copia de seguridad restaurada correctamente!');
                    location.reload();
                } catch (err) {
                    alert('Error al leer el archivo JSON. Asegúrate de que es una copia válida.');
                }
            };
            fileReader.readAsText(event.target.files[0]);
        }
    </script>
</body>
</html>
