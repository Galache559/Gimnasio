<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gimnasio v2.0</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gimnasio">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00e676;
            --text-color: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: #333333;
            --danger-color: #ff5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 90px;
        }

        header {
            background-color: var(--card-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            font-size: 1.4rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid var(--border-color);
            z-index: 1000;
        }

        nav button {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            width: 25%;
        }

        nav button.active {
            color: var(--accent-color);
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--accent-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            text-align: center;
            font-size: 0.95rem;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        input, select {
            width: 100%;
            padding: 10px;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .exercise-item {
            background-color: #252525;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .exercise-header {
            font-weight: bold;
            margin-bottom: 6px;
            color: #fff;
        }

        .exercise-img {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            background-color: #1a1a1a;
            border-radius: 6px;
            margin-bottom: 8px;
            display: block;
            border: 1px solid var(--border-color);
        }

        .last-data {
            font-size: 0.75rem;
            color: var(--accent-color);
            background-color: rgba(0, 230, 118, 0.1);
            border: 1px solid rgba(0, 230, 118, 0.3);
            padding: 6px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .metrics-grid div {
            display: flex;
            flex-direction: column;
        }

        .metrics-grid label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        .metrics-grid input {
            margin-bottom: 0;
            text-align: center;
        }

        .group-title {
            color: var(--text-secondary);
            margin: 15px 0 8px 0;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        .report-section {
            margin-top: 15px;
        }

        .report-item {
            border-bottom: 1px solid var(--border-color);
            padding: 10px 0;
        }

        .report-item:last-child {
            border-bottom: none;
        }

        .report-date {
            font-size: 0.8rem;
            color: var(--accent-color);
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 20px;
            font-size: 0.9rem;
        }

        /* Calendario Styles */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }

        .cal-day-name {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: bold;
            padding: 5px 0;
        }

        .cal-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background-color: #252525;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .cal-day.empty {
            background-color: transparent;
            cursor: default;
        }

        .cal-day.has-workout {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mi Gimnasio</h1>
    </header>

    <div class="container">
        <!-- VISTA 1: ENTRENAR -->
        <div id="tab-entrenar" class="tab-content active">
            <div class="card">
                <h2>Selecciona el día</h2>
                <div class="day-grid">
                    <button class="btn btn-outline" onclick="selectDay(1)">Día 1</button>
                    <button class="btn btn-outline" onclick="selectDay(2)">Día 2</button>
                    <button class="btn btn-outline" onclick="selectDay(3)">Día 3</button>
                    <button class="btn btn-outline" onclick="selectDay(4)">Día 4</button>
                </div>
            </div>

            <div id="workout-area" style="display: none;">
                <div class="card">
                    <h2 id="current-day-title">Día X</h2>
                    
                    <!-- SELECTOR DE FECHA -->
                    <label for="workout-date" style="font-size: 0.8rem; color: var(--text-secondary);">Fecha del entrenamiento:</label>
                    <input type="date" id="workout-date">

                    <div id="workout-form"></div>
                    <button class="btn" style="margin-top: 15px;" onclick="saveWorkout()">Guardar Entrenamiento</button>
                </div>
            </div>
        </div>

        <!-- VISTA 2: CONFIGURACIÓN DE RUTINA -->
        <div id="tab-rutina" class="tab-content">
            <div class="card">
                <h2>Configurar Rutina</h2>
                <label for="config-day-select">Selecciona Día:</label>
                <select id="config-day-select" onchange="loadRoutineConfig()">
                    <option value="1">Día 1</option>
                    <option value="2">Día 2</option>
                    <option value="3">Día 3</option>
                    <option value="4">Día 4</option>
                </select>
                
                <div id="routine-editor"></div>
                <button class="btn" style="margin-top: 15px;" onclick="saveRoutineConfig()">Guardar Configuración</button>
            </div>

            <!-- SECCIÓN COPIA DE SEGURIDAD -->
            <div class="card">
                <h2>Copia de Seguridad</h2>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button class="btn btn-outline" onclick="exportData()">📦 Exportar Datos (JSON)</button>
                    <button class="btn btn-outline" onclick="document.getElementById('import-file').click()">📥 Importar Datos (JSON)</button>
                    <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importData(event)">
                </div>
            </div>
        </div>

        <!-- VISTA 3: CALENDARIO -->
        <div id="tab-calendario" class="tab-content">
            <div class="card">
                <div class="calendar-header">
                    <button class="btn btn-outline" style="width:auto; padding: 4px 12px;" onclick="changeMonth(-1)">❮</button>
                    <h2 id="calendar-month-year" style="margin:0;">Mes Año</h2>
                    <button class="btn btn-outline" style="width:auto; padding: 4px 12px;" onclick="changeMonth(1)">❯</button>
                </div>
                <div class="calendar-grid">
                    <div class="cal-day-name">Lu</div>
                    <div class="cal-day-name">Ma</div>
                    <div class="cal-day-name">Mi</div>
                    <div class="cal-day-name">Ju</div>
                    <div class="cal-day-name">Vi</div>
                    <div class="cal-day-name">Sá</div>
                    <div class="cal-day-name">Do</div>
                </div>
                <div class="calendar-grid" id="calendar-body" style="margin-top:5px;"></div>
            </div>

            <div class="card" id="calendar-detail" style="display:none;">
                <h2 id="detail-date-title">Detalle</h2>
                <div id="detail-content"></div>
            </div>
        </div>

        <!-- VISTA 4: INFORMES -->
        <div id="tab-informes" class="tab-content">
            <div class="card">
                <h2>Informes de Progreso</h2>
                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <button class="btn btn-outline" onclick="generateReport(15)">Últimos 15 Días</button>
                    <button class="btn btn-outline" onclick="generateReport(30)">Último Mes</button>
                </div>
                <div id="report-results" class="report-section">
                    <div class="empty-state">Selecciona un periodo para ver el resumen.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- NAVEGACIÓN INFERIOR -->
    <nav>
        <button id="nav-entrenar" class="active" onclick="switchTab('entrenar')">
            <span>🏋️</span>
            <span>Entrenar</span>
        </button>
        <button id="nav-rutina" onclick="switchTab('rutina')">
            <span>⚙️</span>
            <span>Rutina</span>
        </button>
        <button id="nav-calendario" onclick="switchTab('calendario')">
            <span>📅</span>
            <span>Calendario</span>
        </button>
        <button id="nav-informes" onclick="switchTab('informes')">
            <span>📊</span>
            <span>Informes</span>
        </button>
    </nav>

    <script>
        let routineData = JSON.parse(localStorage.getItem('gym_routine')) || {};
        const defaultDay = { g1: "Grupo 1", e1: ["Ej 1", "Ej 2", "Ej 3", "Ej 4", "Ej 5"], img1: ["","","","",""], g2: "Grupo 2", e2: ["Ej 1", "Ej 2", "Ej 3", "Ej 4", "Ej 5"], img2: ["","","","",""] };
        
        for (let i = 1; i <= 4; i++) {
            if (!routineData[i]) {
                routineData[i] = JSON.parse(JSON.stringify(defaultDay));
            } else {
                if (!routineData[i].img1) routineData[i].img1 = ["","","","",""];
                if (!routineData[i].img2) routineData[i].img2 = ["","","","",""];
            }
        }

        let currentActiveDay = null;
        let currentCalendarDate = new Date();

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`tab-${tabId}`).classList.add('active');
            document.getElementById(`nav-${tabId}`).classList.add('active');

            if (tabId === 'rutina') loadRoutineConfig();
            if (tabId === 'calendario') renderCalendar();
        }

        function loadRoutineConfig() {
            const day = document.getElementById('config-day-select').value;
            const data = routineData[day] || defaultDay;
            const container = document.getElementById('routine-editor');
            
            const g1Name = data.g1 || "Grupo 1";
            const g2Name = data.g2 || "Grupo 2";
            const e1List = data.e1 || [];
            const e2List = data.e2 || [];
            const img1List = data.img1 || [];
            const img2List = data.img2 || [];

            let html = `
                <div class="group-title">Grupo Muscular 1</div>
                <input type="text" id="g1-name" value="${g1Name}" placeholder="Nombre Grupo 1">
                <div class="group-title">Ejercicios Grupo 1</div>
            `;
            for(let i=0; i<5; i++) {
                const val = e1List[i] !== undefined ? e1List[i] : `Ej ${i+1}`;
                const imgVal = img1List[i] || "";
                html += `
                    <div style="background:#252525; padding:8px; border-radius:6px; margin-bottom:10px;">
                        <input type="text" class="g1-ex" value="${val}" placeholder="Nombre Ejercicio ${i+1}">
                        <input type="text" class="g1-img" value="${imgVal}" placeholder="URL Imagen/GIF Ejercicio ${i+1}" style="font-size:0.8rem; margin-bottom:0;">
                    </div>
                `;
            }

            html += `
                <div class="group-title" style="margin-top:20px;">Grupo Muscular 2</div>
                <input type="text" id="g2-name" value="${g2Name}" placeholder="Nombre Grupo 2">
                <div class="group-title">Ejercicios Grupo 2</div>
            `;
            for(let i=0; i<5; i++) {
                const val = e2List[i] !== undefined ? e2List[i] : `Ej ${i+1}`;
                const imgVal = img2List[i] || "";
                html += `
                    <div style="background:#252525; padding:8px; border-radius:6px; margin-bottom:10px;">
                        <input type="text" class="g2-ex" value="${val}" placeholder="Nombre Ejercicio ${i+1}">
                        <input type="text" class="g2-img" value="${imgVal}" placeholder="URL Imagen/GIF Ejercicio ${i+1}" style="font-size:0.8rem; margin-bottom:0;">
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function saveRoutineConfig() {
            const day = document.getElementById('config-day-select').value;
            const g1Name = document.getElementById('g1-name').value;
            const g2Name = document.getElementById('g2-name').value;
            
            const e1Inputs = document.querySelectorAll('.g1-ex');
            const img1Inputs = document.querySelectorAll('.g1-img');
            const e2Inputs = document.querySelectorAll('.g2-ex');
            const img2Inputs = document.querySelectorAll('.g2-img');
            
            let e1 = [], img1 = [], e2 = [], img2 = [];
            e1Inputs.forEach((input, i) => e1.push(input.value || `Ej ${i+1}`));
            img1Inputs.forEach((input) => img1.push(input.value || ""));
            e2Inputs.forEach((input, i) => e2.push(input.value || `Ej ${i+1}`));
            img2Inputs.forEach((input) => img2.push(input.value || ""));

            routineData[day] = { g1: g1Name, e1: e1, img1: img1, g2: g2Name, e2: e2, img2: img2 };
            localStorage.setItem('gym_routine', JSON.stringify(routineData));
            alert('¡Rutina guardada correctamente!');
        }

        function getLastExerciseData(exName) {
            const logs = JSON.parse(localStorage.getItem('gym_logs')) || [];
            for (let i = logs.length - 1; i >= 0; i--) {
                const log = logs[i];
                for (let g of log.groups) {
                    for (let e of g.exercises) {
                        if (e.name === exName) {
                            const dateStr = new Date(log.date).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });
                            return { date: dateStr, weight: e.weight, series: e.series, reps: e.reps };
                        }
                    }
                }
            }
            return null;
        }

        function selectDay(day) {
            currentActiveDay = day;
            document.getElementById('workout-area').style.display = 'block';
            document.getElementById('current-day-title').innerText = `Entrenamiento - Día ${day}`;
            
            // Establece la fecha de hoy por defecto en el input date
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('workout-date').value = today;

            const data = routineData[day] || defaultDay;
            const container = document.getElementById('workout-form');
            let html = '';

            const renderGroup = (groupName, exercises, images, groupPrefix) => {
                let gHtml = `<div class="group-title">${groupName || 'Grupo'}</div>`;
                (exercises || []).forEach((ex, index) => {
                    const imgUrl = (images && images[index]) ? images[index] : "";
                    const lastData = getLastExerciseData(ex);
                    
                    let lastInfoHtml = `<div class="last-data">Sin registros previos de este ejercicio</div>`;
                    let defaultSeries = 4;
                    let defaultReps = 10;
                    let defaultWeight = "";

                    if (lastData) {
                        lastInfoHtml = `<div class="last-data">Último entrenamiento (${lastData.date}): ${lastData.series}x${lastData.reps} con ${lastData.weight} kg</div>`;
                        defaultSeries = lastData.series;
                        defaultReps = lastData.reps;
                        defaultWeight = lastData.weight;
                    }

                    gHtml += `
                        <div class="exercise-item">
                            <div class="exercise-header">${ex}</div>
                            ${imgUrl ? `<img src="${imgUrl}" class="exercise-img" alt="${ex}">` : ''}
                            ${lastInfoHtml}
                            <div class="metrics-grid">
                                <div>
                                    <label>Series</label>
                                    <input type="number" id="${groupPrefix}_ex_${index}_s" value="${defaultSeries}">
                                </div>
                                <div>
                                    <label>Reps</label>
                                    <input type="number" id="${groupPrefix}_ex_${index}_r" value="${defaultReps}">
                                </div>
                                <div>
                                    <label>Peso (kg)</label>
                                    <input type="number" step="0.5" id="${groupPrefix}_ex_${index}_p" value="${defaultWeight}" placeholder="0">
                                </div>
                            </div>
                        </div>
                    `;
                });
                return gHtml;
            };

            html += renderGroup(data.g1, data.e1, data.img1, 'g1');
            html += renderGroup(data.g2, data.e2, data.img2, 'g2');
            container.innerHTML = html;
        }

        function saveWorkout() {
            if (!currentActiveDay) return;

            const selectedDateVal = document.getElementById('workout-date').value;
            const dateObj = selectedDateVal ? new Date(selectedDateVal + 'T12:00:00') : new Date();

            const dayData = routineData[currentActiveDay];
            const workoutLog = { date: dateObj.toISOString(), day: currentActiveDay, groups: [] };

            const processGroup = (groupName, exercises, groupPrefix) => {
                let groupLog = { name: groupName, exercises: [] };
                (exercises || []).forEach((ex, index) => {
                    const sInput = document.getElementById(`${groupPrefix}_ex_${index}_s`);
                    const rInput = document.getElementById(`${groupPrefix}_ex_${index}_r`);
                    const pInput = document.getElementById(`${groupPrefix}_ex_${index}_p`);

                    const series = sInput ? sInput.value : 0;
                    const reps = rInput ? rInput.value : 0;
                    const weight = pInput && pInput.value !== "" ? parseFloat(pInput.value) : 0;

                    groupLog.exercises.push({ name: ex, series: series, reps: reps, weight: weight });
                });
                return groupLog;
            };

            workoutLog.groups.push(processGroup(dayData.g1, dayData.e1, 'g1'));
            workoutLog.groups.push(processGroup(dayData.g2, dayData.e2, 'g2'));

            let logs = JSON.parse(localStorage.getItem('gym_logs')) || [];
            logs.push(workoutLog);
            localStorage.setItem('gym_logs', JSON.stringify(logs));

            alert('¡Entrenamiento guardado correctamente!');
            document.getElementById('workout-area').style.display = 'none';
        }

        function changeMonth(delta) {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + delta);
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            
            document.getElementById('calendar-month-year').innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const logs = JSON.parse(localStorage.getItem('gym_logs')) || [];
            const body = document.getElementById('calendar-body');
            body.innerHTML = '';

            for (let i = 0; i < firstDayIndex; i++) {
                body.innerHTML += `<div class="cal-day empty"></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dayDateStr = new Date(year, month, day).toDateString();
                const hasLog = logs.some(l => new Date(l.date).toDateString() === dayDateStr);
                const activeClass = hasLog ? 'has-workout' : '';
                body.innerHTML += `<div class="cal-day ${activeClass}" onclick="showDayDetail('${year}-${month+1}-${day}')">${day}</div>`;
            }

            document.getElementById('calendar-detail').style.display = 'none';
        }

        function showDayDetail(dateStr) {
            const parts = dateStr.split('-');
            const targetDate = new Date(parts[0], parts[1] - 1, parts[2]);
            const logs = JSON.parse(localStorage.getItem('gym_logs')) || [];
            
            const dayLogs = logs.filter(l => new Date(l.date).toDateString() === targetDate.toDateString());
            const detailCard = document.getElementById('calendar-detail');
            const detailTitle = document.getElementById('detail-date-title');
            const detailContent = document.getElementById('detail-content');

            detailTitle.innerText = targetDate.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });

            if (dayLogs.length === 0) {
                detailContent.innerHTML = `<div class="empty-state">No se registró entrenamiento este día.</div>`;
            } else {
                let html = '';
                dayLogs.forEach(log => {
                    html += `<div style="font-size:0.9rem; font-weight:bold; color:var(--accent-color); margin-bottom:6px;">Entrenamiento - Día ${log.day}</div>`;
                    log.groups.forEach(g => {
                        html += `<div style="font-size:0.85rem; font-weight:bold; margin-top:5px;">${g.name}:</div>`;
                        g.exercises.forEach(e => {
                            html += `<div style="font-size:0.8rem; color:var(--text-secondary); margin-left:8px;">• ${e.name}: ${e.series}x${e.reps} (${e.weight} kg)</div>`;
                        });
                    });
                });
                detailContent.innerHTML = html;
            }

            detailCard.style.display = 'block';
        }

        function generateReport(days) {
            const logs = JSON.parse(localStorage.getItem('gym_logs')) || [];
            const container = document.getElementById('report-results');
            
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - days);

            const filteredLogs = logs.filter(log => new Date(log.date) >= cutoffDate);

            if (filteredLogs.length === 0) {
                container.innerHTML = `<div class="empty-state">No hay entrenamientos registrados en los últimos ${days} días.</div>`;
                return;
            }

            let html = `<p style="margin-bottom:10px; color: var(--accent-color);">Total sesiones realizadas: <strong>${filteredLogs.length}</strong></p>`;

            filteredLogs.slice().reverse().forEach(log => {
                const dateStr = new Date(log.date).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
                html += `<div class="report-item"><div class="report-date">${dateStr} - Día ${log.day}</div>`;
                
                log.groups.forEach(g => {
                    html += `<div style="font-size:0.85rem; font-weight:bold; margin-top:5px;">${g.name}:</div>`;
                    g.exercises.forEach(e => {
                        html += `<div style="font-size:0.8rem; color: var(--text-secondary); margin-left:8px;">• ${e.name}: ${e.series}x${e.reps} con ${e.weight} kg</div>`;
                    });
                });

                html += `</div>`;
            });

            container.innerHTML = html;
        }

        /* FUNCIONES DE COPIA DE SEGURIDAD */
        function exportData() {
            const dataToExport = {
                gym_routine: JSON.parse(localStorage.getItem('gym_routine')),
                gym_logs: JSON.parse(localStorage.getItem('gym_logs'))
            };
            
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataToExport, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `Copia_Gimnasio_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (importedData.gym_routine) {
                        localStorage.setItem('gym_routine', JSON.stringify(importedData.gym_routine));
                        routineData = importedData.gym_routine;
                    }
                    if (importedData.gym_logs) {
                        localStorage.setItem('gym_logs', JSON.stringify(importedData.gym_logs));
                    }
                    alert('¡Datos importados con éxito!');
                    location.reload();
                } catch (err) {
                    alert('Error al leer el archivo. Asegúrate de que sea un JSON válido.');
                }
            };
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0]);
            }
        }
    </script>
</body>
</html>
