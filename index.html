<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gimnasio</title>
    <!-- Configuración para PWA / Pantalla completa en Móvil -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gimnasio">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00e676;
            --text-color: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: #333333;
            --danger-color: #ff5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 80px;
        }

        header {
            background-color: var(--card-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            font-size: 1.4rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid var(--border-color);
            z-index: 1000;
        }

        nav button {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            width: 33%;
        }

        nav button.active {
            color: var(--accent-color);
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--accent-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            text-align: center;
            font-size: 0.95rem;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.8rem;
            width: auto;
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: #fff;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .exercise-item {
            background-color: #252525;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .exercise-header {
            font-weight: bold;
            margin-bottom: 8px;
            color: #fff;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .metrics-grid div {
            display: flex;
            flex-direction: column;
        }

        .metrics-grid label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        .metrics-grid input {
            margin-bottom: 0;
            text-align: center;
        }

        .group-title {
            font-size: 1rem;
            color: var(--text-secondary);
            margin: 15px 0 8px 0;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        .report-section {
            margin-top: 15px;
        }

        .report-item {
            border-bottom: 1px solid var(--border-color);
            padding: 10px 0;
        }

        .report-item:last-child {
            border-bottom: none;
        }

        .report-date {
            font-size: 0.8rem;
            color: var(--accent-color);
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mi Gimnasio</h1>
    </header>

    <div class="container">
        <!-- VISTA 1: ENTRENAR -->
        <div id="tab-entrenar" class="tab-content active">
            <div class="card">
                <h2>Selecciona el día</h2>
                <div class="day-grid">
                    <button class="btn btn-outline" onclick="selectDay(1)">Día 1</button>
                    <button class="btn btn-outline" onclick="selectDay(2)">Día 2</button>
                    <button class="btn btn-outline" onclick="selectDay(3)">Día 3</button>
                    <button class="btn btn-outline" onclick="selectDay(4)">Día 4</button>
                </div>
            </div>

            <div id="workout-area" style="display: none;">
                <div class="card">
                    <h2 id="current-day-title">Día X</h2>
                    <div id="workout-form"></div>
                    <button class="btn" style="margin-top: 15px;" onclick="saveWorkout()">Guardar Entrenamiento</button>
                </div>
            </div>
        </div>

        <!-- VISTA 2: CONFIGURACIÓN DE RUTINA -->
        <div id="tab-rutina" class="tab-content">
            <div class="card">
                <h2>Configurar Rutina</h2>
                <label>Selecciona Día:</label>
                <select id="config-day-select" onchange="loadRoutineConfig()">
                    <option value="1">Día 1</option>
                    <option value="2">Día 2</option>
                    <option value="3">Día 3</option>
                    <option value="4">Día 4</option>
                </select>
                
                <div id="routine-editor"></div>
                <button class="btn" style="margin-top: 15px;" onclick="saveRoutineConfig()">Guardar Configuración</button>
            </div>
        </div>

        <!-- VISTA 3: INFORMES -->
        <div id="tab-informes" class="tab-content">
            <div class="card">
                <h2>Informes de Progreso</h2>
                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <button class="btn btn-outline" onclick="generateReport(15)">Últimos 15 Días</button>
                    <button class="btn btn-outline" onclick="generateReport(30)">Último Mes</button>
                </div>
                <div id="report-results" class="report-section">
                    <div class="empty-state">Selecciona un periodo para ver el resumen.</div>
                </div>
            </div>
        </div>
    </div>

    <nav>
        <button id="nav-entrenar" class="active" onclick="switchTab('entrenar')">
            <span>🏋️</span>
            <span>Entrenar</span>
        </button>
        <button id="nav-rutina" onclick="switchTab('rutina')">
            <span>⚙️</span>
            <span>Rutina</span>
        </button>
        <button id="nav-informes" onclick="switchTab('informes')">
            <span>📊</span>
            <span>Informes</span>
        </button>
    </nav>

    <script>
        // Estructura de datos por defecto
        let routineData = JSON.parse(localStorage.getItem('gym_routine')) || {
            1: { g1: "Grupo 1", e1: ["Ej 1", "Ej 2", "Ej 3", "Ej 4", "Ej 5"], g2: "Grupo 2", e2: ["Ej 1", "Ej 2", "Ej 3", "Ej 4", "Ej 5"] },
            2: { g1: "Grupo 1", e1: ["Ej 1", "Ej 2", "Ej 3", "Ej 4", "Ej 5"], g2: "Grupo 2", e2: ["Ej 1", "Ej 2", "Ej 3", "Ej 4", "Ej 5"] },
            3: { g1: "Grupo 1", e1: ["Ej 1", "Ej 2", "Ej 3", "Ej 4", "Ej 5"], g2: "Grupo 2", e2: ["Ej 1", "Ej 2", "Ej 3", "Ej 4", "Ej 5"] },
            4: { g1: "Grupo 1", e1: ["Ej 1", "Ej 2", "Ej 3", "Ej 4", "Ej 5"], g2: "Grupo 2", e2: ["Ej 1", "Ej 2", "Ej 3", "Ej 4", "Ej 5"] }
        };

        let currentActiveDay = null;

        // Cambio de pestañas
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`tab-${tabId}`).classList.add('active');
            document.getElementById(`nav-${tabId}`).classList.add('active');

            if (tabId === 'rutina') loadRoutineConfig();
        }

        // Cargar vista de edición de rutina
        function loadRoutineConfig() {
            const day = document.getElementById('config-day-select').value;
            const data = routineData[day];
            const container = document.getElementById('routine-editor');
            
            let html = `
                <div class="group-title">Grupo Muscular 1</div>
                <input type="text" id="g1-name" value="${data.g1}" placeholder="Nombre Grupo 1 (Ej: Pecho)">
                <div class="group-title">Ejercicios Grupo 1 (5)</div>
            `;
            for(let i=0; i<5; i++) {
                html += `<input type="text" class="g1-ex" value="${data.e1[i] || ''}" placeholder="Ejercicio ${i+1}">`;
            }

            html += `
                <div class="group-title" style="margin-top:20px;">Grupo Muscular 2</div>
                <input type="text" id="g2-name" value="${data.g2}" placeholder="Nombre Grupo 2 (Ej: Tríceps)">
                <div class="group-title">Ejercicios Grupo 2 (5)</div>
            `;
            for(let i=0; i<5; i++) {
                html += `<input type="text" class="g2-ex" value="${data.e2[i] || ''}" placeholder="Ejercicio ${i+1}">`;
            }

            container.innerHTML = html;
        }

        // Guardar configuración de la rutina
        function saveRoutineConfig() {
            const day = document.getElementById('config-day-select').value;
            const g1Name = document.getElementById('g1-name').value;
            const g2Name = document.getElementById('g2-name').value;
            
            const e1Inputs = document.querySelectorAll('.g1-ex');
            const e2Inputs = document.querySelectorAll('.g2-ex');
            
            let e1 = [], e2 = [];
            e1Inputs.forEach(input => e1.push(input.value || "Ejercicio libre"));
            e2Inputs.forEach(input => e2.push(input.value || "Ejercicio libre"));

            routineData[day] = { g1: g1Name, e1: e1, g2: g2Name, e2: e2 };
            localStorage.setItem('gym_routine', JSON.stringify(routineData));
            alert('¡Rutina del Día ' + day + ' guardada con éxito!');
        }

        // Seleccionar día para entrenar
        function selectDay(day) {
            currentActiveDay = day;
            document.getElementById('workout-area').style.display = 'block';
            document.getElementById('current-day-title').innerText = `Entrenamiento - Día ${day}`;
            
            const data = routineData[day];
            const container = document.getElementById('workout-form');
            let html = '';

            const renderGroup = (groupName, exercises, groupPrefix) => {
                let gHtml = `<div class="group-title">${groupName}</div>`;
                exercises.forEach((ex, index) => {
                    gHtml += `
                        <div class="exercise-item">
                            <div class="exercise-header">${ex}</div>
                            <div class="metrics-grid">
                                <div>
                                    <label>Series</label>
                                    <input type="number" id="${groupPrefix}_ex_${index}_s" value="4">
                                </div>
                                <div>
                                    <label>Reps</label>
                                    <input type="number" id="${groupPrefix}_ex_${index}_r" value="10">
                                </div>
                                <div>
                                    <label>Peso (kg)</label>
                                    <input type="number" step="0.5" id="${groupPrefix}_ex_${index}_p" placeholder="0">
                                </div>
                            </div>
                        </div>
                    `;
                });
                return gHtml;
            };

            html += renderGroup(data.g1, data.e1, 'g1');
            html += renderGroup(data.g2, data.e2, 'g2');
            container.innerHTML = html;
        }

        // Guardar la sesión realizada
        function saveWorkout() {
            if (!currentActiveDay) return;

            const dayData = routineData[currentActiveDay];
            const workoutLog = {
                date: new Date().toISOString(),
                day: currentActiveDay,
                groups: []
            };

            const processGroup = (groupName, exercises, groupPrefix) => {
                let groupLog = { name: groupName, exercises: [] };
                exercises.forEach((ex, index) => {
                    const series = document.getElementById(`${groupPrefix}_ex_${index}_s`).value;
                    const reps = document.getElementById(`${groupPrefix}_ex_${index}_r`).value;
                    const weight = document.getElementById(`${groupPrefix}_ex_${index}_p`).value || 0;

                    groupLog.exercises.push({
                        name: ex,
                        series: series,
                        reps: reps,
                        weight: weight
                    });
                });
                return groupLog;
            };

            workoutLog.groups.push(processGroup(dayData.g1, dayData.e1, 'g1'));
            workoutLog.groups.push(processGroup(dayData.g2, dayData.e2, 'g2'));

            let logs = JSON.parse(localStorage.getItem('gym_logs')) || [];
            logs.push(workoutLog);
            localStorage.setItem('gym_logs', JSON.stringify(logs));

            alert('¡Entrenamiento guardado correctamente!');
            document.getElementById('workout-area').style.display = 'none';
        }

        // Generar informes (15 o 30 días)
        function generateReport(days) {
            const logs = JSON.parse(localStorage.getItem('gym_logs')) || [];
            const container = document.getElementById('report-results');
            
            const now = new Date();
            const cutoffDate = new Date(now.setDate(now.getDate() - days));

            const filteredLogs = logs.filter(log => new Date(log.date) >= cutoffDate);

            if (filteredLogs.length === 0) {
                container.innerHTML = `<div class="empty-state">No hay entrenamientos registrados en los últimos ${days} días.</div>`;
                return;
            }

            let html = `<p style="margin-bottom:10px; color: var(--accent-color);">Total sesiones realizadas: <strong>${filteredLogs.length}</strong></p>`;

            filteredLogs.reverse().forEach(log => {
                const dateStr = new Date(log.date).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
                html += `
                    <div class="report-item">
                        <div class="report-date">${dateStr} - Día ${log.day}</div>
                `;
                
                log.groups.forEach(g => {
                    html += `<div style="font-size:0.85rem; font-weight:bold; margin-top:5px;">${g.name}:</div>`;
                    g.exercises.forEach(e => {
                        if (e.weight > 0) {
                            html += `<div style="font-size:0.8rem; color: var(--text-secondary); margin-left:8px;">• ${e.name}: ${e.series}x${e.reps} con ${e.weight} kg</div>`;
                        }
                    });
                });

                html += `</div>`;
            });

            container.innerHTML = html;
        }
    </script>
</body>
</html>
