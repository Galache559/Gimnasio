<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mi Gimnasio Pro v4.2</title>
<meta name="theme-color" content="#121212">
<style>
:root{--bg:#121212;--card:#1e1e1e;--item:#252525;--input:#2a2a2a;--a:#00e676;--txt:#fff;--sub:#aaa;--bor:#333;--red:#ff5252;--gold:#ffd700;--blue:#29b6f6}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);padding-bottom:80px}
header{position:sticky;top:0;z-index:10;background:var(--card);padding:12px;text-align:center;border-bottom:1px solid var(--bor)}
h1{font-size:1.15rem;color:var(--a);letter-spacing:1px}
.container{max-width:650px;margin:auto;padding:10px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);display:flex;border-top:1px solid var(--bor);padding:7px 0}
nav button{width:25%;background:none;border:0;color:var(--sub);font-size:.7rem;display:flex;flex-direction:column;gap:2px;align-items:center}
nav button.active{color:var(--a);font-weight:bold}
.tab{display:none}.tab.active{display:block}
.card{background:var(--card);border:1px solid var(--bor);border-radius:11px;padding:12px;margin-bottom:10px}
.card h2{font-size:1rem;color:var(--a);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
button,.btn{cursor:pointer}
.btn{background:var(--a);color:#000;border:0;border-radius:7px;padding:10px;width:100%;font-weight:bold}
.out{background:transparent;color:var(--txt);border:1px solid var(--bor)}
.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.sm{width:auto;padding:5px 9px;font-size:.75rem}
input,select{width:100%;background:var(--input);color:var(--txt);border:1px solid var(--bor);border-radius:6px;padding:8px;margin-bottom:7px;font-size:.88rem}
label{font-size:.73rem;color:var(--sub)}
.days{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.timer{background:var(--item);border:1px solid var(--a);border-radius:9px;text-align:center;padding:8px;margin-bottom:10px}
.clock{font:700 1.8rem monospace;color:var(--a);margin:3px}
.tbuttons{display:flex;gap:5px;justify-content:center}
.tbuttons button{background:#333;color:#fff;border:1px solid var(--bor);padding:5px 9px;border-radius:6px}
.group{color:var(--sub);font-size:.73rem;text-transform:uppercase;margin:12px 0 6px}
.ex{background:var(--item);padding:9px;border-radius:8px;margin-bottom:8px}
.exhead{display:flex;justify-content:space-between;align-items:center;font-weight:bold;margin-bottom:6px}
.badge{background:var(--gold);color:#000;border-radius:4px;padding:2px 5px;font-size:.62rem}
.last,.suggest,.history{font-size:.7rem;padding:5px;border-radius:5px;margin-bottom:5px}
.last{color:var(--a);background:#07351f;border:1px solid #176b43}
.suggest{color:var(--blue);background:#062d3c;border:1px solid #17607c;cursor:pointer}
.history{color:var(--sub);background:#1b1b1b;border:1px solid var(--bor)}
table{width:100%;border-collapse:collapse}
th{color:var(--sub);font-size:.63rem;font-weight:normal}
td{text-align:center;padding:1px}
td input{margin:0;text-align:center;padding:6px 1px}
td select{margin:0;padding:6px 1px;font-size:.68rem}
.rm,.vol{font-size:.7rem;margin-top:5px}.rm{color:var(--gold)}.vol{color:var(--a)}
.row{display:flex;gap:5px;margin-top:5px}
.finish{background:#333;color:#fff;border:1px solid var(--bor);padding:5px 7px;border-radius:6px;font-size:.68rem}
.rest{display:flex;gap:5px;align-items:center;margin-top:5px}
.rest input{margin:0;width:65px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal{padding:7px 2px;background:var(--item);border-radius:5px;font-size:.75rem}
.cal.on{background:var(--a);color:#000;font-weight:bold}.cal.empty{background:none}
.chart{width:100%;height:180px;background:#191919;border:1px solid var(--bor);border-radius:8px}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.stat{background:var(--item);padding:8px;border-radius:7px;text-align:center}
.stat b{display:block;color:var(--a);font-size:1rem}.stat span{font-size:.66rem;color:var(--sub)}
.report{border-bottom:1px solid var(--bor);padding:8px 0;font-size:.76rem}
.empty{text-align:center;color:var(--sub);padding:15px;font-size:.8rem}
.pr{display:none}
@media(max-width:380px){td input{font-size:.7rem;padding:5px 1px}th{font-size:.58rem}}
@media print{nav,header,.timer,.days,button,input,select,canvas{display:none!important}body{background:#fff;color:#000}.card{border:0;background:#fff}.report{color:#000}}
</style>
</head>
<body>

<header><h1>MI GIMNASIO PRO v4.2</h1></header>
<div class="container">

<section id="tab-entrenar" class="tab active">
<div class="timer">
<div style="display:flex;justify-content:space-between">
<span style="font-size:.72rem;color:var(--sub)">⏱️ DESCANSO</span>
<button id="wake" class="finish" onclick="wake()">💡 Pantalla</button>
</div>
<div id="clock" class="clock">00:00</div>
<div class="tbuttons">
<button onclick="timer(60)">60s</button><button onclick="timer(90)">90s</button>
<button onclick="timer(120)">120s</button><button onclick="stopTimer()">Stop</button>
</div>
</div>

<div class="card">
<h2>Selecciona el día</h2>
<div class="days">
<button class="btn out" onclick="selectDay(1)">Día 1</button>
<button class="btn out" onclick="selectDay(2)">Día 2</button>
<button class="btn out" onclick="selectDay(3)">Día 3</button>
<button class="btn out" onclick="selectDay(4)">Día 4</button>
</div>
</div>

<div id="work" style="display:none">
<div class="card">
<h2 id="daytitle">Día</h2>
<label>Fecha</label><input type="date" id="date">
<div id="form"></div>
<button class="btn" onclick="saveWorkout()">💾 Guardar entrenamiento</button>
</div>
</div>
</section>

<section id="tab-rutina" class="tab">
<div class="card">
<h2>⚙️ Configurar rutina</h2>
<label>Día</label>
<select id="cfgday" onchange="loadConfig()">
<option value="1">Día 1</option><option value="2">Día 2</option>
<option value="3">Día 3</option><option value="4">Día 4</option>
</select>
<div id="editor"></div>
<button class="btn" onclick="saveConfig()">Guardar configuración</button>
</div>
<div class="card">
<h2>💾 Copia de seguridad</h2>
<button class="btn out" onclick="exportData()">📦 Exportar JSON</button><br><br>
<button class="btn out" onclick="document.getElementById('file').click()">📥 Importar JSON</button>
<input id="file" type="file" accept=".json" style="display:none" onchange="importData(event)">
</div>
</section>

<section id="tab-calendario" class="tab">
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
<button class="btn out sm" onclick="month(-1)">❮</button>
<h2 id="monthname" style="margin:0"></h2>
<button class="btn out sm" onclick="month(1)">❯</button>
</div>
<div class="calendar" id="calendar"></div>
<div id="caldetail"></div>
</div>
</section>

<section id="tab-informes" class="tab">
<div class="card"><h2>📊 Resumen</h2><div id="stats" class="statgrid"></div></div>
<div class="card">
<h2>📈 Progresión</h2>
<select id="chartselect" onchange="chart()"><option value="">Elige ejercicio</option></select>
<select id="charttype" onchange="chart()">
<option value="weight">Peso</option><option value="volume">Volumen</option><option value="rm">1RM estimado</option>
</select>
<canvas id="canvas" class="chart"></canvas>
</div>
<div class="card"><h2>🏆 Récords</h2><div id="records"></div></div>
<div class="card">
<h2>📋 Historial</h2>
<div style="display:flex;gap:5px;flex-wrap:wrap">
<button class="btn out sm" onclick="report(15)">15 días</button>
<button class="btn out sm" onclick="report(30)">30 días</button>
<button class="btn out sm" onclick="report(90)">90 días</button>
<button class="btn out sm" onclick="window.print()">PDF</button>
</div>
<div id="reports" class="empty">Selecciona un periodo.</div>
</div>
</section>
</div>

<nav>
<button id="n-entrenar" class="active" onclick="tab('entrenar')">🏋️<span>Entrenar</span></button>
<button id="n-rutina" onclick="tab('rutina')">⚙️<span>Rutina</span></button>
<button id="n-calendario" onclick="tab('calendario')">📅<span>Calendario</span></button>
<button id="n-informes" onclick="tab('informes')">📊<span>Informes</span></button>
</nav>

<script>
const K='gym_',D={g1:'Grupo 1',e1:['Ej 1','Ej 2'],img1:['',''],g2:'Grupo 2',e2:['Ej 1','Ej 2'],img2:['','']};
let routine=JSON.parse(localStorage.getItem(K+'routine'))||{};
for(let i=1;i<5;i++)if(!routine[i])routine[i]=JSON.parse(JSON.stringify(D));
let logs=JSON.parse(localStorage.getItem(K+'logs'))||[],day=null,monthDate=new Date(),interval=null,seconds=0,lock=null;

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const num=v=>parseFloat(v)||0;
const save=()=>{localStorage.setItem(K+'routine',JSON.stringify(routine));localStorage.setItem(K+'logs',JSON.stringify(logs))};
const rm=(w,r)=>w&&r?w*(1+r/30):0;
const volume=s=>(s||[]).reduce((a,x)=>a+num(x.weight)*num(x.reps),0);

function history(ex){
let a=[];logs.forEach(l=>(l.groups||[]).forEach(g=>(g.exercises||[]).forEach(e=>{
if(e.name===ex)a.push({date:new Date(l.date),sets:e.sets||[]})
})));
return a.sort((a,b)=>a.date-b.date)
}
function last(ex){
let a=history(ex);if(!a.length)return null;
let x=a[a.length-1];
return{date:x.date.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'}),sets:x.sets}
}
function max(ex){let m=0;history(ex).forEach(x=>(x.sets||[]).forEach(s=>m=Math.max(m,num(s.weight))));return m}
function maxRM(ex){let m=0;history(ex).forEach(x=>(x.sets||[]).forEach(s=>m=Math.max(m,rm(num(s.weight),num(s.reps)))));return Math.round(m*10)/10}
function maxSetRM(s){return Math.round(Math.max(0,...(s||[]).map(x=>rm(num(x.weight),num(x.reps))))*10)/10}

function tab(x){
document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
document.getElementById('tab-'+x).classList.add('active');
document.querySelectorAll('nav button').forEach(e=>e.classList.remove('active'));
document.getElementById('n-'+x).classList.add('active');
if(x==='rutina')loadConfig();
if(x==='calendario')renderCalendar();
if(x==='informes'){stats();fillChart();records()}
}

async function wake(){
if(!('wakeLock'in navigator))return alert('Wake Lock no disponible.');
try{if(!lock){lock=await navigator.wakeLock.request('screen');wake.innerText='💡 ON'}
else{await lock.release();lock=null;wake.innerText='💡 Pantalla'}}catch(e){}
}
function timer(s){clearInterval(interval);seconds=s;showClock();interval=setInterval(()=>{seconds--;showClock();if(seconds<=0){clearInterval(interval);beep()}},1000)}
function stopTimer(){clearInterval(interval);seconds=0;showClock()}
function showClock(){clock.innerText=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
function beep(){try{let c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=900;o.start();o.stop(c.currentTime+.35)}catch(e){}}

function selectDay(d){
day=d;work.style.display='block';daytitle.innerText='Entrenamiento - Día '+d;
date.value=new Date().toISOString().slice(0,10);
let x=routine[d],html='';
[['g1','e1'],['g2','e2']].forEach(a=>{
html+=`<div class="group">${esc(x[a[0]])}</div>`;
(x[a[1]]||[]).forEach((ex,i)=>{
let l=last(ex),sets=l?l.sets.slice(0,3):[];
while(sets.length<3)sets.push({reps:10,weight:'',rir:2,rpe:8,type:'E'});
let lw=Math.max(...sets.map(s=>num(s.weight))),suggestion=lw?Math.round(lw*1.025*10)/10:0;
html+=`<div class="ex"><div class="exhead"><span>${esc(ex)}</span><span id="pr-${a[0]}-${i}" class="badge pr">🏆 PR</span></div>
${l?`<div class="last">Último ${l.date}: ${sets.map((s,j)=>`S${j+1} ${num(s.reps)}×${num(s.weight)}kg`).join(' · ')}</div>`:`<div class="last">Sin registro previo</div>`}
${suggestion?`<div class="suggest" onclick="suggest('${a[0]}',${i},${suggestion})">💡 Propuesta: ${suggestion} kg (+2,5%)</div>`:''}
<table><thead><tr><th>S</th><th>Tipo</th><th>Reps</th><th>Kg</th><th>RIR</th><th>RPE</th><th></th></tr></thead><tbody>`;
sets.forEach((s,j)=>html+=`<tr><td>${j+1}</td>
<td><select id="${a[0]}-${i}-t${j}"><option value="E" ${s.type==='E'?'selected':''}>E</option><option value="W" ${s.type==='W'?'selected':''}>C</option></select></td>
<td><input type="number" min="0" id="${a[0]}-${i}-r${j}" value="${num(s.reps)}" oninput="calc('${a[0]}',${i})"></td>
<td><input type="number" min="0" step=".5" id="${a[0]}-${i}-w${j}" value="${s.weight??''}" oninput="calc('${a[0]}',${i});pr('${a[0]}',${i},'${esc(ex)}')"></td>
<td><input type="number" min="0" max="10" step=".5" id="${a[0]}-${i}-q${j}" value="${s.rir??''}" oninput="calc('${a[0]}',${i})"></td>
<td><input type="number" min="1" max="10" step=".5" id="${a[0]}-${i}-p${j}" value="${s.rpe??''}"></td>
<td><button class="finish" onclick="timer(+document.getElementById('rest-${a[0]}-${i}').value||90)">▶</button></td></tr>`);
html+=`</tbody></table><div class="rm" id="rm-${a[0]}-${i}">🔥 1RM estimado: --</div>
<div class="vol" id="vol-${a[0]}-${i}">📦 Volumen: 0 kg</div>
<div class="rest"><span style="font-size:.68rem;color:var(--sub)">Descanso:</span><input type="number" min="0" id="rest-${a[0]}-${i}" value="${x.rest||90}"><span style="font-size:.68rem">s</span></div>
<div class="row"><button class="finish" onclick="showHistory('${esc(ex)}')">📜 Historial</button><button class="finish" onclick="timer(+document.getElementById('rest-${a[0]}-${i}').value||90)">⏱️ Descanso</button></div></div>`;
});
});
form.innerHTML=html;
}

function calc(g,i){
let best=0,vol=0;
for(let j=0;j<3;j++){
let w=num(document.getElementById(`${g}-${i}-w${j}`).value),r=num(document.getElementById(`${g}-${i}-r${j}`).value);
best=Math.max(best,rm(w,r));vol+=w*r
}
document.getElementById(`rm-${g}-${i}`).innerText=`🔥 1RM estimado: ${best?Math.round(best*10)/10+' kg':'--'}`;
document.getElementById(`vol-${g}-${i}`).innerText=`📦 Volumen: ${Math.round(vol*10)/10} kg`
}
function suggest(g,i,w){let e=document.getElementById(`${g}-${i}-w2`);if(e){e.value=w;e.dispatchEvent(new Event('input',{bubbles:true}))}}
function pr(g,i,ex){
let old=max(ex),v=0;
for(let j=0;j<3;j++)v=Math.max(v,num(document.getElementById(`${g}-${i}-w${j}`).value));
let b=document.getElementById(`pr-${g}-${i}`);if(b)b.style.display=v>old&&old>0?'inline':'none'
}
function showHistory(ex){
let a=history(ex).slice(-6).reverse();
if(!a.length)return alert('Sin historial');
alert(a.map(x=>`${x.date.toLocaleDateString('es-ES')} — ${x.sets.map(s=>`${num(s.reps)}×${num(s.weight)}kg${s.rir!=null?' RIR '+s.rir:''}${s.rpe!=null?' RPE '+s.rpe:''}`).join(' · ')}`).join('\n'))
}

function saveWorkout(){
if(!day)return;
let x=routine[day],log={id:Date.now(),date:new Date(date.value+'T12:00:00').toISOString(),day,groups:[]};
[['g1','e1'],['g2','e2']].forEach(a=>{
let g={name:x[a[0]],exercises:[]};
(x[a[1]]||[]).forEach((ex,i)=>{
let sets=[];
for(let j=0;j<3;j++){
let reps=num(document.getElementById(`${a[0]}-${i}-r${j}`).value),weight=num(document.getElementById(`${a[0]}-${i}-w${j}`).value),rir=document.getElementById(`${a[0]}-${i}-q${j}`).value,rpe=document.getElementById(`${a[0]}-${i}-p${j}`).value,type=document.getElementById(`${a[0]}-${i}-t${j}`).value;
sets.push({type,reps,weight,rir:rir===''?null:num(rir),rpe:rpe===''?null:num(rpe)})
}
let effective=sets.filter(s=>s.type==='E');
g.exercises.push({name:ex,sets,volume:volume(effective),rm:maxSetRM(effective)})
});
log.groups.push(g)
});
logs.push(log);save();alert('¡Entrenamiento guardado!');work.style.display='none'
}

function loadConfig(){
let x=routine[cfgday.value],h=`<label>Grupo 1</label><input id="g1n" value="${esc(x.g1)}"><div class="group">Ejercicios <button class="btn out sm" onclick="add('g1')">+ Añadir</button></div><div id="g1c">`;
(x.e1||[]).forEach((e,i)=>h+=field('g1',e,(x.img1||[])[i]));
h+=`</div><label>Descanso grupo 1</label><input id="g1rest" type="number" min="0" value="${x.rest||90}"><label>Grupo 2</label><input id="g2n" value="${esc(x.g2)}"><div class="group">Ejercicios <button class="btn out sm" onclick="add('g2')">+ Añadir</button></div><div id="g2c">`;
(x.e2||[]).forEach((e,i)=>h+=field('g2',e,(x.img2||[])[i]));
editor.innerHTML=h+`</div><label>Descanso grupo 2</label><input id="g2rest" type="number" min="0" value="${x.rest2||90}">`
}
function field(g,n,img){return`<div class="ex"><input class="${g}e" value="${esc(n)}" placeholder="Ejercicio"><input class="${g}i" value="${esc(img||'')}" placeholder="URL imagen/GIF"><button class="btn danger sm" onclick="this.parentElement.remove()">Eliminar</button></div>`}
function add(g){document.getElementById(g+'c').insertAdjacentHTML('beforeend',field(g,'',''))}
function saveConfig(){
let d=cfgday.value,x={g1:g1n.value.trim()||'Grupo 1',e1:[],img1:[],rest:Math.max(0,num(g1rest.value)),g2:g2n.value.trim()||'Grupo 2',e2:[],img2:[],rest2:Math.max(0,num(g2rest.value))};
['g1','g2'].forEach(g=>{let ns=document.querySelectorAll('.'+g+'e'),ims=document.querySelectorAll('.'+g+'i');ns.forEach((e,i)=>{if(e.value.trim()){let en=g==='g1'?'e1':'e2',im=g==='g1'?'img1':'img2';x[en].push(e.value.trim());x[im].push(ims[i].value.trim())}})});
routine[d]=x;save();alert('Rutina guardada')
}

function exportData(){
let b=new Blob([JSON.stringify({version:4.2,exported:new Date().toISOString(),routine,logs},null,2)],{type:'application/json'}),a=document.createElement('a');
a.href=URL.createObjectURL(b);a.download='gym_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)
}
function importData(e){
let f=e.target.files[0];if(!f)return;
let r=new FileReader();
r.onload=()=>{try{let d=JSON.parse(r.result);if(!d||typeof d!=='object')throw 0;if(d.routine)routine=d.routine;if(Array.isArray(d.logs))logs=d.logs;save();alert('Datos importados');location.reload()}catch(x){alert('Archivo JSON no válido')}};
r.readAsText(f)
}

function month(n){monthDate.setMonth(monthDate.getMonth()+n);renderCalendar()}

function renderCalendar(){
let y=monthDate.getFullYear(),m=monthDate.getMonth(),names=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
monthname.innerText=names[m]+' '+y;
let first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();
let h=['Lu','Ma','Mi','Ju','Vi','Sá','Do'].map(x=>`<b style="font-size:.68rem;color:var(--sub)">${x}</b>`).join('');
for(let i=0;i<first;i++)h+='<div class="cal empty"></div>';
for(let d=1;d<=days;d++){
let on=logs.some(l=>{let z=new Date(l.date);return z.getFullYear()===y&&z.getMonth()===m&&z.getDate()===d});
h+=`<div class="cal ${on?'on':''}" onclick="showDetail(${y},${m},${d})">${d}</div>`
}
calendar.innerHTML=h;caldetail.innerHTML=''
}

function showDetail(y,m,d){
let a=logs.filter(l=>{let z=new Date(l.date);return z.getFullYear()===y&&z.getMonth()===m&&z.getDate()===d});
let h=`<div class="group">${String(d).padStart(2,'0')}/${String(m+1).padStart(2,'0')}/${y}</div>`;
if(!a.length)return caldetail.innerHTML=h+'<div class="empty">Sin entrenamiento.</div>';
a.forEach(l=>{
h+=`<div class="report"><b>Día ${l.day}</b>`;
(l.groups||[]).forEach(g=>{
h+=`<div style="color:var(--a);margin-top:3px">${esc(g.name)}</div>`;
(g.exercises||[]).forEach(e=>h+=`<div>${esc(e.name)}: ${(e.sets||[]).map((s,i)=>`S${i+1} ${s.reps}×${s.weight}kg${s.rir!=null?' RIR '+s.rir:''}${s.rpe!=null?' RPE '+s.rpe:''}`).join(' · ')}`)
});
h+='</div>'
});
caldetail.innerHTML=h
}

function allExercises(){
let s=new Set();
Object.values(routine).forEach(d=>{(d.e1||[]).forEach(e=>s.add(e));(d.e2||[]).forEach(e=>s.add(e))});
logs.forEach(l=>(l.groups||[]).forEach(g=>(g.exercises||[]).forEach(e=>s.add(e.name))));
return[...s].filter(Boolean).sort()
}
function fillChart(){
let a=allExercises(),v=chartselect.value;
chartselect.innerHTML='<option value="">Elige ejercicio</option>'+a.map(e=>`<option value="${esc(e)}">${esc(e)}</option>`).join('');
chartselect.value=v&&a.includes(v)?v:(a[0]||'');chart()
}
function chart(){
let name=chartselect.value,type=charttype.value,c=canvas,ctx=c.getContext('2d');
c.width=c.clientWidth*devicePixelRatio;c.height=180*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);
let W=c.clientWidth,H=180;ctx.clearRect(0,0,W,H);if(!name)return;
let p=[];
history(name).forEach(x=>{
if(type==='weight')(x.sets||[]).forEach(s=>num(s.weight)&&p.push({d:x.date,v:num(s.weight)}));
if(type==='rm')(x.sets||[]).forEach(s=>{let v=rm(num(s.weight),num(s.reps));v&&p.push({d:x.date,v})});
if(type==='volume')p.push({d:x.date,v:volume((x.sets||[]).filter(s=>s.type!=='W'))})
});
p.sort((a,b)=>a.d-b.d);
if(!p.length){ctx.fillStyle='#aaa';ctx.fillText('Sin datos',20,90);return}
let min=Math.min(...p.map(x=>x.v)),mx=Math.max(...p.map(x=>x.v)),range=mx-min||1,pad=28;
ctx.strokeStyle='#333';ctx.beginPath();ctx.moveTo(pad,10);ctx.lineTo(pad,H-25);ctx.lineTo(W-10,H-25);ctx.stroke();
ctx.strokeStyle=ctx.fillStyle='#00e676';ctx.lineWidth=2;ctx.beginPath();
p.forEach((x,i)=>{let X=pad+(W-pad-15)*(i/Math.max(1,p.length-1)),Y=H-25-(x.v-min)/range*(H-45);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.stroke();
p.forEach((x,i)=>{let X=pad+(W-pad-15)*(i/Math.max(1,p.length-1)),Y=H-25-(x.v-min)/range*(H-45);ctx.beginPath();ctx.arc(X,Y,3,0,Math.PI*2);ctx.fill()})
}

function stats(){
let vol=0,sets=0,days=new Set();
logs.forEach(l=>{days.add(new Date(l.date).toDateString());(l.groups||[]).forEach(g=>(g.exercises||[]).forEach(e=>(e.sets||[]).forEach(s=>{if(s.type!=='W'){vol+=num(s.weight)*num(s.reps);sets++}})))});
let prs=0;
allExercises().forEach(e=>{let best=0;history(e).forEach(x=>(x.sets||[]).forEach(s=>{let w=num(s.weight);if(w>best){best=w;prs++}}))});
stats.innerHTML=`<div class="stat"><b>${days.size}</b><span>Sesiones</span></div><div class="stat"><b>${Math.round(vol)} kg</b><span>Volumen efectivo</span></div><div class="stat"><b>${sets}</b><span>Series efectivas</span></div><div class="stat"><b>${Math.max(0,prs-allExercises().length)}</b><span>PR detectados</span></div>`
}
function records(){
let h='';
allExercises().forEach(e=>{
let w=max(e),r=0;history(e).forEach(x=>(x.sets||[]).forEach(s=>r=Math.max(r,num(s.reps))));
let one=maxRM(e);
if(w||r)h+=`<div class="report"><b>${esc(e)}</b><div style="font-size:.7rem;color:var(--sub)">🏆 ${w} kg · 🔁 ${r} reps · 🔥 1RM ~${one} kg</div></div>`
});
records.innerHTML=h||'<div class="empty">Todavía no hay récords.</div>'
}
function report(days){
let cut=Date.now()-days*86400000,a=logs.filter(l=>new Date(l.date).getTime()>=cut).sort((x,y)=>new Date(y.date)-new Date(x.date));
if(!a.length)return reports.innerHTML=`<div class="empty">Sin entrenamientos en ${days} días.</div>`;
let h='';
a.forEach(l=>{
let vol=0,sets=0;
(l.groups||[]).forEach(g=>(g.exercises||[]).forEach(e=>(e.sets||[]).forEach(s=>{if(s.type!=='W'){vol+=num(s.weight)*num(s.reps);sets++}})));
h+=`<div class="report"><b>${new Date(l.date).toLocaleDateString('es-ES')} · Día ${l.day}</b><br>📦 ${Math.round(vol)} kg · 💪 ${sets} series efectivas</div>`
});
reports.innerHTML=h
}

renderCalendar();showClock();
</script>
</body>
</html>
