<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mi Gimnasio Pro v4.2</title>
<meta name="theme-color" content="#121212">
<style>
:root{--bg:#121212;--card:#1e1e1e;--item:#252525;--input:#2a2a2a;--a:#00e676;--txt:#fff;--sub:#aaa;--bor:#333;--red:#ff5252;--gold:#ffd700;--blue:#29b6f6;--orange:#ffb74d}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);padding-bottom:82px}
header{position:sticky;top:0;z-index:10;background:var(--card);padding:13px;text-align:center;border-bottom:1px solid var(--bor)}
h1{font-size:1.18rem;color:var(--a);letter-spacing:1px}
.container{max-width:650px;margin:auto;padding:10px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);display:flex;border-top:1px solid var(--bor);padding:7px 0}
nav button{width:25%;background:none;border:0;color:var(--sub);font-size:.7rem;display:flex;flex-direction:column;gap:3px;align-items:center}
nav button.active{color:var(--a);font-weight:bold}
.tab{display:none}.tab.active{display:block}
.card{background:var(--card);border:1px solid var(--bor);border-radius:12px;padding:12px;margin-bottom:10px}
.card h2{font-size:1rem;color:var(--a);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
button,.btn{cursor:pointer}
.btn{background:var(--a);color:#000;border:0;border-radius:8px;padding:10px;width:100%;font-weight:bold}
.out{background:transparent;color:var(--txt);border:1px solid var(--bor)}
.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.sm{width:auto;padding:6px 9px;font-size:.75rem}
input,select{width:100%;background:var(--input);color:var(--txt);border:1px solid var(--bor);border-radius:6px;padding:8px;margin-bottom:7px;font-size:.88rem}
label{font-size:.74rem;color:var(--sub)}
.days{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.timer{background:var(--item);border:1px solid var(--a);border-radius:10px;text-align:center;padding:9px;margin-bottom:10px}
.timer.done{border-color:var(--gold);box-shadow:0 0 12px #ffd70055}
.clock{font:700 1.9rem monospace;color:var(--a);margin:3px}
.tbuttons{display:flex;gap:5px;justify-content:center}
.tbuttons button{background:#333;color:#fff;border:1px solid var(--bor);padding:6px 9px;border-radius:6px}
.group{color:var(--sub);font-size:.76rem;text-transform:uppercase;margin:13px 0 6px}
.ex{background:var(--item);padding:9px;border-radius:9px;margin-bottom:9px}
.exhead{display:flex;justify-content:space-between;align-items:center;font-weight:bold;margin-bottom:6px}
.badge{background:var(--gold);color:#000;border-radius:4px;padding:2px 5px;font-size:.63rem}
.last,.suggest,.history{font-size:.7rem;padding:6px;border-radius:5px;margin-bottom:5px}
.last{color:var(--a);background:#07351f;border:1px solid #176b43}
.suggest{color:var(--blue);background:#062d3c;border:1px solid #17607c}
.suggest.good{color:var(--a);background:#07351f;border-color:#176b43}
.suggest.warn{color:var(--orange);background:#3a2705;border-color:#76520c}
.history{color:var(--sub);background:#1b1b1b;border:1px solid var(--bor);display:none}
table{width:100%;border-collapse:collapse}
th{color:var(--sub);font-size:.62rem;font-weight:normal}
td{text-align:center;padding:2px}
td input{margin:0;text-align:center;padding:7px 2px}
td select{margin:0;padding:7px 1px;font-size:.68rem}
.rm,.vol{font-size:.7rem;margin-top:5px}
.rm{color:var(--gold)}.vol{color:var(--a)}
.row{display:flex;gap:5px;margin-top:5px}
.finish{background:#333;color:#fff;border:1px solid var(--bor);padding:6px 8px;border-radius:6px;font-size:.7rem}
.rest{display:flex;gap:5px;align-items:center;margin-top:5px}
.rest input{margin:0;width:65px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal{padding:7px 2px;background:var(--item);border-radius:5px;font-size:.76rem}
.cal.on{background:var(--a);color:#000;font-weight:bold}.cal.empty{background:none}
.chart{width:100%;height:190px;background:#191919;border:1px solid var(--bor);border-radius:8px}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.stat{background:var(--item);padding:9px;border-radius:8px;text-align:center}
.stat b{display:block;color:var(--a);font-size:1.03rem}.stat span{font-size:.68rem;color:var(--sub)}
.report{border-bottom:1px solid var(--bor);padding:8px 0;font-size:.78rem}
.empty{text-align:center;color:var(--sub);padding:16px;font-size:.82rem}
.pr{display:none}
@media(max-width:380px){td input{font-size:.7rem;padding:6px 1px}th{font-size:.57rem}}
@media print{nav,header,.timer,.days,button,input,select,canvas{display:none!important}body{background:#fff;color:#000}.card{border:0;background:#fff}}
</style>
</head>
<body>

<header><h1>MI GIMNASIO PRO v4.2</h1></header>
<div class="container">

<section id="tab-entrenar" class="tab active">

<div class="timer" id="timerbox">
<div style="display:flex;justify-content:space-between">
<span style="font-size:.72rem;color:var(--sub)">⏱️ DESCANSO</span>
<button id="wake" class="finish" onclick="wake()">💡 Pantalla</button>
</div>
<div id="clock" class="clock">00:00</div>
<div class="tbuttons">
<button onclick="timer(60)">60s</button>
<button onclick="timer(90)">90s</button>
<button onclick="timer(120)">120s</button>
<button onclick="stopTimer()">Stop</button>
</div>
</div>

<div class="card">
<h2>Selecciona el día</h2>
<div class="days">
<button class="btn out" onclick="selectDay(1)">Día 1</button>
<button class="btn out" onclick="selectDay(2)">Día 2</button>
<button class="btn out" onclick="selectDay(3)">Día 3</button>
<button class="btn out" onclick="selectDay(4)">Día 4</button>
</div>
</div>

<div id="work" style="display:none">
<div class="card">
<h2 id="daytitle">Día</h2>
<label>Fecha</label><input type="date" id="date">
<div id="form"></div>
<button class="btn" onclick="saveWorkout()">💾 Guardar entrenamiento</button>
</div>
</div>
</section>

<section id="tab-rutina" class="tab">
<div class="card">
<h2>⚙️ Configurar rutina</h2>
<label>Día</label>
<select id="cfgday" onchange="loadConfig()">
<option value="1">Día 1</option><option value="2">Día 2</option>
<option value="3">Día 3</option><option value="4">Día 4</option>
</select>
<div id="editor"></div>
<button class="btn" onclick="saveConfig()">Guardar configuración</button>
</div>
<div class="card">
<h2>💾 Copia de seguridad</h2>
<button class="btn out" onclick="exportData()">📦 Exportar JSON</button><br><br>
<button class="btn out" onclick="document.getElementById('file').click()">📥 Importar JSON</button>
<input id="file" type="file" accept=".json" style="display:none" onchange="importData(event)">
</div>
</section>

<section id="tab-calendario" class="tab">
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
<button class="btn out sm" onclick="month(-1)">❮</button>
<h2 id="monthname" style="margin:0"></h2>
<button class="btn out sm" onclick="month(1)">❯</button>
</div>
<div class="calendar" id="calendar"></div>
<div id="detail"></div>
</div>
</section>

<section id="tab-informes" class="tab">

<div class="card">
<h2>📊 Resumen</h2>
<div id="stats" class="statgrid"></div>
</div>

<div class="card">
<h2>📈 Progresión</h2>
<select id="chartselect" onchange="chart()"></select>
<select id="charttype" onchange="chart()">
<option value="weight">Peso</option>
<option value="volume">Volumen</option>
<option value="rm">1RM estimado</option>
</select>
<canvas id="canvas" class="chart"></canvas>
</div>

<div class="card">
<h2>🏆 Récords</h2>
<div id="records"></div>
</div>

<div class="card">
<h2>📋 Historial</h2>
<div style="display:flex;gap:5px;flex-wrap:wrap">
<button class="btn out sm" onclick="report(15)">15 días</button>
<button class="btn out sm" onclick="report(30)">30 días</button>
<button class="btn out sm" onclick="report(90)">90 días</button>
<button class="btn out sm" onclick="window.print()">PDF</button>
</div>
<div id="reports" class="empty">Selecciona un periodo.</div>
</div>
</section>
</div>

<nav>
<button id="n-entrenar" class="active" onclick="tab('entrenar')">🏋️<span>Entrenar</span></button>
<button id="n-rutina" onclick="tab('rutina')">⚙️<span>Rutina</span></button>
<button id="n-calendario" onclick="tab('calendario')">📅<span>Calendario</span></button>
<button id="n-informes" onclick="tab('informes')">📊<span>Informes</span></button>
</nav>

<script>
const K='gym_',D={
g1:'Grupo 1',e1:['Ej 1','Ej 2'],img1:['',''],rest:90,
g2:'Grupo 2',e2:['Ej 1','Ej 2'],img2:['',''],rest2:90
};

let routine=JSON.parse(localStorage.getItem(K+'routine'))||{};
for(let i=1;i<5;i++)if(!routine[i])routine[i]=JSON.parse(JSON.stringify(D));

let logs=JSON.parse(localStorage.getItem(K+'logs'))||[];
let day=null,monthDate=new Date(),interval=null,seconds=0,lock=null;

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const num=v=>parseFloat(v)||0;
const rm=(w,r)=>w&&r?w*(1+r/30):0;
const save=()=>{localStorage.setItem(K+'routine',JSON.stringify(routine));localStorage.setItem(K+'logs',JSON.stringify(logs))};

function history(ex){
let a=[];
logs.forEach(l=>(l.groups||[]).forEach(g=>(g.exercises||[]).forEach(e=>{
if(e.name===ex)a.push({date:new Date(l.date),sets:e.sets||[]})
})));
return a.sort((a,b)=>a.date-b.date)
}

function last(ex){
let a=history(ex);
return a.length?a[a.length-1]:null
}

function max(ex){
let m=0;
history(ex).forEach(x=>(x.sets||[]).forEach(s=>m=Math.max(m,num(s.weight))));
return m
}

function maxRM(ex){
let m=0;
history(ex).forEach(x=>(x.sets||[]).forEach(s=>m=Math.max(m,rm(num(s.weight),num(s.reps)))));
return Math.round(m*10)/10
}

function volume(sets){
return(sets||[]).reduce((a,s)=>a+(s.type==='W'?0:num(s.weight)*num(s.reps)),0)
}

/* NAVEGACIÓN: se conserva la estructura funcional de v4.1 */
function tab(x){
document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
let t=document.getElementById('tab-'+x);
if(t)t.classList.add('active');

document.querySelectorAll('nav button').forEach(e=>e.classList.remove('active'));
let n=document.getElementById('n-'+x);
if(n)n.classList.add('active');

if(x==='rutina')loadConfig();
if(x==='calendario')renderCalendar();
if(x==='informes'){stats();fillChart();records()}
}

async function wake(){
if(!('wakeLock'in navigator))return alert('Wake Lock no disponible.');
try{
if(!lock){
lock=await navigator.wakeLock.request('screen');
document.getElementById('wake').innerText='💡 ON'
}else{
await lock.release();lock=null;
document.getElementById('wake').innerText='💡 Pantalla'
}
}catch(e){}
}

function timer(s){
clearInterval(interval);
seconds=s;
document.getElementById('timerbox').classList.remove('done');
showClock();
interval=setInterval(()=>{
seconds--;showClock();
if(seconds<=0){
clearInterval(interval);
document.getElementById('timerbox').classList.add('done');
beep();
}
},1000)
}

function stopTimer(){
clearInterval(interval);seconds=0;
document.getElementById('timerbox').classList.remove('done');
showClock()
}

function showClock(){
document.getElementById('clock').innerText=
`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`
}

function beep(){
try{
let c=new AudioContext(),o=c.createOscillator();
o.connect(c.destination);o.frequency.value=900;
o.start();o.stop(c.currentTime+.4)
}catch(e){}
}

function selectDay(d){
day=d;
document.getElementById('work').style.display='block';
document.getElementById('daytitle').innerText='Entrenamiento - Día '+d;
document.getElementById('date').value=new Date().toISOString().slice(0,10);

let x=routine[d],html='';

[['g1','e1'],['g2','e2']].forEach(a=>{
html+=`<div class="group">${esc(x[a[0]])}</div>`;

(x[a[1]]||[]).forEach((ex,i)=>{
let l=last(ex),sets=l?l.sets.slice(0,3):[];
while(sets.length<3)sets.push({reps:10,weight:'',rir:2,rpe:8,type:'E'});

let lw=Math.max(...sets.map(s=>num(s.weight)));
let old=max(ex);
let suggestion=lw?Math.round(lw*1.025*10)/10:0;

html+=`
<div class="ex">
<div class="exhead">
<span>${esc(ex)}</span>
<span id="pr-${a[0]}-${i}" class="badge pr">🏆 PR</span>
</div>

${l?`<div class="last">Último ${l.date.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'})}:
${l.sets.map((s,j)=>`S${j+1} ${num(s.reps)}×${num(s.weight)}kg`).join(' · ')}</div>`
:`<div class="last">Sin registro previo</div>`}

${suggestion?`
<div id="sg-${a[0]}-${i}" class="suggest"
onclick="suggest('${a[0]}',${i},${suggestion})">
💡 Propuesta: <b>${suggestion} kg</b> (+2,5%)
</div>`:''}

<table><thead><tr>
<th>S</th><th>Tipo</th><th>Reps</th><th>Kg</th><th>RIR</th><th>RPE</th><th></th>
</tr></thead><tbody>`;

sets.forEach((s,j)=>html+=`
<tr>
<td>${j+1}</td>
<td><select id="${a[0]}-${i}-t${j}">
<option value="E" ${s.type==='E'?'selected':''}>E</option>
<option value="W" ${s.type==='W'?'selected':''}>C</option>
</select></td>
<td><input type="number" min="0" id="${a[0]}-${i}-r${j}" value="${num(s.reps)}" oninput="calc('${a[0]}',${i})"></td>
<td><input type="number" min="0" step=".5" id="${a[0]}-${i}-w${j}" value="${s.weight??''}" oninput="calc('${a[0]}',${i});pr('${a[0]}',${i},'${esc(ex)}')"></td>
<td><input type="number" min="0" max="10" step=".5" id="${a[0]}-${i}-q${j}" value="${s.rir??''}" oninput="calc('${a[0]}',${i})"></td>
<td><input type="number" min="1" max="10" step=".5" id="${a[0]}-${i}-p${j}" value="${s.rpe??''}" oninput="calc('${a[0]}',${i})"></td>
<td><button class="finish" onclick="timer(+document.getElementById('rest-${a[0]}-${i}').value||90)">▶</button></td>
</tr>`);

html+=`</tbody></table>

<div class="rm" id="rm-${a[0]}-${i}">🔥 1RM estimado: --</div>
<div class="vol" id="vol-${a[0]}-${i}">📦 Volumen: 0 kg</div>

<div class="rest">
<span style="font-size:.68rem;color:var(--sub)">Descanso:</span>
<input type="number" min="0" id="rest-${a[0]}-${i}" value="${i<(x.e1||[]).length&&a[0]==='g1'?x.rest||90:x.rest2||90}">
<span style="font-size:.68rem">s</span>
</div>

<div class="row">
<button class="finish" onclick="toggleHistory('${a[0]}',${i},'${esc(ex)}')">📜 Historial</button>
<button class="finish" onclick="timer(+document.getElementById('rest-${a[0]}-${i}').value||90)">⏱️ Descanso</button>
</div>

<div id="hist-${a[0]}-${i}" class="history"></div>
</div>`;
});
});

document.getElementById('form').innerHTML=html;
document.querySelectorAll('.ex').forEach((e,i)=>{});
}

function calc(g,i){
let best=0,vol=0;
for(let j=0;j<3;j++){
let w=num(document.getElementById(`${g}-${i}-w${j}`).value);
let r=num(document.getElementById(`${g}-${i}-r${j}`).value);
let t=document.getElementById(`${g}-${i}-t${j}`).value;
if(t==='E'){best=Math.max(best,rm(w,r));vol+=w*r}
}
document.getElementById(`rm-${g}-${i}`).innerText=
`🔥 1RM estimado: ${best?Math.round(best*10)/10+' kg':'--'}`;
document.getElementById(`vol-${g}-${i}`).innerText=
`📦 Volumen efectivo: ${Math.round(vol*10)/10} kg`;
}

function suggest(g,i,w){
let el=document.getElementById(`${g}-${i}-w2`);
if(!el)return;
el.value=w;
el.dispatchEvent(new Event('input',{bubbles:true}));
let s=document.getElementById(`sg-${g}-${i}`);
if(s){s.innerHTML='✅ Propuesta aplicada: <b>'+w+' kg</b>';s.classList.add('good')}
}

function pr(g,i,ex){
let old=max(ex),v=0,oneOld=maxRM(ex),one=0;
for(let j=0;j<3;j++){
let w=num(document.getElementById(`${g}-${i}-w${j}`).value);
let r=num(document.getElementById(`${g}-${i}-r${j}`).value);
v=Math.max(v,w);
one=Math.max(one,rm(w,r));
}
let b=document.getElementById(`pr-${g}-${i}`);
if(b)b.style.display=(old&&v>old)||(oneOld&&one>oneOld)?'inline':'none';
}

function toggleHistory(g,i,ex){
let box=document.getElementById(`hist-${g}-${i}`);
if(box.style.display==='block'){box.style.display='none';return}
let a=history(ex).slice(-6).reverse();
if(!a.length){box.innerHTML='Sin historial todavía.';box.style.display='block';return}
box.innerHTML=a.map(x=>`
<div style="margin-bottom:6px">
<b>${x.date.toLocaleDateString('es-ES')}</b><br>
${x.sets.map((s,j)=>`S${j+1} ${num(s.reps)}×${num(s.weight)}kg${s.rir!=null?' · RIR '+s.rir:''}${s.rpe!=null?' · RPE '+s.rpe:''}`).join(' · ')}
</div>`).join('');
box.style.display='block'
}

function saveWorkout(){
if(!day)return;
let x=routine[day];
let log={id:Date.now(),date:new Date(document.getElementById('date').value+'T12:00:00').toISOString(),day,groups:[]};

[['g1','e1'],['g2','e2']].forEach(a=>{
let g={name:x[a[0]],exercises:[]};
(x[a[1]]||[]).forEach((ex,i)=>{
let sets=[];
for(let j=0;j<3;j++){
let reps=num(document.getElementById(`${a[0]}-${i}-r${j}`).value);
let weight=num(document.getElementById(`${a[0]}-${i}-w${j}`).value);
let rir=document.getElementById(`${a[0]}-${i}-q${j}`).value;
let rpe=document.getElementById(`${a[0]}-${i}-p${j}`).value;
let type=document.getElementById(`${a[0]}-${i}-t${j}`).value;
sets.push({type,reps,weight,rir:rir===''?null:num(rir),rpe:rpe===''?null:num(rpe)})
}
let effective=sets.filter(s=>s.type==='E');
g.exercises.push({name:ex,sets,volume:volume(effective),rm:maxSetRM(effective)})
});
log.groups.push(g)
});

logs.push(log);save();
alert('¡Entrenamiento guardado!');
document.getElementById('work').style.display='none';
}

function maxSetRM(sets){
let m=0;
(sets||[]).forEach(s=>m=Math.max(m,rm(num(s.weight),num(s.reps))));
return Math.round(m*10)/10
}

function loadConfig(){
let x=routine[document.getElementById('cfgday').value];
let h=`<label>Grupo 1</label><input id="g1n" value="${esc(x.g1)}">
<div class="group">Ejercicios <button class="btn out sm" onclick="add('g1')">+ Añadir</button></div>
<div id="g1c">`;
(x.e1||[]).forEach((e,i)=>h+=field('g1',e,(x.img1||[])[i]));
h+=`</div><label>Descanso grupo 1</label>
<input id="g1rest" type="number" min="0" value="${x.rest||90}">
<label>Grupo 2</label><input id="g2n" value="${esc(x.g2)}">
<div class="group">Ejercicios <button class="btn out sm" onclick="add('g2')">+ Añadir</button></div>
<div id="g2c">`;
(x.e2||[]).forEach((e,i)=>h+=field('g2',e,(x.img2||[])[i]));
h+=`</div><label>Descanso grupo 2</label>
<input id="g2rest" type="number" min="0" value="${x.rest2||90}">`;
document.getElementById('editor').innerHTML=h
}

function field(g,n,img){
return`<div class="ex">
<input class="${g}e" value="${esc(n)}" placeholder="Ejercicio">
<input class="${g}i" value="${esc(img||'')}" placeholder="URL imagen/GIF">
<button class="btn danger sm" onclick="this.parentElement.remove()">Eliminar</button>
</div>`
}

function add(g){
document.getElementById(g+'c').insertAdjacentHTML('beforeend',field(g,'',''))
}

function saveConfig(){
let d=document.getElementById('cfgday').value;
let x={
g1:document.getElementById('g1n').value.trim()||'Grupo 1',e1:[],img1:[],
rest:Math.max(0,num(document.getElementById('g1rest').value)),
g2:document.getElementById('g2n').value.trim()||'Grupo 2',e2:[],img2:[],
rest2:Math.max(0,num(document.getElementById('g2rest').value))
};
['g1','g2'].forEach(g=>{
let ns=document.querySelectorAll('.'+g+'e'),ims=document.querySelectorAll('.'+g+'i');
ns.forEach((e,i)=>{
if(e.value.trim()){
let en=g==='g1'?'e1':'e2',im=g==='g1'?'img1':'img2';
x[en].push(e.value.trim());x[im].push(ims[i].value.trim())
}
})
});
routine[d]=x;save();alert('Rutina guardada')
}

function exportData(){
let b=new Blob([JSON.stringify({version:4.2,exported:new Date().toISOString(),routine,logs},null,2)],{type:'application/json'});
let a=document.createElement('a');
a.href=URL.createObjectURL(b);
a.download='gym_backup_'+new Date().toISOString().slice(0,10)+'.json';
a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)
}

function importData(e){
let f=e.target.files[0];if(!f)return;
let r=new FileReader();
r.onload=()=>{
try{
let d=JSON.parse(r.result);
if(!d||typeof d!=='object')throw 0;
if(d.routine)routine=d.routine;
if(Array.isArray(d.logs))logs=d.logs;
save();alert('Datos importados');location.reload()
}catch(x){alert('Archivo JSON no válido')}
};
r.readAsText(f)
}

function month(n){
monthDate.setMonth(monthDate.getMonth()+n);renderCalendar()
}

function renderCalendar(){
let y=monthDate.getFullYear(),m=monthDate.getMonth();
let names=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
document.getElementById('monthname').innerText=names[m]+' '+y;
let first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();
let h=['Lu','Ma','Mi','Ju','Vi','Sá','Do'].map(x=>`<b style="font-size:.68rem;color:var(--sub)">${x}</b>`).join('');
for(let i=0;i<first;i++)h+='<div class="cal empty"></div>';
for(let d=1;d<=days;d++){
let on=logs.some(l=>{let z=new Date(l.date);return z.getFullYear()===y&&z.getMonth()===m&&z.getDate()===d});
h+=`<div class="cal ${on?'on':''}" onclick="detail(${y},${m},${d})">${d}</div>`
}
document.getElementById('calendar').innerHTML=h;
document.getElementById('detail').innerHTML=''
}

function detail(y,m,d){
let a=logs.filter(l=>{let z=new Date(l.date);return z.getFullYear()===y&&z.getMonth()===m&&z.getDate()===d});
let h=`<div class="group">${String(d).padStart(2,'0')}/${String(m+1).padStart(2,'0')}/${y}</div>`;
if(!a.length)return document.getElementById('detail').innerHTML=h+'<div class="empty">Sin entrenamiento.</div>';
a.forEach(l=>{
h+=`<div class="report"><b>Día ${l.day}</b>`;
(l.groups||[]).forEach(g=>{
h+=`<div style="color:var(--a);margin-top:4px">${esc(g.name)}</div>`;
(g.exercises||[]).forEach(e=>{
h+=`<div>${esc(e.name)}: `+(e.sets||[]).map((s,i)=>
`S${i+1} ${s.reps}×${s.weight}kg${s.rir!=null?' RIR '+s.rir:''}${s.rpe!=null?' RPE '+s.rpe:''}`).join(' · ')+'</div>'
})
});
h+='</div>'
});
document.getElementById('detail').innerHTML=h
}

function allExercises(){
let s=new Set();
Object.values(routine).forEach(d=>{
(d.e1||[]).forEach(e=>s.add(e));(d.e2||[]).forEach(e=>s.add(e))
});
logs.forEach(l=>(l.groups||[]).forEach(g=>(g.exercises||[]).forEach(e=>s.add(e.name))));
return[...s].filter(Boolean).sort()
}

function fillChart(){
let s=document.getElementById('chartselect'),v=s.value,a=allExercises();
s.innerHTML='<option value="">Elige ejercicio</option>'+a.map(e=>`<option value="${esc(e)}">${esc(e)}</option>`).join('');
if(v&&a.includes(v))s.value=v;else if(a.length)s.value=a[0];
chart()
}

function chart(){
let name=document.getElementById('chartselect').value,type=document.getElementById('charttype').value;
let c=document.getElementById('canvas'),ctx=c.getContext('2d');
c.width=c.clientWidth*devicePixelRatio;c.height=190*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);
let W=c.clientWidth,H=190;ctx.clearRect(0,0,W,H);
if(!name)return;
let p=[];
history(name).forEach(x=>{
if(type==='weight')(x.sets||[]).forEach(s=>num(s.weight)&&p.push({d:x.date,v:num(s.weight)}));
if(type==='rm')(x.sets||[]).forEach(s=>{let v=rm(num(s.weight),num(s.reps));if(v)p.push({d:x.date,v})});
if(type==='volume')p.push({d:x.date,v:volume(x.sets)});
});
p.sort((a,b)=>a.d-b.d);
if(!p.length){ctx.fillStyle='#aaa';ctx.fillText('Sin datos',20,90);return}
let min=Math.min(...p.map(x=>x.v)),mx=Math.max(...p.map(x=>x.v)),range=mx-min||1,pad=28;
ctx.strokeStyle='#333';ctx.beginPath();ctx.moveTo(pad,10);ctx.lineTo(pad,H-25);ctx.lineTo(W-10,H-25);ctx.stroke();
ctx.strokeStyle='#00e676';ctx.fillStyle='#00e676';ctx.lineWidth=2;ctx.beginPath();
p.forEach((x,i)=>{
let X=pad+(W-pad-15)*(i/Math.max(1,p.length-1)),Y=H-25-(x.v-min)/range*(H-45);
i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)
});ctx.stroke();
p.forEach((x,i)=>{
let X=pad+(W-pad-15)*(i/Math.max(1,p.length-1)),Y=H-25-(x.v-min)/range*(H-45);
ctx.beginPath();ctx.arc(X,Y,3,0,Math.PI*2);ctx.fill()
})
}

function stats(){
let vol=0,sets=0,days=new Set(),prs=0;
logs.forEach(l=>{
days.add(new Date(l.date).toDateString());
(l.groups||[]).forEach(g=>(g.exercises||[]).forEach(e=>(e.sets||[]).forEach(s=>{
if(s.type!=='W'){vol+=num(s.weight)*num(s.reps);sets++}
})))
});
allExercises().forEach(e=>{
let best=0;
history(e).forEach(x=>(x.sets||[]).forEach(s=>{
let w=num(s.weight);if(w>best){best=w;prs++}
}))
});
document.getElementById('stats').innerHTML=
`<div class="stat"><b>${days.size}</b><span>Sesiones</span></div>
<div class="stat"><b>${Math.round(vol)} kg</b><span>Volumen efectivo</span></div>
<div class="stat"><b>${sets}</b><span>Series efectivas</span></div>
<div class="stat"><b>${Math.max(0,prs-allExercises().length)}</b><span>PR detectados</span></div>`
}

function records(){
let h='';
allExercises().forEach(e=>{
let w=max(e),r=0,one=maxRM(e);
history(e).forEach(x=>(x.sets||[]).forEach(s=>r=Math.max(r,num(s.reps))));
if(w||r)h+=`<div class="report"><b>${esc(e)}</b>
<div style="font-size:.72rem;color:var(--sub)">🏆 ${w} kg · 🔁 ${r} reps · 🔥 1RM ~${one} kg</div></div>`
});
document.getElementById('records').innerHTML=h||'<div class="empty">Todavía no hay récords.</div>'
}

function report(days){
let cut=Date.now()-days*86400000;
let a=logs.filter(l=>new Date(l.date).getTime()>=cut).sort((x,y)=>new Date(y.date)-new Date(x.date));
if(!a.length)return document.getElementById('reports').innerHTML=`<div class="empty">Sin entrenamientos en ${days} días.</div>`;
let h='';
a.forEach(l=>{
let vol=0,sets=0;
(l.groups||[]).forEach(g=>(g.exercises||[]).forEach(e=>(e.sets||[]).forEach(s=>{
if(s.type!=='W'){vol+=num(s.weight)*num(s.reps);sets++}
})));
h+=`<div class="report"><b>${new Date(l.date).toLocaleDateString('es-ES')} · Día ${l.day}</b>
<br>📦 ${Math.round(vol)} kg · 💪 ${sets} series efectivas</div>`
});
document.getElementById('reports').innerHTML=h
}

renderCalendar();
showClock();
</script>
</body>
</html>
