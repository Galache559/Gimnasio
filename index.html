<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mi Gimnasio Pro V4</title>
<style>
:root{--bg:#101010;--card:#1d1d1d;--card2:#252525;--acc:#00e676;--acc2:#00c853;--txt:#fff;--mut:#aaa;--bor:#333;--red:#ff5252;--gold:#ffd700;--blue:#29b6f6}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);padding-bottom:82px}
header{position:sticky;top:0;z-index:50;background:var(--card);padding:14px;text-align:center;border-bottom:1px solid var(--bor)}
h1{font-size:1.2rem;color:var(--acc);letter-spacing:1px}
.container{max-width:650px;margin:auto;padding:12px}
nav{position:fixed;z-index:100;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bor);display:flex;padding:8px 0}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:.7rem}
nav button span{display:block;font-size:1.2rem;margin-bottom:2px}
nav button.active{color:var(--acc);font-weight:bold}
.tab-content{display:none}.tab-content.active{display:block}
.card{background:var(--card);border:1px solid var(--bor);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:1rem;color:var(--acc);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.day-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button,.btn{cursor:pointer}
.btn{width:100%;border:0;border-radius:8px;padding:11px;background:var(--acc);color:#000;font-weight:700}
.btn-outline{background:transparent;color:var(--txt);border:1px solid var(--bor)}
.btn-sm{width:auto;padding:6px 10px;font-size:.78rem}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red);border-radius:6px;padding:5px 9px}
input,select{width:100%;padding:9px;background:#292929;color:#fff;border:1px solid var(--bor);border-radius:6px;margin:0 0 9px;font-size:.92rem}
input:focus,select:focus{outline:1px solid var(--acc)}
.group-title{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:.78rem;text-transform:uppercase;letter-spacing:.5px;margin:15px 0 8px}
.timer-box{background:var(--card2);border:1px solid var(--acc);border-radius:10px;padding:10px;margin-bottom:12px;text-align:center}
.timer-display{font:700 2rem monospace;color:var(--acc);margin:3px}
.timer-presets{display:flex;gap:6px;justify-content:center}
.timer-btn{background:#333;color:#fff;border:1px solid var(--bor);border-radius:6px;padding:6px 10px;font-size:.78rem}
.exercise-item{background:var(--card2);border-radius:9px;padding:11px;margin-bottom:11px}
.exercise-header{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:7px}
.exercise-img{width:100%;max-height:180px;object-fit:contain;background:#181818;border-radius:6px;margin:5px 0 8px;border:1px solid var(--bor)}
.last-data,.suggestion,.history-box{font-size:.73rem;padding:6px 8px;border-radius:5px;margin-bottom:7px}
.last-data{color:var(--acc);background:#092016;border:1px solid #164d31}
.suggestion{color:var(--blue);background:#071c25;border:1px solid #17495d;cursor:pointer}
.history-box{color:var(--mut);background:#1b1b1b;border:1px solid var(--bor)}
.badge{font-size:.67rem;padding:2px 5px;border-radius:4px;font-weight:bold}
.pr{background:var(--gold);color:#000}
.warm{background:#5d4300;color:#ffd95a}
.sets-table{width:100%;border-collapse:collapse}
.sets-table th{color:var(--mut);font-size:.7rem;font-weight:normal}
.sets-table td{padding:2px;text-align:center;font-size:.75rem}
.sets-table input{margin:0;padding:7px 3px;text-align:center;font-size:.8rem}
.rm{font-size:.73rem;color:var(--gold);font-weight:bold;margin-top:6px}
.vol{font-size:.73rem;color:var(--blue);margin-top:3px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}
.metrics div{background:#1a1a1a;border-radius:6px;padding:6px;text-align:center}
.metrics b{display:block;color:var(--acc);font-size:.85rem}
.metrics small{color:var(--mut);font-size:.65rem}
.exercise-actions{display:flex;gap:6px;margin-top:7px}
.exercise-actions button{flex:1}
.calendar-header{display:flex;justify-content:space-between;align-items:center}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-day-name{font-size:.7rem;color:var(--mut);padding:5px 0}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--card2);font-size:.8rem}
.cal-day.empty{background:transparent}
.cal-day.has-workout{background:var(--acc);color:#000;font-weight:bold}
.report-item{border-bottom:1px solid var(--bor);padding:9px 0}
.report-date{color:var(--acc);font-size:.78rem}
.empty{text-align:center;color:var(--mut);padding:20px;font-size:.85rem}
canvas{width:100%;height:190px;background:#171717;border:1px solid var(--bor);border-radius:8px;margin-top:8px}
.config-item{background:var(--card2);padding:8px;border-radius:7px;margin-bottom:8px}
.config-row{display:flex;gap:6px}
.config-row input{flex:1}
.toast{position:fixed;z-index:999;bottom:85px;left:50%;transform:translateX(-50%);background:#eee;color:#111;padding:10px 16px;border-radius:8px;font-size:.82rem;box-shadow:0 3px 15px #000;display:none}
@media(max-width:380px){.sets-table input{font-size:.72rem;padding:6px 1px}.metrics b{font-size:.75rem}}
@media print{body{background:#fff;color:#000;padding:0}header,nav,.timer-box,.day-grid,.btn,button,input,select,canvas{display:none!important}.card,.exercise-item{background:#fff;color:#000;border:0;padding:0}.tab-content{display:none!important}#tab-informes{display:block!important}.report-item{border-color:#ccc}.report-date{color:#000}}
</style>
</head>
<body>

<header><h1>MI GIMNASIO PRO V4</h1></header>
<div class="container">

<!-- ENTRENAR -->
<div id="tab-entrenar" class="tab-content active">

<div class="timer-box">
<div style="display:flex;justify-content:space-between;align-items:center">
<span style="font-size:.75rem;color:var(--mut)">⏱️ DESCANSO</span>
<button id="wake" class="timer-btn" onclick="toggleWake()">💡 Pantalla OFF</button>
</div>
<div id="timer" class="timer-display">00:00</div>
<div class="timer-presets">
<button class="timer-btn" onclick="startTimer(60)">60s</button>
<button class="timer-btn" onclick="startTimer(90)">90s</button>
<button class="timer-btn" onclick="startTimer(120)">120s</button>
<button class="timer-btn" onclick="stopTimer()">STOP</button>
</div>
</div>

<div class="card">
<h2>Selecciona el día</h2>
<div class="day-grid">
<button class="btn btn-outline" onclick="selectDay(1)">Día 1</button>
<button class="btn btn-outline" onclick="selectDay(2)">Día 2</button>
<button class="btn btn-outline" onclick="selectDay(3)">Día 3</button>
<button class="btn btn-outline" onclick="selectDay(4)">Día 4</button>
</div>
</div>

<div id="workout-area" style="display:none">
<div class="card">
<h2 id="day-title">Entrenamiento</h2>
<label style="font-size:.75rem;color:var(--mut)">Fecha</label>
<input type="date" id="workout-date">
<div id="workout-form"></div>
<button class="btn" onclick="saveWorkout()">💾 GUARDAR ENTRENAMIENTO</button>
</div>
</div>
</div>

<!-- RUTINA -->
<div id="tab-rutina" class="tab-content">
<div class="card">
<h2>⚙️ Configurar Rutina</h2>
<select id="config-day" onchange="loadConfig()">
<option value="1">Día 1</option><option value="2">Día 2</option>
<option value="3">Día 3</option><option value="4">Día 4</option>
</select>
<div id="routine-editor"></div>
<button class="btn" onclick="saveConfig()">GUARDAR RUTINA</button>
</div>

<div class="card">
<h2>💾 Copia de seguridad</h2>
<button class="btn btn-outline" onclick="exportData()">📦 EXPORTAR JSON</button>
<br><br>
<button class="btn btn-outline" onclick="$('import').click()">📥 IMPORTAR JSON</button>
<input id="import" type="file" accept=".json" style="display:none" onchange="importData(event)">
</div>
</div>

<!-- CALENDARIO -->
<div id="tab-calendario" class="tab-content">
<div class="card">
<div class="calendar-header">
<button class="btn btn-outline btn-sm" onclick="changeMonth(-1)">❮</button>
<h2 id="month" style="margin:0"></h2>
<button class="btn btn-outline btn-sm" onclick="changeMonth(1)">❯</button>
</div>
<br>
<div class="calendar-grid">
<div class="cal-day-name">LU</div><div class="cal-day-name">MA</div><div class="cal-day-name">MI</div>
<div class="cal-day-name">JU</div><div class="cal-day-name">VI</div><div class="cal-day-name">SA</div><div class="cal-day-name">DO</div>
</div>
<div class="calendar-grid" id="calendar"></div>
</div>
<div class="card" id="detail" style="display:none">
<h2 id="detail-title">Detalle</h2>
<div id="detail-content"></div>
</div>
</div>

<!-- INFORMES -->
<div id="tab-informes" class="tab-content">
<div class="card">
<h2>📊 Progresión</h2>
<select id="chart-ex" onchange="drawChart()"></select>
<select id="chart-type" onchange="drawChart()">
<option value="weight">Peso</option>
<option value="volume">Volumen</option>
<option value="rm">1RM estimado</option>
</select>
<canvas id="chart"></canvas>
</div>

<div class="card">
<h2>🏆 Récords</h2>
<div id="records"></div>
</div>

<div class="card">
<h2>📈 Resumen</h2>
<div style="display:flex;gap:6px;flex-wrap:wrap">
<button class="btn btn-outline btn-sm" onclick="report(15)">15 días</button>
<button class="btn btn-outline btn-sm" onclick="report(30)">30 días</button>
<button class="btn btn-outline btn-sm" onclick="report(90)">90 días</button>
<button class="btn btn-outline btn-sm" onclick="window.print()">🖨️ PDF</button>
</div>
<div id="report" class="report-item"><div class="empty">Selecciona un periodo.</div></div>
</div>
</div>

</div>
<nav>
<button id="nav-entrenar" class="active" onclick="tab('entrenar')"><span>🏋️</span>Entrenar</button>
<button id="nav-rutina" onclick="tab('rutina')"><span>⚙️</span>Rutina</button>
<button id="nav-calendario" onclick="tab('calendario')"><span>📅</span>Calendario</button>
<button id="nav-informes" onclick="tab('informes')"><span>📊</span>Informes</button>
</nav>
<div id="toast" class="toast"></div>

<script>
const $=id=>document.getElementById(id);
const KEYR='gym_routine',KEYL='gym_logs';
const DEFAULT={g1:'Grupo 1',e1:['Ej 1','Ej 2'],img1:['',''],rest1:90,
g2:'Grupo 2',e2:['Ej 1','Ej 2'],img2:['',''],rest2:90};
let routine=load(KEYR)||{};
for(let i=1;i<=4;i++)if(!routine[i])routine[i]=JSON.parse(JSON.stringify(DEFAULT));
let logs=load(KEYL)||[],day=null,timerInt=null,secs=0,wake=null,calDate=new Date();

function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('⚠️ No hay espacio suficiente');return false}}
function toast(t){let x=$('toast');x.textContent=t;x.style.display='block';clearTimeout(x._t);x._t=setTimeout(()=>x.style.display='none',2200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function safeImg(s){try{let u=new URL(s,location.href);return/^https?:$/.test(u.protocol)?u.href:''}catch(e){return''}}
function num(v){return parseFloat(v)||0}
function rm(w,r){return w&&r?Math.round(r==1?w:w*(1+r/30)):0}
function today(){return new Date().toISOString().slice(0,10)}

function tab(t){
document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
$('tab-'+t).classList.add('active');$('nav-'+t).classList.add('active');
if(t==='rutina')loadConfig();
if(t==='calendario')renderCalendar();
if(t==='informes'){populateExercises();renderRecords()}
}

async function toggleWake(){
if(!('wakeLock'in navigator))return toast('Wake Lock no disponible');
try{
if(!wake){wake=await navigator.wakeLock.request('screen');$('wake').textContent='💡 Pantalla ON'}
else{await wake.release();wake=null;$('wake').textContent='💡 Pantalla OFF'}
}catch(e){toast('No se pudo activar')}
}
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&wake===true)try{wake=await navigator.wakeLock.request('screen')}catch(e){}});

function startTimer(s){
clearInterval(timerInt);secs=s;showTimer();
timerInt=setInterval(()=>{secs--;showTimer();if(secs<=3&&secs>0)beep(600);if(secs<=0){clearInterval(timerInt);beep(900)}},1000)
}
function stopTimer(){clearInterval(timerInt);secs=0;showTimer()}
function showTimer(){$('timer').textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`}
function beep(f){try{let c=new AudioContext,o=c.createOscillator();o.frequency.value=f;o.connect(c.destination);o.start();o.stop(c.currentTime+.15)}catch(e){}}

function getExerciseLogs(name){
let a=[];
logs.forEach(l=>l.groups?.forEach(g=>g.exercises?.forEach(e=>{
if(e.name===name)a.push({date:new Date(l.date),e,l})
}));
return a.sort((a,b)=>a.date-b.date)
}
function lastExercise(name){
let a=getExerciseLogs(name);return a.length?a[a.length-1]:null
}
function maxWeight(name){
let m=0;getExerciseLogs(name).forEach(x=>(x.e.sets||[]).forEach(s=>m=Math.max(m,num(s.weight))));
return m
}
function maxReps(name){
let m=0;getExerciseLogs(name).forEach(x=>(x.e.sets||[]).forEach(s=>m=Math.max(m,num(s.reps))));
return m
}
function totalVolume(e){
return(e.sets||[]).reduce((a,s)=>a+num(s.weight)*num(s.reps),0)
}

function selectDay(d){
day=d;$('workout-area').style.display='block';$('day-title').textContent='Entrenamiento - Día '+d;$('workout-date').value=today();
renderWorkout()
}
function renderWorkout(){
let d=routine[day]||DEFAULT;
$('workout-form').innerHTML=groupHTML(d.g1,d.e1,d.img1,'g1',d.rest1)+groupHTML(d.g2,d.e2,d.img2,'g2',d.rest2)
}
function groupHTML(group,exs,imgs,prefix,rest){
let h=`<div class="group-title"><span>${esc(group||'Grupo')}</span><span>Descanso ${rest||90}s</span></div>`;
(exs||[]).forEach((name,i)=>{
let last=lastExercise(name),old=last?.e?.sets||[],m=maxWeight(name);
let sets=Array.from({length:3},(_,j)=>old[j]||{reps:10,weight:''});
let img=safeImg(imgs?.[i]);
h+=`<div class="exercise-item">
<div class="exercise-header"><span>${esc(name)}</span><span id="pr-${prefix}-${i}" class="badge pr" style="display:none">🏆 PR</span></div>
${img?`<img class="exercise-img" src="${esc(img)}" alt="${esc(name)}">`:''}
${last?`<div class="last-data">Último ${last.date.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'})}: ${old.map((s,j)=>`S${j+1} ${num(s.reps)}×${num(s.weight)}kg`).join(' · ')}</div>`:'<div class="last-data">Sin registro previo</div>'}
${last&&m?`<div class="suggestion" onclick="suggest('${prefix}',${i},${m})">💡 Sugerencia: ${round(m*1.025)} kg (+2,5%)</div>`:''}
<table class="sets-table"><thead><tr><th>#</th><th>Tipo</th><th>Reps</th><th>Kg</th><th>RIR</th><th>RPE</th></tr></thead><tbody>
${sets.map((s,j)=>`<tr>
<td>${j+1}</td>
<td><select id="${prefix}-${i}-t${j}" style="margin:0;padding:6px 1px"><option value="E">Efectiva</option><option value="W">Calent.</option></select></td>
<td><input type="number" min="0" id="${prefix}-${i}-r${j}" value="${esc(s.reps)}" oninput="updateExercise('${prefix}',${i})"></td>
<td><input type="number" min="0" step=".5" id="${prefix}-${i}-w${j}" value="${esc(s.weight)}" oninput="updateExercise('${prefix}',${i});checkPR('${prefix}',${i},${j},'${esc(name).replace(/'/g,"\\'")}')"></td>
<td><input type="number" min="0" max="10" step=".5" id="${prefix}-${i}-rir${j}" value="${s.rir??''}"></td>
<td><input type="number" min="1" max="10" step=".5" id="${prefix}-${i}-rpe${j}" value="${s.rpe??''}"></td>
</tr>`).join('')}</tbody></table>
<div class="rm" id="rm-${prefix}-${i}">🔥 1RM: --</div>
<div class="vol" id="vol-${prefix}-${i}">📦 Volumen: 0 kg</div>
<div class="exercise-actions">
<button class="timer-btn" onclick="startTimer(${rest||90})">⏱️ ${rest||90}s</button>
<button class="timer-btn" onclick="showHistory('${esc(name).replace(/'/g,"\\'")}')">📜 Historial</button>
</div>
<div id="hist-${prefix}-${i}"></div>
</div>`
});
return h
}
function round(n){return Math.round(n*10)/10}
function updateExercise(p,i){
let best=0,vol=0;
for(let j=0;j<3;j++){
let w=num($(`${p}-${i}-w${j}`).value),r=num($(`${p}-${i}-r${j}`).value);
best=Math.max(best,rm(w,r));vol+=w*r
}
$('rm-'+p+'-'+i).textContent='🔥 1RM: '+(best?'~'+best+' kg':'--');
$('vol-'+p+'-'+i).textContent='📦 Volumen: '+round(vol)+' kg'
}
function checkPR(p,i,j,name){
let w=num($(`${p}-${i}-w${j}`).value),old=maxWeight(name);
let b=$(`pr-${p}-${i}`);if(b)b.style.display=w>old&&old>0?'inline-block':'none'
}
function suggest(p,i,w){
let inputs=[];
for(let j=0;j<3;j++)inputs.push($(`${p}-${i}-w${j}`));
inputs[2].value=round(w*1.025);inputs[2].dispatchEvent(new Event('input'))
}
function showHistory(name){
let a=getExerciseLogs(name).slice(-6).reverse();
alert(a.length?a.map(x=>`${x.date.toLocaleDateString('es-ES')} — ${x.e.sets?.map(s=>`${s.reps}×${s.weight}kg${s.rir!=null?' RIR '+s.rir:''}`).join(' · ')}`).join('\n'):'Sin historial')
}

function saveWorkout(){
if(!day)return;
let d=routine[day],groups=[];
function process(group,exs,p){
let arr=[];
(exs||[]).forEach((name,i)=>{
let sets=[];
for(let j=0;j<3;j++)sets.push({
type:$(`${p}-${i}-t${j}`).value,
reps:num($(`${p}-${i}-r${j}`).value),
weight:num($(`${p}-${i}-w${j}`).value),
rir:$(`${p}-${i}-rir${j}`).value===''?null:num($(`${p}-${i}-rir${j}`).value),
rpe:$(`${p}-${i}-rpe${j}`).value===''?null:num($(`${p}-${i}-rpe${j}`).value)
});
let effective=sets.filter(s=>s.type==='E'&&s.reps>0);
let best=effective.reduce((a,s)=>s.weight>a.weight?s:a,{weight:0,reps:0});
arr.push({name,sets,series:sets.length,reps:best.reps,weight:best.weight,volume:totalVolume({sets:effective})})
});
return{name:group,exercises:arr}
}
groups.push(process(d.g1,d.e1,'g1'));groups.push(process(d.g2,d.e2,'g2'));
let date=$('workout-date').value||today();
logs.push({id:Date.now(),date:new Date(date+'T12:00:00').toISOString(),day,groups});
if(save(KEYL,logs)){toast('✅ Entrenamiento guardado');$('workout-area').style.display='none'}
}

function loadConfig(){
let d=routine[$('config-day').value]||DEFAULT;
$('routine-editor').innerHTML=`
<label style="font-size:.75rem;color:var(--mut)">Grupo muscular 1</label>
<input id="g1-name" value="${esc(d.g1)}">
<div class="group-title"><span>Ejercicios</span><button class="btn btn-outline btn-sm" onclick="addEx('g1')">+ Añadir</button></div>
<div id="g1-list">${configItems('g1',d.e1,d.img1)}</div>
<label style="font-size:.75rem;color:var(--mut)">Descanso grupo 1</label><input id="rest1" type="number" min="0" value="${d.rest1||90}">
<label style="font-size:.75rem;color:var(--mut)">Grupo muscular 2</label>
<input id="g2-name" value="${esc(d.g2)}">
<div class="group-title"><span>Ejercicios</span><button class="btn btn-outline btn-sm" onclick="addEx('g2')">+ Añadir</button></div>
<div id="g2-list">${configItems('g2',d.e2,d.img2)}</div>
<label style="font-size:.75rem;color:var(--mut)">Descanso grupo 2</label><input id="rest2" type="number" min="0" value="${d.rest2||90}">`
}
function configItems(p,exs,imgs){
return(exs||[]).map((e,i)=>`<div class="config-item">
<div class="config-row"><input class="${p}-name" value="${esc(e)}" placeholder="Ejercicio"><button class="btn-danger" onclick="this.parentElement.parentElement.remove()">X</button></div>
<input class="${p}-img" value="${esc(imgs?.[i]||'')}" placeholder="URL imagen/GIF">
</div>`).join('')
}
function addEx(p){
let d=document.createElement('div');d.innerHTML=configItems(p,[''],['']);$(p+'-list').appendChild(d.firstElementChild)
}
function saveConfig(){
let dayN=$('config-day').value;
function read(p){
let n=[...document.querySelectorAll('.'+p+'-name')].map(x=>x.value.trim()).filter(Boolean);
let im=[...document.querySelectorAll('.'+p+'-img')].map(x=>safeImg(x.value.trim()));
return[n,im]
}
let a=read('g1'),b=read('g2');
routine[dayN]={g1:$('g1-name').value.trim()||'Grupo 1',e1:a[0],img1:a[1],rest1:Math.max(0,num($('rest1').value)),
g2:$('g2-name').value.trim()||'Grupo 2',e2:b[0],img2:b[1],rest2:Math.max(0,num($('rest2').value))};
save(KEYR,routine);toast('✅ Rutina guardada')
}

function exportData(){
let data={version:4,exported:new Date().toISOString(),routine,logs};
let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
let a=document.createElement('a'),u=URL.createObjectURL(blob);
a.href=u;a.download='gym_backup_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)
}
function importData(e){
let f=e.target.files[0];if(!f)return;
if(f.size>5e6)return toast('⚠️ Archivo demasiado grande');
let r=new FileReader();
r.onload=x=>{
try{
let d=JSON.parse(x.target.result);
if(!d||typeof d!=='object')throw 0;
if(d.routine&&typeof d.routine==='object')save(KEYR,d.routine);
if(Array.isArray(d.logs))save(KEYL,d.logs);
toast('✅ Importación correcta');setTimeout(()=>location.reload(),700)
}catch(err){toast('❌ JSON no válido')}
};r.readAsText(f)
}

function changeMonth(n){calDate.setMonth(calDate.getMonth()+n);renderCalendar()}
function renderCalendar(){
let y=calDate.getFullYear(),m=calDate.getMonth();
let names=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
$('month').textContent=names[m]+' '+y;
let first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),h='';
for(let i=0;i<first;i++)h+='<div class="cal-day empty"></div>';
for(let d=1;d<=days;d++){
let has=logs.some(l=>{let x=new Date(l.date);return x.getFullYear()===y&&x.getMonth()===m&&x.getDate()===d});
h+=`<div class="cal-day ${has?'has-workout':''}" onclick="dayDetail(${y},${m},${d})">${d}</div>`
}
$('calendar').innerHTML=h
}
function dayDetail(y,m,d){
let a=logs.filter(l=>{let x=new Date(l.date);return x.getFullYear()===y&&x.getMonth()===m&&x.getDate()===d});
$('detail').style.display='block';$('detail-title').textContent=new Date(y,m,d).toLocaleDateString('es-ES',{dateStyle:'full'});
$('detail-content').innerHTML=a.length?a.map(l=>`<div style="margin-bottom:10px"><b>Día ${l.day}</b>${l.groups.map(g=>`<div style="color:var(--acc);margin-top:5px">${esc(g.name)}</div>${g.exercises.map(e=>`<div style="font-size:.75rem;color:var(--mut)">${esc(e.name)}: ${(e.sets||[]).map(s=>`${s.reps}×${s.weight}kg`).join(' · ')}</div>`).join('')}`).join('')}</div>`).join(''):'<div class="empty">Sin entrenamiento.</div>'
}

function allExercises(){
let s=new Set();
Object.values(routine).forEach(d=>[...(d.e1||[]),...(d.e2||[])].forEach(x=>s.add(x)));
logs.forEach(l=>l.groups?.forEach(g=>g.exercises?.forEach(e=>s.add(e.name))));
return [...s].filter(Boolean).sort()
}
function populateExercises(){
let ex=allExercises(),s=$('chart-ex');
s.innerHTML='<option value="">-- Ejercicio --</option>'+ex.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
if(ex.length)s.value=ex[0];drawChart()
}
function drawChart(){
let name=$('chart-ex').value,type=$('chart-type').value,c=$('chart'),ctx=c.getContext('2d');
c.width=c.clientWidth*devicePixelRatio;c.height=190*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);
let W=c.clientWidth,H=190;ctx.clearRect(0,0,W,H);
if(!name)return;
let pts=[];
getExerciseLogs(name).forEach(x=>{
let sets=x.e.sets||[];
if(type==='weight')sets.forEach(s=>{if(s.weight)pts.push({d:x.date,v:num(s.weight)})});
if(type==='rm')sets.forEach(s=>{let v=rm(num(s.weight),num(s.reps));if(v)pts.push({d:x.date,v})});
if(type==='volume')pts.push({d:x.date,v:totalVolume({sets:sets.filter(s=>s.type!=='W')})})
});
if(!pts.length){ctx.fillStyle='#aaa';ctx.fillText('Sin datos',20,90);return}
let min=Math.min(...pts.map(x=>x.v)),max=Math.max(...pts.map(x=>x.v));if(min===max){min=0;max=max||1}
let p=28,w=W-p*2,h=H-p*2;
ctx.strokeStyle='#333';ctx.beginPath();ctx.moveTo(p,p);ctx.lineTo(p,H-p);ctx.lineTo(W-p,H-p);ctx.stroke();
ctx.strokeStyle='#00e676';ctx.fillStyle='#00e676';ctx.lineWidth=2;ctx.beginPath();
pts.forEach((x,i)=>{let X=p+(pts.length<2?w/2:i*w/(pts.length-1)),Y=H-p-(x.v-min)/(max-min)*h;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});
ctx.stroke();
pts.forEach((x,i)=>{let X=p+(pts.length<2?w/2:i*w/(pts.length-1)),Y=H-p-(x.v-min)/(max-min)*h;ctx.beginPath();ctx.arc(X,Y,3,0,7);ctx.fill()})
}
function renderRecords(){
let ex=allExercises(),h='';
ex.forEach(n=>{
let w=maxWeight(n),r=maxReps(n),a=getExerciseLogs(n),bestRM=0,vol=0;
a.forEach(x=>(x.e.sets||[]).forEach(s=>{bestRM=Math.max(bestRM,rm(num(s.weight),num(s.reps)));vol+=num(s.weight)*num(s.reps)}));
if(w||r)h+=`<div class="report-item"><b>${esc(n)}</b><div style="font-size:.75rem;color:var(--mut)">🏆 ${w} kg · 🔁 ${r} reps · 🔥 1RM ~${bestRM} kg · 📦 ${round(vol)} kg</div></div>`
});
$('records').innerHTML=h||'<div class="empty">Todavía no hay récords.</div>'
}
function report(days){
let cut=Date.now()-days*864e5,a=logs.filter(l=>new Date(l.date).getTime()>=cut).sort((x,y)=>new Date(y.date)-new Date(x.date));
$('report').innerHTML=a.length?a.map(l=>{
let volume=0,sets=0;
l.groups.forEach(g=>g.exercises.forEach(e=>{volume+=totalVolume(e);sets+=(e.sets||[]).filter(s=>s.type!=='W').length}));
return`<div class="report-item"><div class="report-date">${new Date(l.date).toLocaleDateString('es-ES')} · Día ${l.day}</div><div style="font-size:.78rem">📦 ${round(volume)} kg · 💪 ${sets} series efectivas</div></div>`
}).join(''):`<div class="empty">No hay entrenamientos en ${days} días.</div>`
}

loadConfig();
showTimer();
</script>
