<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mi Gimnasio Pro v4</title>
<meta name="theme-color" content="#121212">
<style>
:root{--bg:#121212;--card:#1e1e1e;--item:#252525;--input:#2a2a2a;--a:#00e676;--a2:#00c853;--txt:#fff;--sub:#aaa;--bor:#333;--red:#ff5252;--gold:#ffd700;--blue:#29b6f6}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);padding-bottom:85px}
header{position:sticky;top:0;z-index:10;background:var(--card);padding:14px;text-align:center;border-bottom:1px solid var(--bor)}
h1{font-size:1.25rem;color:var(--a);letter-spacing:1px}
.container{max-width:650px;margin:auto;padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);display:flex;border-top:1px solid var(--bor);padding:8px 0}
nav button{width:25%;background:none;border:0;color:var(--sub);font-size:.72rem;display:flex;flex-direction:column;gap:3px;align-items:center}
nav button.active{color:var(--a);font-weight:bold}
.tab{display:none}.tab.active{display:block}
.card{background:var(--card);border:1px solid var(--bor);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:1.05rem;color:var(--a);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
button,.btn{cursor:pointer}
.btn{background:var(--a);color:#000;border:0;border-radius:8px;padding:11px;width:100%;font-weight:bold}
.out{background:transparent;color:var(--txt);border:1px solid var(--bor)}
.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.sm{width:auto;padding:6px 10px;font-size:.78rem}
input,select{width:100%;background:var(--input);color:var(--txt);border:1px solid var(--bor);border-radius:6px;padding:9px;margin-bottom:8px;font-size:.92rem}
label{font-size:.78rem;color:var(--sub)}
.days{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.timer{background:var(--item);border:1px solid var(--a);border-radius:10px;text-align:center;padding:10px;margin-bottom:12px}
.clock{font:700 2rem monospace;color:var(--a);margin:4px}
.tbuttons{display:flex;gap:6px;justify-content:center}
.tbuttons button{background:#333;color:#fff;border:1px solid var(--bor);padding:6px 10px;border-radius:6px}
.group{color:var(--sub);font-size:.78rem;text-transform:uppercase;margin:15px 0 7px}
.ex{background:var(--item);padding:10px;border-radius:9px;margin-bottom:10px}
.exhead{display:flex;justify-content:space-between;align-items:center;font-weight:bold;margin-bottom:7px}
.badge{background:var(--gold);color:#000;border-radius:4px;padding:2px 5px;font-size:.65rem}
.last,.suggest{font-size:.73rem;padding:6px;border-radius:5px;margin-bottom:6px}
.last{color:var(--a);background:#07351f;border:1px solid #176b43}
.suggest{color:var(--blue);background:#062d3c;border:1px solid #17607c}
table{width:100%;border-collapse:collapse}
th{color:var(--sub);font-size:.7rem;font-weight:normal}
td{text-align:center;padding:2px}
td input{margin:0;text-align:center;padding:7px}
.warm{color:#ffb74d;font-size:.7rem;margin:6px 0}
.row-actions{display:flex;gap:5px;margin-top:6px}
.rest{display:flex;gap:5px;align-items:center;margin-top:6px}
.rest input{margin:0;width:80px}
.rm,.vol{font-size:.72rem;color:var(--gold);margin-top:6px}
.vol{color:var(--a)}
.finish{background:#333;color:#fff;border:1px solid var(--bor);padding:6px 8px;border-radius:6px;font-size:.72rem}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal{padding:8px 2px;background:var(--item);border-radius:5px;font-size:.78rem}
.cal.on{background:var(--a);color:#000;font-weight:bold}
.cal.empty{background:none}
.chart{width:100%;height:190px;background:#191919;border:1px solid var(--bor);border-radius:8px}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.stat{background:var(--item);padding:10px;border-radius:8px;text-align:center}
.stat b{display:block;color:var(--a);font-size:1.1rem}.stat span{font-size:.7rem;color:var(--sub)}
.report{border-bottom:1px solid var(--bor);padding:9px 0;font-size:.8rem}
.empty{text-align:center;color:var(--sub);padding:18px;font-size:.85rem}
@media print{nav,header,.timer,.days,button,input,select,canvas{display:none!important}body{background:#fff;color:#000}.card{border:0;background:#fff}.report{color:#000}}
</style>
</head>
<body>
<header><h1>MI GIMNASIO PRO v4</h1></header>
<div class="container">

<section id="tab-entrenar" class="tab active">
<div class="timer">
<div style="display:flex;justify-content:space-between"><span style="font-size:.75rem;color:var(--sub)">⏱️ DESCANSO</span><button id="wake" class="finish" onclick="wake()">💡 Pantalla</button></div>
<div id="clock" class="clock">00:00</div>
<div class="tbuttons">
<button onclick="timer(60)">60s</button><button onclick="timer(90)">90s</button><button onclick="timer(120)">120s</button><button onclick="stopTimer()">Stop</button>
</div></div>

<div class="card"><h2>Selecciona el día</h2><div class="days">
<button class="btn out" onclick="selectDay(1)">Día 1</button>
<button class="btn out" onclick="selectDay(2)">Día 2</button>
<button class="btn out" onclick="selectDay(3)">Día 3</button>
<button class="btn out" onclick="selectDay(4)">Día 4</button>
</div></div>

<div id="work" style="display:none"><div class="card">
<h2 id="daytitle">Día</h2>
<label>Fecha</label><input type="date" id="date">
<div id="form"></div>
<button class="btn" onclick="saveWorkout()">💾 Guardar entrenamiento</button>
</div></div>
</section>

<section id="tab-rutina" class="tab">
<div class="card"><h2>⚙️ Configurar rutina</h2>
<label>Día</label><select id="cfgday" onchange="loadConfig()">
<option value="1">Día 1</option><option value="2">Día 2</option><option value="3">Día 3</option><option value="4">Día 4</option>
</select><div id="editor"></div>
<button class="btn" onclick="saveConfig()">Guardar configuración</button>
</div>
<div class="card"><h2>💾 Copia de seguridad</h2>
<button class="btn out" onclick="exportData()">📦 Exportar JSON</button><br><br>
<button class="btn out" onclick="document.getElementById('file').click()">📥 Importar JSON</button>
<input id="file" type="file" accept=".json" style="display:none" onchange="importData(event)">
</div></section>

<section id="tab-calendario" class="tab"><div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
<button class="btn out sm" onclick="month(-1)">❮</button><h2 id="monthname" style="margin:0"></h2><button class="btn out sm" onclick="month(1)">❯</button>
</div>
<div class="calendar" id="calendar"></div><div id="detail"></div>
</div></section>

<section id="tab-informes" class="tab">
<div class="card"><h2>📊 Resumen</h2><div id="stats" class="statgrid"></div></div>
<div class="card"><h2>📈 Progresión</h2>
<select id="chartselect" onchange="chart()"><option value="">Elige ejercicio</option></select>
<canvas id="canvas" class="chart"></canvas></div>
<div class="card"><h2>📋 Historial</h2>
<div style="display:flex;gap:6px"><button class="btn out" onclick="report(15)">15 días</button><button class="btn out" onclick="report(30)">30 días</button><button class="btn out" onclick="window.print()">PDF</button></div>
<div id="reports" class="empty">Selecciona un periodo.</div></div>
</section>
</div>

<nav>
<button id="n-entrenar" class="active" onclick="tab('entrenar')">🏋️<span>Entrenar</span></button>
<button id="n-rutina" onclick="tab('rutina')">⚙️<span>Rutina</span></button>
<button id="n-calendario" onclick="tab('calendario')">📅<span>Calendario</span></button>
<button id="n-informes" onclick="tab('informes')">📊<span>Informes</span></button>
</nav>

<script>
const K='gym_',D={g1:'Grupo 1',e1:['Ej 1','Ej 2'],img1:['',''],g2:'Grupo 2',e2:['Ej 1','Ej 2'],img2:['','']};
let routine=JSON.parse(localStorage.getItem(K+'routine'))||{};
for(let i=1;i<5;i++)routine[i]||(routine[i]=JSON.parse(JSON.stringify(D)));
let logs=JSON.parse(localStorage.getItem(K+'logs'))||[],day=null,monthDate=new Date(),interval=null,seconds=0,lock=null;

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const save=()=>{localStorage.setItem(K+'routine',JSON.stringify(routine));localStorage.setItem(K+'logs',JSON.stringify(logs))};
const rm=(w,r)=>r===1?w:Math.round(w*(1+r/30));
function last(ex){
for(let i=logs.length-1;i>=0;i--)for(const g of logs[i].groups||[])for(const e of g.exercises||[])if(e.name===ex){
let s=e.sets||[{reps:e.reps||10,weight:e.weight||0}];return {date:new Date(logs[i].date).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'}),sets:s};
}return null
}
function max(ex){
let m=0;logs.forEach(l=>(l.groups||[]).forEach(g=>(g.exercises||[]).forEach(e=>{if(e.name===ex)(e.sets||[{weight:e.weight}]).forEach(s=>m=Math.max(m,+s.weight||0))})));return m
}
function tab(x){
document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));document.getElementById('tab-'+x).classList.add('active');
document.querySelectorAll('nav button').forEach(e=>e.classList.remove('active'));document.getElementById('n-'+x).classList.add('active');
if(x==='rutina')loadConfig();if(x==='calendario')renderCalendar();if(x==='informes'){stats();fillChart()}
}
async function wake(){
if(!('wakeLock'in navigator))return alert('Wake Lock no disponible.');
try{if(!lock){lock=await navigator.wakeLock.request('screen');document.getElementById('wake').innerText='💡 ON'}else{await lock.release();lock=null;document.getElementById('wake').innerText='💡 Pantalla'}}catch(e){}
}
function timer(s){clearInterval(interval);seconds=s;showClock();interval=setInterval(()=>{seconds--;showClock();if(seconds<=0){clearInterval(interval);beep()}},1000)}
function stopTimer(){clearInterval(interval);seconds=0;showClock()}
function showClock(){document.getElementById('clock').innerText=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
function beep(){try{let c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=900;o.start();o.stop(c.currentTime+.35)}catch(e){}}

function selectDay(d){
day=d;document.getElementById('work').style.display='block';document.getElementById('daytitle').innerText='Entrenamiento - Día '+d;document.getElementById('date').value=new Date().toISOString().slice(0,10);
let x=routine[d],html='';
[['g1','e1','img1'],['g2','e2','img2']].forEach(a=>{
html+=`<div class="group">${esc(x[a[0]])}</div>`;
(x[a[1]]||[]).forEach((ex,i)=>{
let l=last(ex),sets=l?l.sets.slice(0,3):[1,2,3].map(()=>({reps:10,weight:0,rir:2}));while(sets.length<3)sets.push({reps:10,weight:0,rir:2});
let lw=Math.max(...sets.map(s=>+s.weight||0)),pr=max(ex);
html+=`<div class="ex"><div class="exhead"><span>${esc(ex)}</span><span id="pr-${a[0]}-${i}" class="badge" style="display:none">🏆 PR</span></div>
${l?`<div class="last">Último ${l.date}: ${sets.map((s,j)=>`S${j+1} ${s.reps}×${s.weight}kg`).join(' · ')}</div>`:''}
${lw?`<div class="suggest" onclick="suggest('${a[0]}',${i},${(lw*1.025).toFixed(1)})">💡 Sugerencia: ${(lw*1.025).toFixed(1)} kg</div>`:''}
<table><thead><tr><th>S</th><th>Reps</th><th>Kg</th><th>RIR</th><th>RPE</th><th></th></tr></thead><tbody>`;
sets.forEach((s,j)=>html+=`<tr><td>${j+1}</td>
<td><input type="number" id="${a[0]}-${i}-r${j}" value="${s.reps||10}" oninput="calc('${a[0]}',${i})"></td>
<td><input type="number" step=".5" id="${a[0]}-${i}-w${j}" value="${s.weight||''}" oninput="calc('${a[0]}',${i});pr('${a[0]}',${i},'${esc(ex)}')"></td>
<td><input type="number" min="0" max="5" id="${a[0]}-${i}-q${j}" value="${s.rir??2}" oninput="calc('${a[0]}',${i})"></td>
<td id="${a[0]}-${i}-e${j}">${10-(s.rir??2)}</td>
<td><button class="finish" onclick="timer(+document.getElementById('rest-${a[0]}-${i}').value||90)">▶</button></td></tr>`);
html+=`</tbody></table>
<div class="rm" id="rm-${a[0]}-${i}"></div><div class="vol" id="vol-${a[0]}-${i}"></div>
<div class="rest"><span style="font-size:.7rem;color:var(--sub)">Descanso:</span><input type="number" id="rest-${a[0]}-${i}" value="90"><span style="font-size:.7rem">s</span></div>
<div class="warm">🔥 Calentamiento opcional: <button class="finish" onclick="timer(60)">60s</button></div></div>`;
});
});
document.getElementById('form').innerHTML=html;
document.querySelectorAll('.ex').forEach((e,i)=>{});
}
function calc(g,i){
let best=0,vol=0;
for(let j=0;j<3;j++){let w=+document.getElementById(`${g}-${i}-w${j}`).value||0,r=+document.getElementById(`${g}-${i}-r${j}`).value||0,q=+document.getElementById(`${g}-${i}-q${j}`).value||0;best=Math.max(best,rm(w,r));vol+=w*r;document.getElementById(`${g}-${i}-e${j}`).innerText=Math.max(1,10-q)}
document.getElementById(`rm-${g}-${i}`).innerText=`🔥 1RM estimado: ${best?best+' kg':'--'}`;
document.getElementById(`vol-${g}-${i}`).innerText=`📦 Volumen: ${vol.toFixed(1)} kg`;
}
function suggest(g,i,w){document.getElementById(`${g}-${i}-w2`).value=w;calc(g,i)}
function pr(g,i,ex){
let m=max(ex),v=+document.getElementById(`${g}-${i}-w0`).value||0;
for(let j=1;j<3;j++)v=Math.max(v,+document.getElementById(`${g}-${i}-w${j}`).value||0);
document.getElementById(`pr-${g}-${i}`).style.display=v>m&&m>0?'inline':'none'
}
function saveWorkout(){
if(!day)return;let x=routine[day],log={id:Date.now(),date:new Date(document.getElementById('date').value+'T12:00:00').toISOString(),day,groups:[]};
[['g1','e1'],['g2','e2']].forEach(a=>{let g={name:x[a[0]],exercises:[]};(x[a[1]]||[]).forEach((ex,i)=>{let sets=[];for(let j=0;j<3;j++)sets.push({reps:+document.getElementById(`${a[0]}-${i}-r${j}`).value||0,weight:+document.getElementById(`${a[0]}-${i}-w${j}`).value||0,rir:+document.getElementById(`${a[0]}-${i}-q${j}`).value||0});g.exercises.push({name:ex,sets})});log.groups.push(g)});
logs.push(log);save();alert('¡Entrenamiento guardado!');document.getElementById('work').style.display='none'
}

function loadConfig(){
let x=routine[document.getElementById('cfgday').value],h=`<label>Grupo 1</label><input id="g1n" value="${esc(x.g1)}"><div class="group">Ejercicios <button class="btn out sm" onclick="add('g1')">+ Añadir</button></div><div id="g1c">`;
(x.e1||[]).forEach((e,i)=>h+=field('g1',e,(x.img1||[])[i]));h+='</div><label>Grupo 2</label><input id="g2n" value="'+esc(x.g2)+'"><div class="group">Ejercicios <button class="btn out sm" onclick="add(\'g2\')">+ Añadir</button></div><div id="g2c">';
(x.e2||[]).forEach((e,i)=>h+=field('g2',e,(x.img2||[])[i]));document.getElementById('editor').innerHTML=h+'</div>'
}
function field(g,n,img){return `<div class="ex"><input class="${g}e" value="${esc(n)}" placeholder="Ejercicio"><input class="${g}i" value="${esc(img||'')}" placeholder="URL imagen/GIF"><button class="btn danger sm" onclick="this.parentElement.remove()">Eliminar</button></div>`}
function add(g){document.getElementById(g+'c').insertAdjacentHTML('beforeend',field(g,'',''))}
function saveConfig(){
let d=document.getElementById('cfgday').value,x={g1:document.getElementById('g1n').value.trim(),e1:[],img1:[],g2:document.getElementById('g2n').value.trim(),e2:[],img2:[]};
['g1','g2'].forEach(g=>document.querySelectorAll('.'+g+'e').forEach((e,i)=>{if(e.value.trim()){x[g==='g1'?'e1':'e2'].push(e.value.trim());x[g==='g1'?'img1':'img2'].push(document.querySelectorAll('.'+g+'i')[i].value.trim())}}));
routine[d]=x;save();alert('Rutina guardada')
}
function exportData(){let b=new Blob([JSON.stringify({routine,logs},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='gym_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d||typeof d!=='object')throw 0;if(d.routine)routine=d.routine;if(Array.isArray(d.logs))logs=d.logs;save();alert('Datos importados');location.reload()}catch(x){alert('Archivo JSON no válido')}};r.readAsText(f)}

function month(n){monthDate.setMonth(monthDate.getMonth()+n);renderCalendar()}
function renderCalendar(){
let y=monthDate.getFullYear(),m=monthDate.getMonth(),names=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];document.getElementById('monthname').innerText=names[m]+' '+y;
let first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),h=['Lu','Ma','Mi','Ju','Vi','Sá','Do'].map(x=>`<b style="font-size:.7rem;color:var(--sub)">${x}</b>`).join('');
for(let i=0;i<first;i++)h+='<div class="cal empty"></div>';
for(let d=1;d<=days;d++){let on=logs.some(l=>{let z=new Date(l.date);return z.getFullYear()===y&&z.getMonth()===m&&z.getDate()===d});h+=`<div class="cal ${on?'on':''}" onclick="detail(${y},${m},${d})">${d}</div>`}
document.getElementById('calendar').innerHTML=h;document.getElementById('detail').innerHTML=''
}
function detail(y,m,d){
let a=logs.filter(l=>{let z=new Date(l.date);return z.getFullYear()===y&&z.getMonth()===m&&z.getDate()===d}),h=`<div class="group">${String(d).padStart(2,'0')}/${String(m+1).padStart(2,'0')}/${y}</div>`;
if(!a.length)return document.getElementById('detail').innerHTML=h+'<div class="empty">Sin entrenamiento.</div>';
a.forEach(l=>{h+=`<div class="report"><b>Día ${l.day}</b>`;(l.groups||[]).forEach(g=>{h+=`<div style="color:var(--a);margin-top:4px">${esc(g.name)}</div>`;(g.exercises||[]).forEach(e=>h+=`<div>${esc(e.name)}: ${(e.sets||[]).map((s,i)=>`S${i+1} ${s.reps}×${s.weight}kg RIR${s.rir??'-'}`).join(' · ')}</div>`)});h+='</div>'});document.getElementById('detail').innerHTML=h
}

function allExercises(){let s=new Set();logs.forEach(l=>(l.groups||[]).forEach(g=>(g.exercises||[]).forEach(e=>s.add(e.name))));return [...s]}
function fillChart(){let s=document.getElementById('chartselect'),v=s.value;s.innerHTML='<option value="">Elige ejercicio</option>'+allExercises().map(e=>`<option>${esc(e)}</option>`).join('');s.value=v}
function chart(){
let name=document.getElementById('chartselect').value,c=document.getElementById('canvas'),ctx=c.getContext('2d');c.width=c.clientWidth*devicePixelRatio;c.height=190*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);let W=c.clientWidth,H=190;ctx.clearRect(0,0,W,H);if(!name)return;
let p=[];logs.forEach(l=>(l.groups||[]).forEach(g=>(g.exercises||[]).forEach(e=>{if(e.name===name)(e.sets||[]).forEach(s=>s.weight&&p.push({d:new Date(l.date),w:+s.weight}))})));p.sort((a,b)=>a.d-b.d);if(!p.length)return;
let min=Math.min(...p.map(x=>x.w)),maxi=Math.max(...p.map(x=>x.w)),pad=25,range=maxi-min||1;ctx.strokeStyle='#333';ctx.beginPath();ctx.moveTo(pad,10);ctx.lineTo(pad,H-25);ctx.lineTo(W-10,H-25);ctx.stroke();ctx.strokeStyle='#00e676';ctx.lineWidth=2;ctx.beginPath();p.forEach((x,i)=>{let X=pad+(W-pad-15)*(i/(Math.max(1,p.length-1))),Y=H-25-(x.w-min)/range*(H-45);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.stroke()
}
function stats(){
let volume=0,sets=0,prs=0,days=new Set();logs.forEach(l=>{days.add(new Date(l.date).toDateString());(l.groups||[]).forEach(g=>(g.exercises||[]).forEach(e=>(e.sets||[]).forEach(s=>{volume+=(+s.weight||0)*(+s.reps||0);sets++;})))});
let names=allExercises();names.forEach(e=>{let m=max(e);logs.forEach(l=>(l.groups||[]).forEach(g=>(g.exercises||[]).forEach(x=>{if(x.name===e)(x.sets||[]).forEach(s=>{if(+s.weight>m)prs++})})))});document.getElementById('stats').innerHTML=`<div class="stat"><b>${days.size}</b><span>Sesiones</span></div><div class="stat"><b>${volume.toFixed(0)} kg</b><span>Volumen</span></div><div class="stat"><b>${sets}</b><span>Series</span></div><div class="stat"><b>${prs}</b><span>PR detectados</span></div>`
}
function report(days){
let cut=Date.now()-days*86400000,a=logs.filter(l=>new Date(l.date).getTime()>=cut).sort((x,y)=>new Date(y.date)-new Date(x.date)),h='';
if(!a.length)return document.getElementById('reports').innerHTML=`<div class="empty">Sin entrenamientos en ${days} días.</div>`;
a.forEach(l=>{let vol=0;(l.groups||[]).forEach(g=>(g.exercises||[]).forEach(e=>(e.sets||[]).forEach(s=>vol+=(+s.weight||0)*(+s.reps||0))));h+=`<div class="report"><b>${new Date(l.date).toLocaleDateString('es-ES')} · Día ${l.day}</b><br>📦 ${vol.toFixed(0)} kg de volumen</div>`});document.getElementById('reports').innerHTML=h
}
renderCalendar();showClock();
</script>
</body>
