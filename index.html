<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>GALACHE - Gimnasio</title>
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
--bg:#121212;
--card:#1e1e1e;
--accent:#00e676;
--text:#fff;
--secondary:#b0b0b0;
--border:#333;
--danger:#ff5252;
--gold:#ffd700;
--info:#29b6f6;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
background:var(--bg);
color:var(--text);
padding-bottom:90px;
}

header{
background:var(--card);
padding:15px;
text-align:center;
border-bottom:1px solid var(--border);
position:sticky;
top:0;
z-index:100;
}

h1{
font-size:1.3rem;
color:var(--accent);
text-transform:uppercase;
letter-spacing:1px;
}

.container{
padding:15px;
max-width:600px;
margin:auto;
}

nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:var(--card);
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid var(--border);
z-index:1000;
}

nav button{
background:none;
border:none;
color:var(--secondary);
font-size:.75rem;
display:flex;
flex-direction:column;
align-items:center;
gap:3px;
width:25%;
}

nav button.active{
color:var(--accent);
font-weight:bold;
}

.tab-content{display:none}
.tab-content.active{display:block}

.card{
background:var(--card);
border-radius:12px;
padding:16px;
margin-bottom:15px;
border:1px solid var(--border);
}

.card h2{
font-size:1.1rem;
margin-bottom:12px;
color:var(--accent);
display:flex;
justify-content:space-between;
align-items:center;
}

.day-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:15px;
}

.btn{
background:var(--accent);
color:#000;
border:none;
padding:12px;
border-radius:8px;
font-weight:bold;
width:100%;
cursor:pointer;
font-size:.95rem;
}

.btn-outline{
background:transparent;
color:var(--text);
border:1px solid var(--border);
}

.btn-danger{
background:transparent;
color:var(--danger);
border:1px solid var(--danger);
padding:6px 12px;
border-radius:6px;
font-size:.8rem;
}

.btn-sm{
padding:6px 12px;
font-size:.8rem;
width:auto;
}

input,select{
width:100%;
padding:10px;
background:#2a2a2a;
border:1px solid var(--border);
color:var(--text);
border-radius:6px;
margin-bottom:10px;
font-size:.95rem;
}

.exercise-item{
background:#252525;
border-radius:8px;
padding:12px;
margin-bottom:12px;
}

.exercise-header{
font-weight:bold;
margin-bottom:8px;
display:flex;
justify-content:space-between;
align-items:center;
}

.exercise-img{
width:100%;
max-height:200px;
object-fit:contain;
background:#1a1a1a;
border-radius:6px;
margin-bottom:8px;
border:1px solid var(--border);
}

.last-data{
font-size:.75rem;
color:var(--accent);
background:rgba(0,230,118,.1);
border:1px solid rgba(0,230,118,.3);
padding:6px 8px;
border-radius:4px;
margin-bottom:8px;
}

.suggestion-box{
font-size:.75rem;
color:var(--info);
background:rgba(41,182,246,.1);
border:1px solid rgba(41,182,246,.3);
padding:6px 8px;
border-radius:4px;
margin-bottom:8px;
}

.series-title{
color:var(--accent);
font-size:.8rem;
font-weight:bold;
margin:8px 0 4px;
}

.series-row{
display:grid;
grid-template-columns:55px 1fr 1fr;
gap:7px;
align-items:center;
margin-bottom:7px;
}

.series-number{
font-size:.8rem;
color:var(--secondary);
font-weight:bold;
}

.series-row input{
margin:0;
text-align:center;
}

.group-title{
color:var(--secondary);
margin:15px 0 8px;
text-transform:uppercase;
font-size:.8rem;
letter-spacing:.5px;
}

.timer-box{
background:#252525;
border:1px solid var(--accent);
border-radius:10px;
padding:12px;
margin-bottom:15px;
text-align:center;
}

.timer-display{
font-size:2rem;
font-weight:bold;
color:var(--accent);
font-family:monospace;
margin:5px 0;
}

.timer-presets{
display:flex;
gap:8px;
justify-content:center;
margin-top:8px;
}

.timer-btn{
background:#333;
color:#fff;
border:1px solid var(--border);
padding:6px 12px;
border-radius:6px;
font-size:.85rem;
}

.calendar-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.calendar-grid{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:5px;
text-align:center;
}

.cal-day-name{
font-size:.75rem;
color:var(--secondary);
font-weight:bold;
padding:5px 0;
}

.cal-day{
aspect-ratio:1;
display:flex;
align-items:center;
justify-content:center;
border-radius:6px;
background:#252525;
font-size:.85rem;
}

.cal-day.empty{
background:transparent;
}

.cal-day.has-workout{
background:var(--accent);
color:#000;
font-weight:bold;
}

.report-item{
border-bottom:1px solid var(--border);
padding:10px 0;
}

.report-date{
font-size:.8rem;
color:var(--accent);
}

.empty-state{
text-align:center;
color:var(--secondary);
padding:20px;
font-size:.9rem;
}

canvas{
width:100%;
height:180px;
background:#1a1a1a;
border-radius:8px;
border:1px solid var(--border);
margin-top:10px;
}

@media print{
body{background:#fff;color:#000;padding:0}
header,nav,.timer-box,.day-grid,.btn,button,
select,input,canvas{display:none!important}
.card{border:none;background:#fff;color:#000;padding:0}
}
</style>
</head>

<body>

<header>
<h1>GALACHE - MI GIMNASIO</h1>
</header>

<div class="container">

<!-- ================= ENTRENAR ================= -->

<div id="tab-entrenar" class="tab-content active">

<div class="timer-box">

<div style="display:flex;justify-content:space-between;align-items:center;">
<span style="font-size:.8rem;color:var(--secondary)">
⏱️ Temporizador
</span>

<button id="wakelock-btn"
class="timer-btn"
onclick="toggleWakeLock()">
💡 PANTALLA: OFF
</button>
</div>

<div id="timer-display" class="timer-display">
00:00
</div>

<div class="timer-presets">
<button class="timer-btn" onclick="startTimer(60)">60s</button>
<button class="timer-btn" onclick="startTimer(90)">90s</button>
<button class="timer-btn" onclick="startTimer(120)">120s</button>
<button class="timer-btn"
style="color:var(--danger)"
onclick="stopTimer()">STOP</button>
</div>

</div>

<div class="card">

<h2>Selecciona el día</h2>

<div class="day-grid">

<button class="btn btn-outline"
onclick="selectDay(1)">
Día 1
</button>

<button class="btn btn-outline"
onclick="selectDay(2)">
Día 2
</button>

<button class="btn btn-outline"
onclick="selectDay(3)">
Día 3
</button>

<button class="btn btn-outline"
onclick="selectDay(4)">
Día 4
</button>

</div>

</div>

<div id="workout-area" style="display:none">

<div class="card">

<h2 id="current-day-title">
Entrenamiento
</h2>

<label style="font-size:.8rem;color:var(--secondary)">
Fecha del entrenamiento
</label>

<input type="date" id="workout-date">

<div id="workout-form"></div>

<button class="btn"
style="margin-top:15px"
onclick="saveWorkout()">
💾 GUARDAR ENTRENAMIENTO
</button>

</div>

</div>

</div>

<!-- ================= RUTINA ================= -->

<div id="tab-rutina" class="tab-content">

<div class="card">

<h2>Configurar Rutina</h2>

<label>Selecciona Día:</label>

<select id="config-day-select"
onchange="loadRoutineConfig()">

<option value="1">Día 1</option>
<option value="2">Día 2</option>
<option value="3">Día 3</option>
<option value="4">Día 4</option>

</select>

<div id="routine-editor"></div>

<button class="btn"
style="margin-top:15px"
onclick="saveRoutineConfig()">
💾 GUARDAR CONFIGURACIÓN
</button>

</div>

<div class="card">

<h2>Copia de Seguridad</h2>

<button class="btn btn-outline"
onclick="exportData()">
📦 Exportar Datos
</button>

<br><br>

<button class="btn btn-outline"
onclick="document.getElementById('import-file').click()">
📥 Importar Datos
</button>

<input type="file"
id="import-file"
style="display:none"
accept=".json"
onchange="importData(event)">

</div>

</div>

<!-- ================= CALENDARIO ================= -->

<div id="tab-calendario" class="tab-content">

<div class="card">

<div class="calendar-header">

<button class="btn btn-outline"
style="width:auto"
onclick="changeMonth(-1)">
❮
</button>

<h2 id="calendar-month-year">
Mes Año
</h2>

<button class="btn btn-outline"
style="width:auto"
onclick="changeMonth(1)">
❯
</button>

</div>

<div class="calendar-grid">

<div class="cal-day-name">Lu</div>
<div class="cal-day-name">Ma</div>
<div class="cal-day-name">Mi</div>
<div class="cal-day-name">Ju</div>
<div class="cal-day-name">Vi</div>
<div class="cal-day-name">Sá</div>
<div class="cal-day-name">Do</div>

</div>

<div class="calendar-grid"
id="calendar-body"
style="margin-top:5px">
</div>

</div>

<div class="card"
id="calendar-detail"
style="display:none">

<h2 id="detail-date-title">
Detalle
</h2>

<div id="detail-content"></div>

</div>

</div>

<!-- ================= INFORMES ================= -->

<div id="tab-informes" class="tab-content">

<div class="card">

<h2>📈 Progresión de Fuerza</h2>

<label style="font-size:.8rem;color:var(--secondary)">
Selecciona ejercicio
</label>

<select id="chart-ex-select"
onchange="renderProgressChart()">

<option value="">
-- Elige un ejercicio --
</option>

</select>

<canvas id="progressChart"></canvas>

</div>

<div class="card">

<h2>Resumen de Sesiones</h2>

<button class="btn btn-outline"
onclick="generateReport(15)">
Últimos 15 días
</button>

<br><br>

<button class="btn btn-outline"
onclick="generateReport(30)">
Último mes
</button>

<br><br>

<button class="btn btn-outline"
onclick="window.print()">
🖨️ Imprimir / PDF
</button>

<div id="report-results"
style="margin-top:15px">

<div class="empty-state">
Selecciona un periodo.
</div>

</div>

</div>

</div>

</div>

<!-- ================= NAVEGACIÓN ================= -->

<nav>

<button id="nav-entrenar"
class="active"
onclick="switchTab('entrenar')">

<span>🏋️</span>
<span>Entrenar</span>

</button>

<button id="nav-rutina"
onclick="switchTab('rutina')">

<span>⚙️</span>
<span>Rutina</span>

</button>

<button id="nav-calendario"
onclick="switchTab('calendario')">

<span>📅</span>
<span>Calendario</span>

</button>

<button id="nav-informes"
onclick="switchTab('informes')">

<span>📊</span>
<span>Informes</span>

</button>

</nav>
<script>

let routineData =
JSON.parse(localStorage.getItem('gym_routine')) || {};

const defaultDay = {
    g1: "Grupo 1",
    e1: ["Ejercicio 1", "Ejercicio 2"],
    img1: ["", ""],
    g2: "Grupo 2",
    e2: ["Ejercicio 1", "Ejercicio 2"],
    img2: ["", ""]
};

for(let i=1;i<=4;i++){
    if(!routineData[i]){
        routineData[i] =
        JSON.parse(JSON.stringify(defaultDay));
    }
}

let currentActiveDay = null;
let currentCalendarDate = new Date();

let timerInterval = null;
let remainingSeconds = 0;
let wakeLock = null;


/* ================= NAVEGACIÓN ================= */

function switchTab(tabId){

    document.querySelectorAll('.tab-content')
    .forEach(t=>t.classList.remove('active'));

    document.querySelectorAll('nav button')
    .forEach(b=>b.classList.remove('active'));

    document.getElementById(`tab-${tabId}`)
    .classList.add('active');

    document.getElementById(`nav-${tabId}`)
    .classList.add('active');

    if(tabId==="rutina"){
        loadRoutineConfig();
    }

    if(tabId==="calendario"){
        renderCalendar();
    }

    if(tabId==="informes"){
        populateChartSelect();
    }
}


/* ================= PANTALLA ENCENDIDA ================= */

async function toggleWakeLock(){

    const btn =
    document.getElementById('wakelock-btn');

    if(!('wakeLock' in navigator)){
        alert("Tu navegador no permite mantener la pantalla encendida.");
        return;
    }

    try{

        if(!wakeLock){

            wakeLock =
            await navigator.wakeLock.request('screen');

            btn.innerText="💡 PANTALLA: ON";
            btn.style.background="var(--accent)";
            btn.style.color="#000";

        }else{

            await wakeLock.release();

            wakeLock=null;

            btn.innerText="💡 PANTALLA: OFF";
            btn.style.background="#333";
            btn.style.color="#fff";
        }

    }catch(e){

        alert("No se pudo activar la pantalla permanente.");

    }
}


/* ================= TEMPORIZADOR ================= */

function startTimer(seconds){

    clearInterval(timerInterval);

    remainingSeconds=seconds;

    updateTimerDisplay();

    timerInterval=setInterval(()=>{

        remainingSeconds--;

        updateTimerDisplay();

        if(remainingSeconds<=0){

            clearInterval(timerInterval);

            remainingSeconds=0;

            updateTimerDisplay();

            playFinalBeep();

        }

    },1000);
}


function stopTimer(){

    clearInterval(timerInterval);

    remainingSeconds=0;

    updateTimerDisplay();
}


function updateTimerDisplay(){

    const mins=
    Math.floor(remainingSeconds/60);

    const secs=
    remainingSeconds%60;

    document.getElementById('timer-display')
    .innerText=
    `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
}


function playFinalBeep(){

    try{

        const ctx=
        new(window.AudioContext ||
        window.webkitAudioContext)();

        const osc=
        ctx.createOscillator();

        osc.frequency.value=900;

        osc.connect(ctx.destination);

        osc.start();

        osc.stop(ctx.currentTime+.5);

    }catch(e){}
}


/* ================= SELECCIONAR DÍA ================= */

function selectDay(day){

    currentActiveDay=day;

    document.getElementById('workout-area')
    .style.display='block';

    document.getElementById('current-day-title')
    .innerText=`Entrenamiento - Día ${day}`;

    const today=
    new Date().toISOString().split('T')[0];

    document.getElementById('workout-date')
    .value=today;

    const data=
    routineData[day] || defaultDay;

    const container=
    document.getElementById('workout-form');

    let html='';


    /* ===== CREAR GRUPO ===== */

    function renderGroup(
        groupName,
        exercises,
        images,
        prefix
    ){

        let result=
        `<div class="group-title">
        ${groupName || "Grupo"}
        </div>`;

        (exercises || []).forEach(
        (exercise,index)=>{

            const image=
            images && images[index]
            ? images[index]
            : "";

            result+=renderExercise(
                exercise,
                image,
                prefix,
                index
            );

        });

        return result;
    }


    html+=renderGroup(
        data.g1,
        data.e1,
        data.img1,
        "g1"
    );

    html+=renderGroup(
        data.g2,
        data.e2,
        data.img2,
        "g2"
    );

    container.innerHTML=html;
}


/* ================= EJERCICIO ================= */

function renderExercise(
    exercise,
    image,
    prefix,
    index
){

    const last=
    getLastExerciseData(exercise);

    let lastHtml="";

    if(last){

        lastHtml=`
        <div class="last-data">
        Último entrenamiento:
        ${last.series1}kg x ${last.reps1},
        ${last.series2}kg x ${last.reps2},
        ${last.series3}kg x ${last.reps3}
        </div>
        `;

    }else{

        lastHtml=`
        <div class="last-data">
        Sin registros previos
        </div>
        `;
    }


    let imageHtml="";

    if(image){

        imageHtml=`
        <img
        src="${image}"
        class="exercise-img"
        alt="${exercise}">
        `;

    }


    return `

    <div class="exercise-item">

        <div class="exercise-header">

            <span>${exercise}</span>

        </div>

        ${imageHtml}

        ${lastHtml}


        <div class="series-title">
        REGISTRO DE LAS 3 SERIES
        </div>


        <!-- SERIE 1 -->

        <div class="series-row">

            <div class="series-number">
            Serie 1
            </div>

            <input
            type="number"
            min="0"
            id="${prefix}_${index}_r1"
            placeholder="Reps">

            <input
            type="number"
            min="0"
            step="0.5"
            id="${prefix}_${index}_p1"
            placeholder="Kg">

        </div>


        <!-- SERIE 2 -->

        <div class="series-row">

            <div class="series-number">
            Serie 2
            </div>

            <input
            type="number"
            min="0"
            id="${prefix}_${index}_r2"
            placeholder="Reps">

            <input
            type="number"
            min="0"
            step="0.5"
            id="${prefix}_${index}_p2"
            placeholder="Kg">

        </div>


        <!-- SERIE 3 -->

        <div class="series-row">

            <div class="series-number">
            Serie 3
            </div>

            <input
            type="number"
            min="0"
            id="${prefix}_${index}_r3"
            placeholder="Reps">

            <input
            type="number"
            min="0"
            step="0.5"
            id="${prefix}_${index}_p3"
            placeholder="Kg">

        </div>

    </div>

    `;
}


/* ================= ÚLTIMO REGISTRO ================= */

function getLastExerciseData(exName){

    const logs=
    JSON.parse(
        localStorage.getItem('gym_logs')
    ) || [];

    for(let i=logs.length-1;i>=0;i--){

        const log=logs[i];

        for(const group of log.groups){

            for(const exercise of group.exercises){

                if(exercise.name===exName){

                    return exercise;
                }

            }

        }

    }

    return null;
}


/* ================= MÁXIMO PESO ================= */

function getMaxWeightForExercise(exName){

    const logs=
    JSON.parse(
        localStorage.getItem('gym_logs')
    ) || [];

    let max=0;

    logs.forEach(log=>{

        log.groups.forEach(group=>{

            group.exercises.forEach(ex=>{

                if(
                    ex.name===exName &&
                    ex.seriesData
                ){

                    ex.seriesData.forEach(series=>{

                        if(series.weight>max){
                            max=series.weight;
                        }

                    });

                }

            });

        });

    });

    return max;
}


/* ================= CONFIGURACIÓN DE RUTINA ================= */

function loadRoutineConfig(){

    const day=
    document.getElementById(
        'config-day-select'
    ).value;

    const data=
    routineData[day] || defaultDay;

    const container=
    document.getElementById(
        'routine-editor'
    );

    let html=`

    <div class="group-title">
    Grupo Muscular 1
    </div>

    <input
    type="text"
    id="g1-name"
    value="${data.g1 || ''}"
    placeholder="Nombre Grupo 1">

    <div class="group-title">

        <span>Ejercicios Grupo 1</span>

        <button
        class="btn btn-outline btn-sm"
        onclick="addExerciseField('g1')">
        + Añadir
        </button>

    </div>

    <div id="g1-container">
    `;


    (data.e1 || []).forEach(
    (exercise,i)=>{

        const img=
        data.img1 &&
        data.img1[i]
        ? data.img1[i]
        : "";

        html+=renderConfigItem(
            'g1',
            exercise,
            img
        );

    });


    html+=`

    </div>

    <div class="group-title"
    style="margin-top:20px">

    Grupo Muscular 2

    </div>

    <input
    type="text"
    id="g2-name"
    value="${data.g2 || ''}"
    placeholder="Nombre Grupo 2">

    <div class="group-title">

        <span>Ejercicios Grupo 2</span>

        <button
        class="btn btn-outline btn-sm"
        onclick="addExerciseField('g2')">
        + Añadir
        </button>

    </div>

    <div id="g2-container">
    `;


    (data.e2 || []).forEach(
    (exercise,i)=>{

        const img=
        data.img2 &&
        data.img2[i]
        ? data.img2[i]
        : "";

        html+=renderConfigItem(
            'g2',
            exercise,
            img
        );

    });


    html+=`</div>`;

    container.innerHTML=html;
}


/* ================= EDITAR EJERCICIOS ================= */

function renderConfigItem(
    prefix,
    name,
    image
){

    return `

    <div
    style="
    background:#252525;
    padding:8px;
    border-radius:6px;
    margin-bottom:10px;
    ">

        <div style="
        display:flex;
        gap:6px">

            <input
            type="text"
            class="${prefix}-ex"
            value="${name}"
            placeholder="Nombre ejercicio">

            <button
            class="btn-danger"
            onclick="
            this.parentElement
            .parentElement
            .remove()
            ">
            X
            </button>

        </div>

        <input
        type="text"
        class="${prefix}-img"
        value="${image}"
        placeholder="URL Imagen/GIF">

    </div>

    `;
}


function addExerciseField(prefix){

    const container=
    document.getElementById(
        `${prefix}-container`
    );

    const div=
    document.createElement('div');

    div.innerHTML=
    renderConfigItem(
        prefix,
        "",
        ""
    );

    container.appendChild(
        div.firstElementChild
    );
}

function saveRoutineConfig(){

    const day=
    document.getElementById(
        'config-day-select'
    ).value;

    const g1=
    document.getElementById(
        'g1-name'
    ).value;

    const g2=
    document.getElementById(
        'g2-name'
    ).value;


    let e1=[];
    let img1=[];

    document
    .querySelectorAll('.g1-ex')
    .forEach(input=>{

        if(input.value.trim()){

            e1.push(
                input.value.trim()
            );

        }

    });


    document
    .querySelectorAll('.g1-img')
    .forEach(input=>{

        img1.push(
            input.value.trim()
        );

    });


    let e2=[];
    let img2=[];


    document
    .querySelectorAll('.g2-ex')
    .forEach(input=>{

        if(input.value.trim()){

            e2.push(
                input.value.trim()
            );

        }

    });


    document
    .querySelectorAll('.g2-img')
    .forEach(input=>{

        img2.push(
            input.value.trim()
        );

    });


    routineData[day]={
        g1:g1,
        e1:e1,
        img1:img1,
        g2:g2,
        e2:e2,
        img2:img2
    };


    localStorage.setItem(
        'gym_routine',
        JSON.stringify(routineData)
    );


    alert(
        "¡Rutina guardada correctamente!"
    );
} 
<script>
function guardarDatos() {
    localStorage.setItem("galacheDatos", JSON.stringify(datos));
    mostrarResumen();
}

function cargarDatos() {
    const guardados = localStorage.getItem("galacheDatos");
    if (guardados) {
        datos = JSON.parse(guardados);
    }
}

function mostrarResumen() {
    const resumen = document.getElementById("resumen");
    if (!resumen) return;

    let html = "";

    Object.keys(datos).forEach(ejercicio => {
        const series = datos[ejercicio];

        if (!series || series.length === 0) return;

        html += `<div class="resumen-ejercicio">
            <h3>${ejercicio}</h3>`;

        series.forEach((serie, i) => {
            html += `
            <div class="resumen-serie">
                Serie ${i + 1}:
                <strong>${serie.repeticiones}</strong> rep.
                — <strong>${serie.peso}</strong> kg
            </div>`;
        });

        html += `</div>`;
    });

    resumen.innerHTML = html || "<p>No hay datos registrados.</p>";
}

function borrarDatos() {
    if (confirm("¿Quieres borrar todos los datos registrados?")) {
        datos = {};
        localStorage.removeItem("galacheDatos");
        mostrarResumen();
        alert("Datos borrados.");
    }
}

function exportarDatos() {
    const contenido = JSON.stringify(datos, null, 2);
    const archivo = new Blob([contenido], {
        type: "application/json"
    });

    const enlace = document.createElement("a");
    enlace.href = URL.createObjectURL(archivo);
    enlace.download = "GALACHE_registro.json";
    enlace.click();

    URL.revokeObjectURL(enlace.href);
}

window.onload = function () {
    cargarDatos();
    mostrarResumen();
};
</script>
