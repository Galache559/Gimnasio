<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mi Gimnasio Pro v4.5</title>
<meta name="theme-color" content="#121212">
<style>
:root{--bg:#121212;--card:#1e1e1e;--item:#252525;--input:#2a2a2a;--a:#00e676;--txt:#fff;--sub:#aaa;--bor:#333;--red:#ff5252;--gold:#ffd700;--blue:#29b6f6}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);padding-bottom:80px}
header{position:sticky;top:0;z-index:10;background:var(--card);padding:12px;text-align:center;border-bottom:1px solid var(--bor)}
h1{font-size:1.15rem;color:var(--a);letter-spacing:1px}
.container{max-width:650px;margin:auto;padding:10px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);display:flex;border-top:1px solid var(--bor);padding:7px 0}
nav button{width:25%;background:none;border:0;color:var(--sub);font-size:.7rem;display:flex;flex-direction:column;gap:2px;align-items:center}
nav button.active{color:var(--a);font-weight:bold}
.tab{display:none}.tab.active{display:block}
.card{background:var(--card);border:1px solid var(--bor);border-radius:11px;padding:12px;margin-bottom:10px}
.card h2{font-size:1rem;color:var(--a);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
button,.btn{cursor:pointer}
.btn{background:var(--a);color:#000;border:0;border-radius:7px;padding:10px;width:100%;font-weight:bold}
.out{background:transparent;color:var(--txt);border:1px solid var(--bor)}
.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.sm{width:auto;padding:5px 9px;font-size:.75rem}
input,select{width:100%;background:var(--input);color:var(--txt);border:1px solid var(--bor);border-radius:6px;padding:8px;margin-bottom:7px;font-size:.88rem}
label{font-size:.73rem;color:var(--sub)}
.days{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.group{color:var(--sub);font-size:.73rem;text-transform:uppercase;margin:12px 0 6px}
.ex{background:var(--item);padding:9px;border-radius:8px;margin-bottom:8px}
.exhead{display:flex;justify-content:space-between;align-items:center;font-weight:bold;margin-bottom:6px}
.badge{background:var(--gold);color:#000;border-radius:4px;padding:2px 5px;font-size:.62rem}
.last,.suggest,.history{font-size:.7rem;padding:5px;border-radius:5px;margin-bottom:5px}
.last{color:var(--a);background:#07351f;border:1px solid #176b43}
.suggest{color:var(--blue);background:#062d3c;border:1px solid #17607c;cursor:pointer}
table{width:100%;border-collapse:collapse}
th{color:var(--sub);font-size:.63rem;font-weight:normal}
td{text-align:center;padding:1px}
td input{margin:0;text-align:center;padding:6px 1px}
.rm,.vol{font-size:.7rem;margin-top:5px}
.rm{color:var(--gold)}.vol{color:var(--a)}
.row{display:flex;gap:5px;margin-top:6px}
.finish{background:#333;color:#fff;border:1px solid var(--bor);padding:6px 9px;border-radius:6px;font-size:.68rem}
.restbtn{width:100%;margin-top:7px;background:#333;color:#fff;border:1px solid var(--bor);padding:8px;border-radius:6px;font-size:.72rem}
.save-ex{width:100%;margin-top:7px;background:#064d2d;color:#fff;border:1px solid #176b43;padding:8px;border-radius:6px;font-size:.72rem;font-weight:bold}
.save-ex.saved{background:#00a854;color:#000}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal{padding:7px 2px;background:var(--item);border-radius:5px;font-size:.75rem}
.cal.on{background:var(--a);color:#000;font-weight:bold}
.cal.empty{background:none}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.stat{background:var(--item);padding:8px;border-radius:7px;text-align:center}
.stat b{display:block;color:var(--a);font-size:1rem}.stat span{font-size:.66rem;color:var(--sub)}
.report{border-bottom:1px solid var(--bor);padding:8px 0;font-size:.76rem}
.empty{text-align:center;color:var(--sub);padding:15px;font-size:.8rem}
.imgbox{display:none;text-align:center;margin:6px 0;padding:6px;background:#191919;border:1px solid var(--bor);border-radius:7px}
.imgbox img{max-width:100%;max-height:320px;border-radius:6px}
.imgbtn{background:#333;color:#fff;border:1px solid var(--bor);padding:5px 9px;border-radius:6px;font-size:.68rem}
.loaded{color:var(--blue);background:#062d3c;border:1px solid #17607c;border-radius:6px;padding:6px;margin-bottom:8px;font-size:.7rem}
.summary{background:#07351f;border:1px solid #176b43;border-radius:9px;padding:12px;margin-top:10px}
.summary h3{color:var(--a);font-size:1rem;margin-bottom:8px;text-align:center}
.summary div{font-size:.78rem;padding:3px 0}
.summary .big{text-align:center;font-size:1.1rem;font-weight:bold;color:var(--a);margin:6px 0}
.muscleReport{background:var(--item);border:1px solid var(--bor);border-radius:8px;padding:9px;margin:7px 0}
.muscleReport h3{color:var(--a);font-size:.9rem;margin-bottom:6px}
.muscleStats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.muscleStat{text-align:center;background:#191919;border-radius:6px;padding:6px}
.muscleStat b{display:block;color:var(--a);font-size:.85rem}.muscleStat span{font-size:.6rem;color:var(--sub)}
.timerOverlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.78);align-items:center;justify-content:center;padding:20px}
.timerBox{width:100%;max-width:330px;background:var(--card);border:1px solid var(--bor);border-radius:15px;padding:22px;text-align:center;box-shadow:0 10px 40px #000}
.timerTitle{color:var(--a);font-size:1rem;margin-bottom:12px}
.timerDisplay{font-size:4rem;font-weight:bold;letter-spacing:2px;margin:12px 0;color:#fff}
.timerDisplay.warning{color:var(--gold)}.timerDisplay.last{color:var(--red);background:none;border:0;padding:0}
.timerClose{background:#333;color:#fff;border:1px solid var(--bor);border-radius:7px;padding:9px 15px;font-size:.75rem}
@media(max-width:380px){td input{font-size:.7rem;padding:5px 1px}.th{font-size:.58rem}.muscleStats{grid-template-columns:1fr 1fr}}
@media print{nav,header,button,input,select,.timerOverlay,canvas{display:none!important}body{background:#fff;color:#000}.card{border:0;background:#fff}.report{color:#000}}
</style>
</head>

<body>

<header><h1>MI GIMNASIO PRO v4.5</h1></header>

<div class="container">

<section id="tab-entrenar" class="tab active">

<div class="card">
<h2>Selecciona el día</h2>

<div class="days">
<button class="btn out" onclick="selectDay(1)">Día 1</button>
<button class="btn out" onclick="selectDay(2)">Día 2</button>
<button class="btn out" onclick="selectDay(3)">Día 3</button>
<button class="btn out" onclick="selectDay(4)">Día 4</button>
</div>

</div>

<div id="work" style="display:none">

<div class="card">

<h2 id="daytitle">Día</h2>

<div id="loadedmsg"></div>

<label>Fecha</label>
<input type="date" id="date">

<div id="form"></div>

<button class="btn" onclick="saveWorkout()">💾 Guardar entrenamiento</button>

<div id="summary"></div>

</div>
</div>

</section>


<section id="tab-rutina" class="tab">

<div class="card">

<h2>⚙️ Configurar rutina</h2>

<label>Día</label>

<select id="cfgday" onchange="loadConfig()">
<option value="1">Día 1</option>
<option value="2">Día 2</option>
<option value="3">Día 3</option>
<option value="4">Día 4</option>
</select>

<div id="editor"></div>

<button class="btn" onclick="saveConfig()">Guardar configuración</button>

</div>


<div class="card">

<h2>💾 Copia de seguridad</h2>

<button class="btn out" onclick="exportData()">📦 Exportar JSON</button>

<br><br>

<button class="btn out" onclick="document.getElementById('file').click()">📥 Importar JSON</button>

<input id="file" type="file" accept=".json" style="display:none" onchange="importData(event)">

</div>

</section>


<section id="tab-calendario" class="tab">

<div class="card">

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">

<button class="btn out sm" onclick="month(-1)">❮</button>

<h2 id="monthname" style="margin:0"></h2>

<button class="btn out sm" onclick="month(1)">❯</button>

</div>

<div class="calendar" id="calendar"></div>

<div id="detail"></div>

</div>

</section>


<section id="tab-informes" class="tab">

<div class="card">

<h2>📊 Resumen</h2>

<div id="stats" class="statgrid"></div>

</div>


<div class="card">

<h2>📋 Informes</h2>

<div style="display:flex;gap:5px;flex-wrap:wrap">

<button class="btn out sm" onclick="report(15)">15 días</button>

<button class="btn out sm" onclick="report(30)">30 días</button>

<button class="btn out sm" onclick="window.print()">PDF</button>

</div>

<div id="reports" class="empty">Selecciona un periodo.</div>

</div>

</section>

</div>


<nav>

<button id="n-entrenar" class="active" onclick="tab('entrenar')">
🏋️<span>Entrenar</span>
</button>

<button id="n-rutina" onclick="tab('rutina')">
⚙️<span>Rutina</span>
</button>

<button id="n-calendario" onclick="tab('calendario')">
📅<span>Calendario</span>
</button>

<button id="n-informes" onclick="tab('informes')">
📊<span>Informes</span>
</button>

</nav>


<div id="timerOverlay" class="timerOverlay">

<div class="timerBox">

<div class="timerTitle">⏱️ DESCANSO</div>

<div id="timerDisplay" class="timerDisplay">02:00</div>

<button class="timerClose" onclick="closeTimer()">Cerrar</button>

</div>

</div>


<script>
"use strict";

const K='gym_';

const D={
g1:'Grupo 1',
e1:['Ej 1','Ej 2'],
img1:[],
g2:'Grupo 2',
e2:['Ej 1','Ej 2'],
img2:[]
};

let routine=JSON.parse(localStorage.getItem(K+'routine'))||{};
let logs=JSON.parse(localStorage.getItem(K+'logs'))||[];

let day=null,
monthDate=new Date(),
timerInterval=null,
timerSeconds=0;

for(let i=1;i<5;i++)
if(!routine[i])
routine[i]=JSON.parse(JSON.stringify(D));

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m]));

const num=v=>parseFloat(v)||0;


function save(){

localStorage.setItem(
K+'routine',
JSON.stringify(routine)
);

localStorage.setItem(
K+'logs',
JSON.stringify(logs)
);

}


function rm(w,r){
return w&&r?w*(1+r/30):0
}


function volume(s){
return(s||[]).reduce(
(a,x)=>a+num(x.weight)*num(x.reps),
0
);
}


function tab(x){

document.querySelectorAll('.tab')
.forEach(e=>e.classList.remove('active'));

let t=document.getElementById('tab-'+x);

if(t)
t.classList.add('active');

document.querySelectorAll('nav button')
.forEach(e=>e.classList.remove('active'));

let n=document.getElementById('n-'+x);

if(n)
n.classList.add('active');

if(x==='rutina')
loadConfig();

if(x==='calendario')
renderCalendar();

if(x==='informes')
stats();

}


function history(ex){

let a=[];

logs.forEach(l=>
(l.groups||[]).forEach(g=>
(g.exercises||[]).forEach(e=>{

if(e.name===ex)
a.push({
date:new Date(l.date),
sets:e.sets||[]
});

})));

return a.sort((a,b)=>a.date-b.date);

}


function max(ex){

let m=0;

history(ex).forEach(x=>
(x.sets||[]).forEach(s=>
m=Math.max(m,num(s.weight))
));

return m;

}


function maxRM(ex){

let m=0;

history(ex).forEach(x=>
(x.sets||[]).forEach(s=>
m=Math.max(
m,
rm(num(s.weight),num(s.reps))
)
));

return Math.round(m*10)/10;

}


function maxSetRM(s){

return Math.round(
Math.max(
0,
...(s||[]).map(
x=>rm(num(x.weight),num(x.reps))
)
)
*10
)/10;

}


/* CRONOMETRO */

function startTimer(){

closeTimer();

timerSeconds=120;

document.getElementById('timerOverlay')
.style.display='flex';

updateTimerDisplay();

timerInterval=setInterval(()=>{

timerSeconds--;

updateTimerDisplay();

if(timerSeconds<=0){

clearInterval(timerInterval);

timerInterval=null;

beep();

setTimeout(closeTimer,700);

}

},1000);

}


function updateTimerDisplay(){

let el=document.getElementById('timerDisplay');

if(!el)return;

let min=Math.floor(timerSeconds/60),
sec=timerSeconds%60;

el.textContent=
String(min).padStart(2,'0')+
':'+
String(sec).padStart(2,'0');

el.classList.remove('warning','last');

if(timerSeconds<=10&&timerSeconds>3)
el.classList.add('warning');

if(timerSeconds<=3)
el.classList.add('last');

if(timerSeconds<=3&&timerSeconds>0)
beep();

}


function closeTimer(){

if(timerInterval){

clearInterval(timerInterval);

timerInterval=null;

}

let o=document.getElementById('timerOverlay');

if(o)
o.style.display='none';

}


function beep(){

try{

let c=new(
window.AudioContext||
window.webkitAudioContext
)();

let o=c.createOscillator(),
g=c.createGain();

o.connect(g);
g.connect(c.destination);

o.frequency.value=900;
g.gain.value=.7;

o.start();
o.stop(c.currentTime+.18);

}catch(e){}

}


/* IMAGEN */

function toggleImage(id){

let e=document.getElementById(id);

if(e)
e.style.display=
e.style.display==='block'
?'none'
:'block';

}


/* ULTIMO ENTRENAMIENTO */

function previousDayLog(d){

let a=logs.filter(
l=>Number(l.day)===Number(d)
);

if(!a.length)
return null;

a.sort(
(x,y)=>new Date(x.date)-new Date(y.date)
);

return a[a.length-1];

}


function getPreviousExercise(log,name){

if(!log)
return null;

for(let g of(log.groups||[]))
for(let e of(g.exercises||[]))
if(e.name===name)
return e;

return null;

}


/* SELECCIONAR DIA */

function selectDay(d){

day=d;

let work=document.getElementById('work'),
daytitle=document.getElementById('daytitle'),
date=document.getElementById('date'),
summary=document.getElementById('summary'),
loadedmsg=document.getElementById('loadedmsg'),
form=document.getElementById('form');

if(!work||
!daytitle||
!date||
!summary||
!loadedmsg||
!form){

alert(
'Error al cargar la pantalla de entrenamiento.'
);

return;

}

work.style.display='block';

daytitle.innerText=
'Entrenamiento - Día '+d;

date.value=
new Date().toISOString().slice(0,10);

summary.innerHTML='';

let previous=previousDayLog(d);

loadedmsg.innerHTML=
previous
?
'<div class="loaded">🔄 Datos del último entrenamiento cargados. Puedes modificarlos antes de guardar.</div>'
:'';

let x=routine[d],
html='';


[['g1','e1'],['g2','e2']].forEach(a=>{

html+=
`<div class="group">${esc(x[a[0]])}</div>`;

(x[a[1]]||[]).forEach((ex,i)=>{

let old=getPreviousExercise(
previous,
ex
);

let sets=old
?(old.sets||[]).slice(0,3)
:[];

while(sets.length<3)
sets.push({
reps:'',
weight:''
});

let lw=Math.max(
...sets.map(s=>num(s.weight))
);

let suggestion=
lw
?Math.round(lw*1.025*10)/10
:0;

let img=
(x[
a[0]==='g1'
?'img1'
:'img2'
]||[])[i]||'';

let iid=
`img-${a[0]}-${i}`;


html+=`

<div class="ex" id="exercise-${a[0]}-${i}">

<div class="exhead">

<span>${esc(ex)}</span>

<span id="pr-${a[0]}-${i}"
class="badge"
style="display:none">
🏆 PR
</span>

</div>


${img?`

<button class="imgbtn"
onclick="toggleImage('${iid}')">
🖼️ Ver imagen
</button>

<div id="${iid}" class="imgbox">

<img
src="${esc(img)}"
alt="${esc(ex)}"
onerror="this.style.display='none';this.nextElementSibling.style.display='block'">

<div
style="display:none;color:var(--red);font-size:.7rem;padding:5px">
⚠️ No se puede cargar la imagen.
</div>

<br>

<button class="imgbtn"
onclick="toggleImage('${iid}')">
✕ Cerrar imagen
</button>

</div>

`:''}


${old?`

<div class="last">

Último
${new Date(previous.date).toLocaleDateString('es-ES')}:

${sets.map((s,j)=>
`S${j+1} ${num(s.reps)||''}×${s.weight!==''&&s.weight!=null?s.weight:''}kg`
).join(' · ')}

</div>

`:'<div class="last">Sin registro previo</div>'}


${suggestion?`

<div class="suggest"
onclick="suggest('${a[0]}',${i},${suggestion})">

💡 Propuesta: ${suggestion} kg (+2,5%)

</div>

`:''}


<table>

<thead>
<tr>
<th>S</th>
<th>Reps</th>
<th>Kg</th>
<th></th>
</tr>
</thead>

<tbody>
`;

sets.forEach((s,j)=>{

html+=`

<tr>

<td>${j+1}</td>

<td>

<input
type="number"
min="0"
id="${a[0]}-${i}-r${j}"
value="${s.reps??''}"
onfocus="selectCell(this)"
oninput="calc('${a[0]}',${i})">

</td>

<td>

<input
type="number"
min="0"
step=".5"
id="${a[0]}-${i}-w${j}"
value="${s.weight??''}"
onfocus="selectCell(this)"
oninput="calc('${a[0]}',${i});pr('${a[0]}',${i},'${esc(ex)}')">

</td>

<td></td>

</tr>

`;

});

html+=`

</tbody>
</table>

<div class="rm"
id="rm-${a[0]}-${i}">
🔥 1RM estimado: --
</div>

<div class="vol"
id="vol-${a[0]}-${i}">
📦 Volumen: 0 kg
</div>

<button
class="restbtn"
onclick="startTimer()">
⏱️ Descanso 2:00
</button>

<button
class="save-ex"
id="save-${a[0]}-${i}"
onclick="saveExercise('${a[0]}',${i},'${esc(ex)}')">
💾 GUARDAR EJERCICIO
</button>

<div class="row">

<button
class="finish"
onclick="showHistory('${esc(ex)}')">
📜 Historial
</button>

</div>

</div>
`;

});

});


form.innerHTML=html;


[['g1','e1'],['g2','e2']].forEach(a=>
(x[a[1]]||[]).forEach((e,i)=>{

calc(a[0],i);

pr(a[0],i,e);

}));

}


/* SELECCIONAR CELDA */

function selectCell(el){

setTimeout(
()=>el.select(),
10
);

}


/* CALCULOS */

function calc(g,i){

let best=0,
vol=0;

for(let j=0;j<3;j++){

let wEl=
document.getElementById(
`${g}-${i}-w${j}`
);

let rEl=
document.getElementById(
`${g}-${i}-r${j}`
);

if(!wEl||!rEl)
continue;

let w=num(wEl.value),
r=num(rEl.value);

if(w>0&&r>0){

best=Math.max(
best,
rm(w,r)
);

vol+=w*r;

}

}

let rmEl=
document.getElementById(
`rm-${g}-${i}`
);

let volEl=
document.getElementById(
`vol-${g}-${i}`
);

if(rmEl)
rmEl.innerText=
`🔥 1RM estimado: ${
best
?Math.round(best*10)/10+' kg'
:'--'
}`;

if(volEl)
volEl.innerText=
`📦 Volumen: ${
Math.round(vol*10)/10
} kg`;

}


/* PROPUESTA */

function suggest(g,i,w){

let e=
document.getElementById(
`${g}-${i}-w2`
);

if(e){

e.value=w;

e.dispatchEvent(
new Event('input',{bubbles:true})
);

}

}


/* PR VISUAL DE LA PANTALLA */

function pr(g,i,ex){

let old=max(ex),
v=0;

for(let j=0;j<3;j++){

let e=
document.getElementById(
`${g}-${i}-w${j}`
);

if(e)
v=Math.max(v,num(e.value));

}

let b=
document.getElementById(
`pr-${g}-${i}`
);

if(b)
b.style.display=
v>old&&old>0
?'inline'
:'none';

}


/* EJERCICIO ACTUAL */

function getCurrentExerciseData(g,i,ex){

let sets=[];

for(let j=0;j<3;j++){

let rEl=
document.getElementById(
`${g}-${i}-r${j}`
);

let wEl=
document.getElementById(
`${g}-${i}-w${j}`
);

if(!rEl||!wEl)
continue;

sets.push({

reps:
rEl.value===''
?0
:num(rEl.value),

weight:
wEl.value===''
?0
:num(wEl.value)

});

}

return{

name:ex,

sets,

volume:volume(sets),

rm:maxSetRM(sets)

};

}


/* GUARDAR EJERCICIO */

function saveExercise(g,i,ex){

if(day===null)
return;

let data=
getCurrentExerciseData(
g,i,ex
);

if(!data.sets.some(
s=>num(s.reps)>0||num(s.weight)>0
)){

alert(
'No hay datos introducidos en este ejercicio.'
);

return;

}

let currentDate=
document.getElementById('date').value;

let log=logs.find(l=>
Number(l.day)===Number(day)&&
l.date===
new Date(
currentDate+'T12:00:00'
).toISOString()
);

if(!log){

log={

id:Date.now(),

date:
new Date(
currentDate+'T12:00:00'
).toISOString(),

day,

groups:[]

};

logs.push(log);

}

let x=routine[day],
groupName=null;

if((x.e1||[]).includes(ex))
groupName=x.g1;

else if((x.e2||[]).includes(ex))
groupName=x.g2;

if(!groupName)
groupName='Grupo';

let group=
log.groups.find(
g=>g.name===groupName
);

if(!group){

group={
name:groupName,
exercises:[]
};

log.groups.push(group);

}

let old=
group.exercises.find(
e=>e.name===ex
);

if(old){

old.sets=data.sets;
old.volume=data.volume;
old.rm=data.rm;

}else{

group.exercises.push(data);

}

save();

let btn=
document.getElementById(
`save-${g}-${i}`
);

if(btn){

btn.classList.add('saved');

btn.innerText=
'✓ EJERCICIO GUARDADO';

setTimeout(()=>{

btn.classList.remove('saved');

btn.innerText=
'💾 GUARDAR EJERCICIO';

},1500);

}

}


/* HISTORIAL */

function showHistory(ex){

let a=
history(ex)
.slice(-6)
.reverse();

if(!a.length){

alert('Sin historial');

return;

}

alert(
a.map(x=>
`${x.date.toLocaleDateString('es-ES')} — `+
x.sets
.filter(s=>s.reps||s.weight)
.map(s=>
`${num(s.reps)}×${num(s.weight)}kg`
)
.join(' · ')
)
.join('\n')
);

}


/* GUARDAR ENTRENAMIENTO */

function saveWorkout(){

if(!day)
return;

let x=routine[day];

let log={

id:Date.now(),

date:
new Date(
document.getElementById('date').value+
'T12:00:00'
).toISOString(),

day,

groups:[]

};

let totalVol=0,
totalSets=0,
totalEx=0;

[['g1','e1'],['g2','e2']].forEach(a=>{

let g={
name:x[a[0]],
exercises:[]
};

(x[a[1]]||[]).forEach((ex,i)=>{

let data=
getCurrentExerciseData(
a[0],i,ex
);

let realizadas=
data.sets.filter(
s=>num(s.reps)>0
);

let v=volume(realizadas);

if(realizadas.length){

totalEx++;

totalSets+=
realizadas.length;

totalVol+=v;

}

g.exercises.push({

name:ex,

sets:data.sets,

volume:v,

rm:maxSetRM(realizadas)

});

});

log.groups.push(g);

});


logs=logs.filter(l=>
!(
Number(l.day)===Number(day)&&
l.date===log.date
)
);

logs.push(log);

save();


document.getElementById('summary').innerHTML=`

<div class="summary">

<h3>🎉 ENTRENAMIENTO TERMINADO</h3>

<div class="big">
Día ${day}
</div>

<div>
💪 <b>${totalEx}</b>
ejercicios realizados
</div>

<div>
🔢 <b>${totalSets}</b>
series realizadas
</div>

<div>
📦 <b>${Math.round(totalVol)}</b>
kg de volumen realizado
</div>

<div style="margin-top:10px;color:var(--sub);font-size:.7rem">

Los ejercicios se pueden guardar individualmente
con su botón GUARDAR EJERCICIO.

</div>

<br>

<button
class="btn"
onclick="finishSummary()">
Continuar
</button>

</div>

`;

}


/* FINALIZAR */

function finishSummary(){

document.getElementById(
'summary'
).innerHTML='';

document.getElementById(
'work'
).style.display='none';

}


/* CONFIGURACION */

function loadConfig(){

let cfgday=
document.getElementById('cfgday');

let editor=
document.getElementById('editor');

let x=
routine[cfgday.value];

let h=`

<label>Grupo 1</label>

<input
id="g1n"
value="${esc(x.g1)}">

<div class="group">

Ejercicios

<button
class="btn out sm"
onclick="add('g1')">
+ Añadir
</button>

</div>

<div id="g1c">
`;

(x.e1||[]).forEach(
(e,i)=>
h+=field(
'g1',
e,
(x.img1||[])[i]
)
);

h+=`

</div>

<label>Grupo 2</label>

<input
id="g2n"
value="${esc(x.g2)}">

<div class="group">

Ejercicios

<button
class="btn out sm"
onclick="add('g2')">
+ Añadir
</button>

</div>

<div id="g2c">
`;

(x.e2||[]).forEach(
(e,i)=>
h+=field(
'g2',
e,
(x.img2||[])[i]
)
);

h+='</div>';

editor.innerHTML=h;

}


function field(g,n,img){

return`

<div class="ex">

<input
class="${g}e"
value="${esc(n)}"
placeholder="Ejercicio">

<input
class="${g}i"
value="${esc(img||'')}"
placeholder="URL imagen/GIF">

<button
class="btn danger sm"
onclick="this.parentElement.remove()">
Eliminar
</button>

</div>

`;

}


function add(g){

document.getElementById(g+'c')
.insertAdjacentHTML(
'beforeend',
field(g,'','')
);

}


function saveConfig(){

let d=
document.getElementById(
'cfgday'
).value;

let x={

g1:
document.getElementById('g1n')
.value.trim()||'Grupo 1',

e1:[],
img1:[],

g2:
document.getElementById('g2n')
.value.trim()||'Grupo 2',

e2:[],
img2:[]

};


['g1','g2'].forEach(g=>{

let ns=
document.querySelectorAll(
'.'+g+'e'
);

let ims=
document.querySelectorAll(
'.'+g+'i'
);

ns.forEach((e,i)=>{

if(e.value.trim()){

let en=
g==='g1'
?'e1'
:'e2';

let im=
g==='g1'
?'img1'
:'img2';

x[en].push(
e.value.trim()
);

x[im].push(
ims[i]
?ims[i].value.trim()
:''
);

}

});

});


routine[d]=x;

save();

alert('Rutina guardada');

}


/* EXPORTAR */

function exportData(){

let b=new Blob(
[
JSON.stringify({

version:4.5,

exported:
new Date().toISOString(),

routine,

logs

},null,2)
],
{
type:'application/json'
}
);

let a=
document.createElement('a');

a.href=
URL.createObjectURL(b);

a.download=
'gym_backup_'+
new Date()
.toISOString()
.slice(0,10)+
'.json';

a.click();

setTimeout(
()=>URL.revokeObjectURL(a.href),
1000
);

}


/* IMPORTAR */

function importData(e){

let f=e.target.files[0];

if(!f)
return;

let r=new FileReader();

r.onload=()=>{

try{

let d=
JSON.parse(r.result);

if(!d||
typeof d!=='object')
throw 0;

if(d.routine)
routine=d.routine;

if(Array.isArray(d.logs))
logs=d.logs;

save();

alert('Datos importados');

location.reload();

}catch(x){

alert(
'Archivo JSON no válido'
);

}

};

r.readAsText(f);

}


/* CALENDARIO */

function month(n){

monthDate.setMonth(
monthDate.getMonth()+n
);

renderCalendar();

}


function renderCalendar(){

let y=
monthDate.getFullYear();

let m=
monthDate.getMonth();

let names=[
'Enero',
'Febrero',
'Marzo',
'Abril',
'Mayo',
'Junio',
'Julio',
'Agosto',
'Septiembre',
'Octubre',
'Noviembre',
'Diciembre'
];

document.getElementById(
'monthname'
).innerText=
names[m]+' '+y;

let first=
(new Date(y,m,1).getDay()+6)%7;

let days=
new Date(y,m+1,0).getDate();

let h=[
'Lu','Ma','Mi','Ju',
'Vi','Sá','Do'
].map(x=>
`<b style="font-size:.68rem;color:var(--sub)">${x}</b>`
).join('');

for(let i=0;i<first;i++)
h+=
'<div class="cal empty"></div>';

for(let d=1;d<=days;d++){

let on=logs.some(l=>{

let z=new Date(l.date);

return z.getFullYear()===y&&
z.getMonth()===m&&
z.getDate()===d;

});

h+=`

<div
class="cal ${on?'on':''}"
onclick="detail(${y},${m},${d})">
${d}
</div>

`;

}

document.getElementById(
'calendar'
).innerHTML=h;

document.getElementById(
'detail'
).innerHTML='';

}


/* DETALLE CALENDARIO */

function detail(y,m,d){

let a=logs.filter(l=>{

let z=new Date(l.date);

return(
z.getFullYear()===y&&
z.getMonth()===m&&
z.getDate()===d
);

});


let h=`

<div class="group">

${String(d).padStart(2,'0')}/
${String(m+1).padStart(2,'0')}/
${y}

</div>

`;

if(!a.length){

document.getElementById(
'detail'
).innerHTML=
h+
'<div class="empty">Sin entrenamiento.</div>';

return;

}


a.forEach((l,index)=>{

h+=`

<div class="report">

<div
style="display:flex;justify-content:space-between;align-items:center">

<b>Día ${l.day}</b>

<div style="display:flex;gap:5px">

<button
class="btn out sm"
onclick="editSession('${l.id}')">
✏️ Editar
</button>

<button
class="btn danger sm"
onclick="deleteSession('${l.id}')">
🗑️ Eliminar
</button>

</div>

</div>

`;


(l.groups||[]).forEach(g=>{

h+=`

<div
style="color:var(--a);margin-top:7px">

${esc(g.name)}

</div>

`;


(g.exercises||[]).forEach(e=>{

let realSets=
(e.sets||[]).filter(
s=>num(s.reps)>0
);

if(!realSets.length)
return;

h+=`

<div style="margin-top:3px">

<b>${esc(e.name)}</b>:

${realSets.map((s,i)=>
`S${i+1} ${s.reps}×${s.weight}kg`
).join(' · ')}

</div>

`;

});

});

h+='</div>';

});


document.getElementById(
'detail'
).innerHTML=h;

}


function deleteSession(id){

if(!confirm(
'¿Seguro que quieres eliminar esta sesión completa?'
))
return;

logs=logs.filter(
l=>String(l.id)!==String(id)
);

save();

renderCalendar();

alert('Sesión eliminada.');

}


function editSession(id){

let log=
logs.find(
l=>String(l.id)===String(id)
);

if(!log)
return;

day=Number(log.day);

document.getElementById(
'work'
).style.display='block';

document.getElementById(
'daytitle'
).innerText=
'Editar entrenamiento - Día '+day;

document.getElementById(
'date'
).value=
new Date(log.date)
.toISOString()
.slice(0,10);

document.getElementById(
'summary'
).innerHTML='';

let x=routine[day];

let html='';


[['g1','e1'],['g2','e2']].forEach(a=>{

html+=
`<div class="group">${esc(x[a[0]])}</div>`;

(x[a[1]]||[]).forEach((ex,i)=>{

let old=null;

(log.groups||[]).forEach(g=>
(g.exercises||[]).forEach(e=>{

if(e.name===ex)
old=e;

}));

let sets=
old
?(old.sets||[]).slice(0,3)
:[];

while(sets.length<3){

sets.push({
reps:'',
weight:'',
type:'E'
});

}


html+=`

<div class="ex">

<div class="exhead">

<span>${esc(ex)}</span>

</div>

<table>

<thead>

<tr>
<th>S</th>
<th>Reps</th>
<th>Kg</th>
<th></th>
</tr>

</thead>

<tbody>

`;


sets.forEach((s,j)=>{

html+=`

<tr>

<td>${j+1}</td>

<td>

<input
type="number"
min="0"
id="${a[0]}-${i}-r${j}"
value="${s.reps??''}"
onfocus="selectCell(this)"
oninput="calc('${a[0]}',${i})">

</td>

<td>

<input
type="number"
min="0"
step=".5"
id="${a[0]}-${i}-w${j}"
value="${s.weight??''}"
onfocus="selectCell(this)"
oninput="calc('${a[0]}',${i})">

</td>

<td></td>

</tr>

`;

});


html+=`

</tbody>

</table>

<div
class="rm"
id="rm-${a[0]}-${i}">
🔥 1RM estimado: --
</div>

<div
class="vol"
id="vol-${a[0]}-${i}">
📦 Volumen: 0 kg
</div>

</div>

`;

});

});


document.getElementById(
'form'
).innerHTML=html;

document.getElementById(
'loadedmsg'
).innerHTML=
'<div class="loaded">✏️ Editando la sesión guardada. Modifica los datos y pulsa "Guardar entrenamiento".</div>';


[['g1','e1'],['g2','e2']].forEach(a=>

(x[a[1]]||[]).forEach((e,i)=>{

calc(a[0],i);

})

);

tab('entrenar');

}


/* TODOS LOS EJERCICIOS */

function allExercises(){

let s=new Set();

Object.values(routine).forEach(d=>{

(d.e1||[]).forEach(
e=>s.add(e)
);

(d.e2||[]).forEach(
e=>s.add(e)
);

});

logs.forEach(l=>
(l.groups||[]).forEach(g=>
(g.exercises||[]).forEach(e=>
s.add(e.name)
)));

return[...s]
.filter(Boolean)
.sort();

}


/* ESTADISTICAS */

function stats(){

let vol=0,
sets=0,
exerciseCount=0,
days=new Set();

logs.forEach(l=>{

let sessionHasData=false;

(l.groups||[]).forEach(g=>
(g.exercises||[]).forEach(e=>{

let realizadas=
(e.sets||[]).filter(
s=>num(s.reps)>0
);

if(!realizadas.length)
return;

sessionHasData=true;

exerciseCount++;

realizadas.forEach(s=>{

vol+=
num(s.weight)*
num(s.reps);

sets++;

});

})
);

if(sessionHasData)
days.add(l.date);

});


document.getElementById(
'stats'
).innerHTML=`

<div class="stat">

<b>${days.size}</b>

<span>Sesiones</span>

</div>

<div class="stat">

<b>${exerciseCount}</b>

<span>Ejercicios realizados</span>

</div>

<div class="stat">

<b>${sets}</b>

<span>Series realizadas</span>

</div>

<div class="stat">

<b>${Math.round(vol)} kg</b>

<span>Volumen realizado</span>

</div>

`;

}


/* INFORMES */

function report(days){

let cut=
Date.now()-
days*86400000;

let a=
logs
.filter(
l=>new Date(l.date).getTime()>=cut
)
.sort(
(x,y)=>
new Date(x.date)-
new Date(y.date)
);

if(!a.length){

document.getElementById(
'reports'
).innerHTML=
`<div class="empty">
Sin entrenamientos realizados en ${days} días.
</div>`;

return;

}


let groups={};


a.forEach(l=>
(l.groups||[]).forEach(g=>{

let key=
g.name||
'Sin grupo';

if(!groups[key]){

groups[key]={

volume:0,

sets:0,

exerciseCount:0,

exercises:new Set(),

sessions:new Set()

};

}

let z=groups[key];

let groupHasData=false;


(g.exercises||[]).forEach(e=>{

let realizadas=
(e.sets||[]).filter(
s=>num(s.reps)>0
);

if(!realizadas.length)
return;

groupHasData=true;

z.exerciseCount++;

z.exercises.add(e.name);

z.sets+=
realizadas.length;

z.volume+=
volume(realizadas);

});


if(groupHasData)
z.sessions.add(
l.id||l.date
);

}));


let totalVol=0,
totalSets=0,
totalExercises=0;


let h=`

<div class="report">

<b>
📊 ${days===15
?'INFORME QUINCENAL (15 DÍAS)'
:'INFORME MENSUAL (30 DÍAS)'}
</b>

<br>

<span style="color:var(--sub)">
Datos de ejercicios, series, repeticiones y pesos realizados
</span>

</div>

`;


let entries=
Object.entries(groups)
.filter(([name,z])=>
z.exerciseCount>0
)
.sort(
(a,b)=>
a[0].localeCompare(
b[0],
'es'
)
);


if(!entries.length){

document.getElementById(
'reports'
).innerHTML=
h+
'<div class="empty">No hay ejercicios realizados en este periodo.</div>';

return;

}


entries.forEach(([name,z])=>{

totalVol+=z.volume;

totalSets+=z.sets;

totalExercises+=
z.exerciseCount;


h+=`

<div class="muscleReport">

<h3>
💪 ${esc(name)}
</h3>

<div class="muscleStats">

<div class="muscleStat">

<b>
${z.exerciseCount}
</b>

<span>
Ejercicios realizados
</span>

</div>

<div class="muscleStat">

<b>
${z.sets}
</b>

<span>
Series realizadas
</span>

</div>

<div class="muscleStat">

<b>
${Math.round(z.volume)} kg
</b>

<span>
Volumen realizado
</span>

</div>

</div>

<div
style="font-size:.65rem;color:var(--sub);margin-top:6px">

Sesiones realizadas:
${z.sessions.size}

</div>

</div>

`;

});


h+=`

<div class="summary">

<h3>
📈 TOTAL DEL PERIODO
</h3>

<div>
💪 <b>${totalExercises}</b>
ejercicios realizados
</div>

<div>
🔢 <b>${totalSets}</b>
series realizadas
</div>

<div>
📦 <b>${Math.round(totalVol)} kg</b>
de volumen realizado
</div>

<div
style="font-size:.68rem;color:var(--sub);margin-top:5px">

Los datos corresponden únicamente a los ejercicios
y series que tienen repeticiones realizadas.

</div>

</div>

`;


document.getElementById(
'reports'
).innerHTML=h;

}


/* INICIO */

renderCalendar();

</script>
