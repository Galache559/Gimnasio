<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mi Gimnasio Pro 5.0</title>
<meta name="theme-color" content="#121212">

<style>
:root{
--bg:#121212;--card:#1e1e1e;--item:#252525;--input:#2a2a2a;
--a:#00e676;--txt:#fff;--sub:#aaa;--bor:#333;--red:#ff5252;
--gold:#ffd700;--blue:#29b6f6
}
*{
box-sizing:border-box;margin:0;padding:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
-webkit-tap-highlight-color:transparent
}
body{background:var(--bg);color:var(--txt);padding-bottom:80px}
header{
position:sticky;top:0;z-index:10;background:var(--card);
padding:12px;text-align:center;border-bottom:1px solid var(--bor)
}
h1{font-size:1.15rem;color:var(--a);letter-spacing:1px}
.container{max-width:650px;margin:auto;padding:10px}
nav{
position:fixed;bottom:0;left:0;right:0;z-index:20;
background:var(--card);display:flex;border-top:1px solid var(--bor);
padding:7px 0
}
nav button{
width:25%;background:none;border:0;color:var(--sub);font-size:.7rem;
display:flex;flex-direction:column;gap:2px;align-items:center
}
nav button.active{color:var(--a);font-weight:bold}
.tab{display:none}.tab.active{display:block}
.card{
background:var(--card);border:1px solid var(--bor);border-radius:11px;
padding:12px;margin-bottom:10px
}
.card h2{
font-size:1rem;color:var(--a);margin-bottom:10px;
display:flex;justify-content:space-between;align-items:center
}
button,.btn{cursor:pointer}
.btn{
background:var(--a);color:#000;border:0;border-radius:7px;
padding:10px;width:100%;font-weight:bold
}
.out{background:transparent;color:var(--txt);border:1px solid var(--bor)}
.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.sm{width:auto;padding:5px 9px;font-size:.75rem}
input,select{
width:100%;background:var(--input);color:var(--txt);
border:1px solid var(--bor);border-radius:6px;padding:8px;
margin-bottom:7px;font-size:.88rem
}
label{font-size:.73rem;color:var(--sub)}
.days{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.group{
color:var(--sub);font-size:.73rem;text-transform:uppercase;
margin:12px 0 6px
}
.ex{
background:var(--item);padding:9px;border-radius:8px;margin-bottom:8px
}
.exhead{
display:flex;justify-content:space-between;align-items:center;
font-weight:bold;margin-bottom:6px
}
.badge{
background:var(--gold);color:#000;border-radius:4px;
padding:2px 5px;font-size:.62rem
}
.last,.suggest,.history{
font-size:.7rem;padding:5px;border-radius:5px;margin-bottom:5px
}
.last{
color:var(--a);background:#07351f;border:1px solid #176b43
}
.suggest{
color:var(--blue);background:#062d3c;border:1px solid #17607c;
cursor:pointer
}
table{width:100%;border-collapse:collapse}
th{color:var(--sub);font-size:.63rem;font-weight:normal}
td{text-align:center;padding:1px}
td input{margin:0;text-align:center;padding:6px 1px}
.rm,.vol{font-size:.7rem;margin-top:5px}
.rm{color:var(--gold)}
.vol{color:var(--a)}
.row{display:flex;gap:5px;margin-top:6px}
.finish{
background:#333;color:#fff;border:1px solid var(--bor);
padding:6px 9px;border-radius:6px;font-size:.68rem
}
.restbtn{
width:100%;margin-top:7px;background:#333;color:#fff;
border:1px solid var(--bor);padding:8px;border-radius:6px;font-size:.72rem
}
.save-ex{
width:100%;margin-top:7px;background:#064d2d;color:#fff;
border:1px solid #176b43;padding:8px;border-radius:6px;
font-size:.72rem;font-weight:bold
}
.save-ex.saved{background:#00a854;color:#000}
.calendar{
display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center
}
.cal{
padding:7px 2px;background:var(--item);border-radius:5px;font-size:.75rem
}
.cal.on{background:var(--a);color:#000;font-weight:bold}
.cal.empty{background:none}
.statgrid{
display:grid;grid-template-columns:repeat(2,1fr);gap:6px
}
.stat{
background:var(--item);padding:8px;border-radius:7px;text-align:center
}
.stat b{display:block;color:var(--a);font-size:1rem}
.stat span{font-size:.66rem;color:var(--sub)}
.report{border-bottom:1px solid var(--bor);padding:8px 0;font-size:.76rem}
.empty{text-align:center;color:var(--sub);padding:15px;font-size:.8rem}
.imgbox{
display:none;text-align:center;margin:6px 0;padding:6px;
background:#191919;border:1px solid var(--bor);border-radius:7px
}
.imgbox img{max-width:100%;max-height:320px;border-radius:6px}
.imgbtn{
background:#333;color:#fff;border:1px solid var(--bor);
padding:5px 9px;border-radius:6px;font-size:.68rem
}
.loaded{
color:var(--blue);background:#062d3c;border:1px solid #17607c;
border-radius:6px;padding:6px;margin-bottom:8px;font-size:.7rem
}
.summary{
background:#07351f;border:1px solid #176b43;border-radius:9px;
padding:12px;margin-top:10px
}
.summary h3{
color:var(--a);font-size:1rem;margin-bottom:8px;text-align:center
}
.summary div{font-size:.78rem;padding:3px 0}
.summary .big{
text-align:center;font-size:1.1rem;font-weight:bold;
color:var(--a);margin:6px 0
}
.muscleReport{
background:var(--item);border:1px solid var(--bor);
border-radius:8px;padding:9px;margin:7px 0
}
.muscleReport h3{color:var(--a);font-size:.9rem;margin-bottom:6px}
.muscleStats{
display:grid;grid-template-columns:repeat(3,1fr);gap:5px
}
.muscleStat{
text-align:center;background:#191919;border-radius:6px;padding:6px
}
.muscleStat b{display:block;color:var(--a);font-size:.85rem}
.muscleStat span{font-size:.6rem;color:var(--sub)}
.timerOverlay{
display:none;position:fixed;inset:0;z-index:100;
background:rgba(0,0,0,.78);align-items:center;
justify-content:center;padding:20px
}
.timerBox{
width:100%;max-width:330px;background:var(--card);
border:1px solid var(--bor);border-radius:15px;padding:22px;
text-align:center;box-shadow:0 10px 40px #000
}
.timerTitle{color:var(--a);font-size:1rem;margin-bottom:12px}
.timerDisplay{
font-size:4rem;font-weight:bold;letter-spacing:2px;
margin:12px 0;color:#fff
}
.timerDisplay.warning{color:var(--gold)}
.timerDisplay.last{color:var(--red);background:none;border:0;padding:0}
.timerClose{
background:#333;color:#fff;border:1px solid var(--bor);
border-radius:7px;padding:9px 15px;font-size:.75rem
}
.backupBox{
background:#062d3c;border:1px solid #17607c;border-radius:8px;
padding:9px;margin-top:10px;font-size:.72rem
}
.backupOk{
color:var(--a)
}
.backupWarn{
color:var(--gold)
}
.editorEx{
background:var(--item);padding:9px;border-radius:8px;margin-bottom:8px
}
.editorButtons{
display:flex;gap:5px;flex-wrap:wrap
}
.editorButtons button{flex:1}
@media(max-width:380px){
td input{font-size:.7rem;padding:5px 1px}
.muscleStats{grid-template-columns:1fr 1fr}
}
@media print{
nav,header,button,input,select,.timerOverlay,canvas{display:none!important}
body{background:#fff;color:#000}
.card{border:0;background:#fff}
.report{color:#000}
}
</style>
</head>

<body>

<header>
<h1>MI GIMNASIO PRO 5.0</h1>
</header>

<div class="container">

<!-- ================= ENTRENAR ================= -->

<section id="tab-entrenar" class="tab active">

<div class="card">
<h2>Selecciona el día</h2>

<div class="days">
<button class="btn out" onclick="selectDay(1)">Día 1</button>
<button class="btn out" onclick="selectDay(2)">Día 2</button>
<button class="btn out" onclick="selectDay(3)">Día 3</button>
<button class="btn out" onclick="selectDay(4)">Día 4</button>
</div>
</div>

<div id="work" style="display:none">

<div class="card">

<h2 id="daytitle">Día</h2>

<div id="loadedmsg"></div>

<label>Fecha</label>
<input type="date" id="date">

<div id="form"></div>

<button class="btn" onclick="saveWorkout()">
💾 Guardar entrenamiento
</button>

<div id="summary"></div>

</div>
</div>
</section>


<!-- ================= RUTINA ================= -->

<section id="tab-rutina" class="tab">

<div class="card">

<h2>⚙️ Configurar rutina</h2>

<label>Día</label>

<select id="cfgday" onchange="loadConfig()">
<option value="1">Día 1</option>
<option value="2">Día 2</option>
<option value="3">Día 3</option>
<option value="4">Día 4</option>
</select>

<div id="editor"></div>

<button class="btn" onclick="saveConfig()">
Guardar configuración
</button>

</div>


<div class="card">

<h2>💾 Copias de seguridad</h2>

<div style="font-size:.72rem;color:var(--sub);margin-bottom:10px">
La copia contiene rutina, ejercicios, imágenes y entrenamientos.
Guárdala fuera del navegador.
</div>

<button class="btn out" onclick="exportData()">
📦 Exportar copia completa
</button>

<br><br>

<button class="btn out"
onclick="document.getElementById('file').click()">
📥 Restaurar copia
</button>

<input
id="file"
type="file"
accept=".json"
style="display:none"
onchange="importData(event)"
>

<div id="backupStatus" class="backupBox"></div>

</div>

</section>


<!-- ================= CALENDARIO ================= -->

<section id="tab-calendario" class="tab">

<div class="card">

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">

<button class="btn out sm" onclick="month(-1)">❮</button>

<h2 id="monthname" style="margin:0"></h2>

<button class="btn out sm" onclick="month(1)">❯</button>

</div>

<div class="calendar" id="calendar"></div>

<div id="detail"></div>

</div>

</section>


<!-- ================= INFORMES ================= -->

<section id="tab-informes" class="tab">

<div class="card">

<h2>📊 Resumen</h2>

<div id="stats" class="statgrid"></div>

</div>


<div class="card">

<h2>📋 Historial por grupos musculares</h2>

<div style="display:flex;gap:5px;flex-wrap:wrap">

<button class="btn out sm" onclick="report(15)">
15 días
</button>

<button class="btn out sm" onclick="report(30)">
Mensual
</button>

<button class="btn out sm" onclick="window.print()">
PDF
</button>

</div>

<div id="reports" class="empty">
Selecciona un periodo.
</div>

</div>

</section>

</div>


<nav>

<button id="n-entrenar" class="active"
onclick="tab('entrenar')">
🏋️<span>Entrenar</span>
</button>

<button id="n-rutina"
onclick="tab('rutina')">
⚙️<span>Rutina</span>
</button>

<button id="n-calendario"
onclick="tab('calendario')">
📅<span>Calendario</span>
</button>

<button id="n-informes"
onclick="tab('informes')">
📊<span>Informes</span>
</button>

</nav>


<!-- ================= CRONOMETRO ================= -->

<div id="timerOverlay" class="timerOverlay">

<div class="timerBox">

<div class="timerTitle">⏱️ DESCANSO</div>

<div id="timerDisplay" class="timerDisplay">
02:00
</div>

<button class="timerClose" onclick="closeTimer()">
Cerrar
</button>

</div>
</div>


<script>
"use strict";

/* =========================================================
   MI GIMNASIO PRO 5.0
   GESTIÓN SEGURA DE DATOS
========================================================= */

const K='gym_';
const DATA_VERSION=5.0;

const EMPTY_ROUTINE={
g1:'Grupo 1',
e1:[],
img1:[],
g2:'Grupo 2',
e2:[],
img2:[]
};

let routine=loadRoutineSafe();
let logs=loadLogsSafe();

let day=null;
let monthDate=new Date();
let timerInterval=null;
let timerSeconds=0;


/* =========================================================
   UTILIDADES
========================================================= */

function esc(s){
return String(s??'').replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m])
);
}


function num(v){
return parseFloat(v)||0;
}


function deepCopy(x){
return JSON.parse(JSON.stringify(x));
}


/* =========================================================
   RUTINA SEGURA
========================================================= */

function validDayRoutine(x){

return !!(
x &&
typeof x==='object' &&
typeof x.g1==='string' &&
typeof x.g2==='string' &&
Array.isArray(x.e1) &&
Array.isArray(x.e2)
);

}


function normalizeDayRoutine(x){

if(!validDayRoutine(x))return null;

let r=deepCopy(x);

if(!Array.isArray(r.img1))r.img1=[];
if(!Array.isArray(r.img2))r.img2=[];

while(r.img1.length<r.e1.length)r.img1.push('');
while(r.img2.length<r.e2.length)r.img2.push('');

r.img1=r.img1.slice(0,r.e1.length);
r.img2=r.img2.slice(0,r.e2.length);

return r;

}


function loadRoutineSafe(){

let raw=localStorage.getItem(K+'routine');

if(!raw){

return {
1:deepCopy(EMPTY_ROUTINE),
2:deepCopy(EMPTY_ROUTINE),
3:deepCopy(EMPTY_ROUTINE),
4:deepCopy(EMPTY_ROUTINE)
};

}

try{

let r=JSON.parse(raw);

if(!r||typeof r!=='object')throw new Error();

let result={};

for(let i=1;i<=4;i++){

let x=normalizeDayRoutine(r[i]);

result[i]=x||deepCopy(EMPTY_ROUTINE);

}

return result;

}catch(e){

return {
1:deepCopy(EMPTY_ROUTINE),
2:deepCopy(EMPTY_ROUTINE),
3:deepCopy(EMPTY_ROUTINE),
4:deepCopy(EMPTY_ROUTINE)
};

}

}


/* =========================================================
   LOGS SEGUROS
========================================================= */

function loadLogsSafe(){

let raw=localStorage.getItem(K+'logs');

if(!raw)return[];

try{

let x=JSON.parse(raw);

return Array.isArray(x)?x:[];

}catch(e){

return[];

}

}


/* =========================================================
   GUARDADO
========================================================= */

function save(){

localStorage.setItem(
K+'routine',
JSON.stringify(routine)
);

localStorage.setItem(
K+'logs',
JSON.stringify(logs)
);

updateBackupStatus();

}


/* =========================================================
   BACKUP AUTOMÁTICO INTERNO
   Sirve como protección ante errores de código.
   NO sustituye al archivo externo.
========================================================= */

function createInternalBackup(){

try{

let backup={
version:DATA_VERSION,
created:new Date().toISOString(),
routine:deepCopy(routine),
logs:deepCopy(logs)
};

localStorage.setItem(
K+'safety_backup',
JSON.stringify(backup)
);

}catch(e){}

}


function updateBackupStatus(){

let el=document.getElementById('backupStatus');

if(!el)return;

let count=uniqueSessions(logs).length;

el.innerHTML=
`<span class="backupOk">🛡️ Datos protegidos en esta instalación.</span>
<br>
Sesiones almacenadas: <b>${count}</b>
<br>
<span style="color:var(--sub)">
Recomendación: exporta una copia después de cambios importantes.
</span>`;

}


/* =========================================================
   VOLUMEN / RM
========================================================= */

function volume(sets){

return(sets||[]).reduce(
(a,x)=>a+num(x.weight)*num(x.reps),
0
);

}


function rm(w,r){

return w&&r
?w*(1+r/30)
:0;

}


function maxSetRM(s){

return Math.round(
Math.max(
0,
...(s||[]).map(
x=>rm(num(x.weight),num(x.reps))
)
)*10
)/10;

}


/* =========================================================
   FECHAS
========================================================= */

function dateKey(value){

if(!value)return'';

let d=new Date(value);

if(isNaN(d.getTime()))return'';

return d.getFullYear()+'-'+
String(d.getMonth()+1).padStart(2,'0')+'-'+
String(d.getDate()).padStart(2,'0');

}


function findSession(d,date){

let key=dateKey(date);

return logs.find(l=>
Number(l.day)===Number(d)&&
dateKey(l.date)===key
);

}


function uniqueSessions(source){

let map=new Map();

(source||[]).forEach(l=>{

if(!l)return;

let key=
Number(l.day)+'|'+dateKey(l.date);

if(!map.has(key)){
map.set(key,l);
}

});

return[...map.values()];

}


/* =========================================================
   PESTAÑAS
========================================================= */

function tab(x){

document.querySelectorAll('.tab')
.forEach(e=>e.classList.remove('active'));

let t=document.getElementById('tab-'+x);

if(t)t.classList.add('active');

document.querySelectorAll('nav button')
.forEach(e=>e.classList.remove('active'));

let n=document.getElementById('n-'+x);

if(n)n.classList.add('active');

if(x==='rutina'){
loadConfig();
updateBackupStatus();
}

if(x==='calendario'){
renderCalendar();
}

if(x==='informes'){
stats();
}

}


/* =========================================================
   HISTORIAL DE EJERCICIO
========================================================= */

function history(ex){

let a=[];

uniqueSessions(logs).forEach(l=>

(l.groups||[]).forEach(g=>

(g.exercises||[]).forEach(e=>{

if(e.name===ex){

a.push({
date:new Date(l.date),
sets:e.sets||[]
});

}

})

)

);

return a.sort((a,b)=>a.date-b.date);

}


function max(ex){

let m=0;

history(ex).forEach(x=>

(x.sets||[]).forEach(s=>

m=Math.max(m,num(s.weight))

)

);

return m;

}


/* =========================================================
   CRONOMETRO
========================================================= */

function startTimer(){

closeTimer();

timerSeconds=120;

document.getElementById(
'timerOverlay'
).style.display='flex';

updateTimerDisplay();

timerInterval=setInterval(()=>{

timerSeconds--;

updateTimerDisplay();

if(timerSeconds<=0){

clearInterval(timerInterval);
timerInterval=null;

beep();

setTimeout(closeTimer,700);

}

},1000);

}


function updateTimerDisplay(){

let el=document.getElementById('timerDisplay');

if(!el)return;

let min=Math.floor(timerSeconds/60);
let sec=timerSeconds%60;

el.textContent=
String(min).padStart(2,'0')+':'+
String(sec).padStart(2,'0');

el.classList.remove('warning','last');

if(timerSeconds<=10&&timerSeconds>3)
el.classList.add('warning');

if(timerSeconds<=3)
el.classList.add('last');

if(timerSeconds<=3&&timerSeconds>0)
beep();

}


function closeTimer(){

if(timerInterval){

clearInterval(timerInterval);
timerInterval=null;

}

let o=document.getElementById('timerOverlay');

if(o)o.style.display='none';

}


function beep(){

try{

let c=new(
window.AudioContext||
window.webkitAudioContext
)();

let o=c.createOscillator();
let g=c.createGain();

o.connect(g);
g.connect(c.destination);

o.frequency.value=900;
g.gain.value=.7;

o.start();
o.stop(c.currentTime+.18);

}catch(e){}

}


/* =========================================================
   IMAGEN
========================================================= */

function toggleImage(id){

let e=document.getElementById(id);

if(e){

e.style.display=
e.style.display==='block'
?'none'
:'block';

}

}


/* =========================================================
   ENTRENAMIENTO ANTERIOR
========================================================= */

function previousDayLog(d){

let a=logs.filter(
l=>Number(l.day)===Number(d)
);

if(!a.length)return null;

a.sort(
(x,y)=>new Date(x.date)-new Date(y.date)
);

return a[a.length-1];

}


function getPreviousExercise(log,name){

if(!log)return null;

for(let g of(log.groups||[]))
for(let e of(g.exercises||[]))
if(e.name===name)return e;

return null;

}


/* =========================================================
   SELECCIONAR DÍA
========================================================= */

function selectDay(d){

day=d;

let work=document.getElementById('work');

work.style.display='block';

document.getElementById('daytitle').innerText=
'Entrenamiento - Día '+d;

document.getElementById('date').value=
new Date().toISOString().slice(0,10);

document.getElementById('summary').innerHTML='';

let previous=previousDayLog(d);

document.getElementById('loadedmsg').innerHTML=
previous
?
'<div class="loaded">📋 Último entrenamiento disponible. Las celdas empiezan vacías para registrar el nuevo entrenamiento.</div>'
:'';

let x=routine[d];
let html='';

[
['g1','e1'],
['g2','e2']
].forEach(a=>{

html+=`<div class="group">${esc(x[a[0]])}</div>`;

(x[a[1]]||[]).forEach((ex,i)=>{

let old=getPreviousExercise(previous,ex);

let previousSets=
old?(old.sets||[]).slice(0,3):[];

while(previousSets.length<3)
previousSets.push({reps:'',weight:''});

let lw=Math.max(
0,
...previousSets.map(s=>num(s.weight))
);

let suggestion=
lw?Math.round(lw*1.025*10)/10:0;

let img=
(x[a[0]==='g1'?'img1':'img2']||[])[i]||'';

let iid=`img-${a[0]}-${i}`;

html+=`

<div class="ex">

<div class="exhead">

<span>${esc(ex)}</span>

<span id="pr-${a[0]}-${i}"
class="badge"
style="display:none">🏆 PR</span>

</div>

${img?`

<button class="imgbtn"
onclick="toggleImage('${iid}')">
🖼️ Ver imagen
</button>

<div id="${iid}" class="imgbox">

<img src="${esc(img)}"
alt="${esc(ex)}"
onerror="
this.style.display='none';
this.nextElementSibling.style.display='block'
">

<div style="display:none;color:var(--red);font-size:.7rem;padding:5px">
⚠️ No se puede cargar la imagen.
</div>

<br>

<button class="imgbtn"
onclick="toggleImage('${iid}')">
✕ Cerrar imagen
</button>

</div>
`:''}

${old?`

/* =========================================================
   CÁLCULOS
========================================================= */

function calc(g,i){

let best=0;
let vol=0;

for(let j=0;j<3;j++){

let wEl=document.getElementById(`${g}-${i}-w${j}`);
let rEl=document.getElementById(`${g}-${i}-r${j}`);

if(!wEl||!rEl)continue;

let w=num(wEl.value);
let r=num(rEl.value);

if(w>0&&r>0){

best=Math.max(best,rm(w,r));
vol+=w*r;

}

}

let rmEl=document.getElementById(`rm-${g}-${i}`);
let volEl=document.getElementById(`vol-${g}-${i}`);

if(rmEl)
rmEl.innerText=
`🔥 1RM estimado: ${
best?Math.round(best*10)/10+' kg':'--'
}`;

if(volEl)
volEl.innerText=
`📦 Volumen: ${Math.round(vol*10)/10} kg`;

}

if(e)v=Math.max(v,num(e.value));

b.style.display=
v>old&&old>0?'inline':'none';

}

function getCurrentExerciseData(g,i,ex){

for(let j=0;j<3;j++){

});

s=>num(s.reps)>0
);

if(!realSets.length){

);

}

let currentDate=document.getElementById('date').value;

if(!currentDate)return;

*/

createInternalBackup();

let log=findSession(day,currentDate);

if(!log){

log={
id:Date.now(),
date:new Date(currentDate+'T12:00:00').toISOString(),
day:Number(day),
groups:[]
};

logs.push(log);

}

let x=routine[day];

let groupName=null;

if((x.e1||[]).includes(ex))
groupName=x.g1;
else if((x.e2||[]).includes(ex))
groupName=x.g2;

if(!groupName)groupName='Grupo';

let group=(log.groups||[]).find(
g=>g.name===groupName
);

if(!group){

group={
name:groupName,
exercises:[]
};

if(!log.groups)log.groups=[];

log.groups.push(group);

}

let old=(group.exercises||[]).find(
e=>e.name===ex
);

let cleanSets=data.sets.map(
s=>({
reps:num(s.reps),
weight:num(s.weight)
})
);

let exerciseData={
name:ex,
sets:cleanSets,
volume:volume(realSets),
rm:maxSetRM(realSets)
};

if(old){

old.sets=exerciseData.sets;
old.volume=exerciseData.volume;
old.rm=exerciseData.rm;

}else{

group.exercises.push(exerciseData);

}

save();

/* =========================================================
   VALIDACIÓN DE IMPORTACIÓN
========================================================= */

function validateImportData(d){

if(!d||typeof d!=='object')
return{
ok:false,
message:'Archivo inválido.'
};

if(!d.routine||typeof d.routine!=='object')
return{
ok:false,
message:'El archivo no contiene una rutina válida.'
};

let validDays=0;

for(let i=1;i<=4;i++){

if(validDayRoutine(d.routine[i]))
validDays++;

}

if(validDays===0)
return{
ok:false,
message:'El archivo no contiene ningún día de rutina válido.'
};

if(!Array.isArray(d.logs))
return{
ok:false,
message:'El archivo no contiene un historial válido.'
};

return{
ok:true,
validDays,
logs:d.logs.length
};

}


/* =========================================================
   IMPORTAR CON PROTECCIÓN
========================================================= */

function importData(e){

let f=e.target.files[0];

if(!f)return;

let reader=new FileReader();

reader.onload=()=>{

try{

let d=JSON.parse(reader.result);

let validation=validateImportData(d);

if(!validation.ok){

alert(
'❌ IMPORTACIÓN CANCELADA\\n\\n'+
validation.message+
'\\n\\nTus datos actuales NO han sido modificados.'
);

e.target.value='';

return;

}


/*
ANTES DE IMPORTAR:
COPIA DE SEGURIDAD INTERNA.
*/

createInternalBackup();


let importedRoutine={};
let validRoutineDays=0;


/*
Solo aceptamos días realmente válidos.
Los días inexistentes o defectuosos
NO sustituyen los actuales.
*/

for(let i=1;i<=4;i++){

let r=normalizeDayRoutine(
d.routine[i]
);

if(r){

importedRoutine[i]=r;
validRoutineDays++;

}else{

importedRoutine[i]=deepCopy(routine[i]);

}

}


/*
CONFIRMACIÓN ESPECIAL SI EL ARCHIVO
NO TIENE ENTRENAMIENTOS.
*/

if(d.logs.length===0&&logs.length>0){

let ok=confirm(
'⚠️ ATENCIÓN\\n\\n'+
'La copia seleccionada contiene 0 entrenamientos, '+
'pero actualmente tienes '+logs.length+' registros.\\n\\n'+
'Si continúas, se sustituirá el historial actual por un historial vacío.\\n\\n'+
'¿Quieres continuar?'
);

if(!ok){

alert(
'Importación cancelada. Tus datos siguen intactos.'
);

e.target.value='';

return;

}

}


/*
CONFIRMACIÓN SI LA COPIA TIENE MENOS DÍAS.
*/

if(validRoutineDays<4){

let ok=confirm(
'⚠️ La copia contiene solo '+
validRoutineDays+
' días de rutina válidos.\\n\\n'+
'Los días que no estén en la copia conservarán '+
'la rutina actual.\\n\\n'+
'¿Continuar?'
);

if(!ok){

e.target.value='';

return;

}

}


/*
IMPORTACIÓN CONTROLADA.
*/

routine=importedRoutine;
logs=deepCopy(d.logs);

save();

alert(
'✅ Copia restaurada correctamente.\\n\\n'+
'Rutinas recuperadas: '+validRoutineDays+'/4\\n'+
'Entrenamientos: '+logs.length
);

location.reload();

}catch(err){

alert(
'❌ No se ha podido leer el archivo.\\n\\n'+
'Tus datos actuales NO han sido modificados.'
);

}

e.target.value='';

};

reader.readAsText(f);

}

function allExercises(){

let s=new Set();

Object.values(routine).forEach(d=>{

(d.e1||[]).forEach(e=>s.add(e));
(d.e2||[]).forEach(e=>s.add(e));

});

uniqueSessions(logs).forEach(l=>
(l.groups||[]).forEach(g=>
(g.exercises||[]).forEach(
e=>s.add(e.name)
)
)
);

return[...s].filter(Boolean).sort();

}


/* =========================================================
   RESUMEN
========================================================= */

function stats(){

let vol=0;
let sets=0;
let exercises=0;

let sessions=new Set();

uniqueSessions(logs).forEach(l=>{

let hasData=false;

(l.groups||[]).forEach(g=>
(g.exercises||[]).forEach(e=>{

let realSets=(e.sets||[]).filter(
s=>num(s.reps)>0
);

if(!realSets.length)return;

exercises++;
sets+=realSets.length;
vol+=volume(realSets);

hasData=true;

})
);

if(hasData){

sessions.add(
Number(l.day)+'|'+dateKey(l.date)
);

}

});

document.getElementById('stats').innerHTML=`

<div class="stat">
<b>${sessions.size}</b>
<span>Sesiones realizadas</span>
</div>

<div class="stat">
<b>${exercises}</b>
<span>Ejercicios realizados</span>
</div>

<div class="stat">
<b>${sets}</b>
<span>Series realizadas</span>
</div>

<div class="stat">
<b>${Math.round(vol)} kg</b>
<span>Volumen realizado</span>
</div>
`;

}


/* =========================================================
   INFORMES 15 / 30 DÍAS
========================================================= */

function isAbsGroup(name){

let n=String(name||'')
.toLowerCase()
.normalize('NFD')
.replace(/[\u0300-\u036f]/g,'');

return /abdominal|abdomen|\babs\b/.test(n);

}


function report(days){

let today=new Date();

today.setHours(23,59,59,999);

let cut=new Date(today);

cut.setDate(
cut.getDate()-(days-1)
);

cut.setHours(0,0,0,0);

let a=uniqueSessions(logs)
.filter(l=>{

let d=new Date(l.date);

return(
d.getTime()>=cut.getTime()&&
d.getTime()<=today.getTime()
);

})
.sort(
(x,y)=>new Date(x.date)-new Date(y.date)
);

if(!a.length){

document.getElementById('reports').innerHTML=
`<div class="empty">
Sin entrenamientos realizados en ${days} días.
</div>`;

return;

}

let groups={};

a.forEach(l=>

(l.groups||[]).forEach(g=>{

if(isAbsGroup(g.name))return;

let key=g.name||'Sin grupo';

if(!groups[key]){

groups[key]={
volume:0,
sets:0,
exercises:new Set(),
sessions:new Set()
};

}

let z=groups[key];

z.sessions.add(
Number(l.day)+'|'+dateKey(l.date)
);

(g.exercises||[]).forEach(e=>{

let realSets=(e.sets||[]).filter(
s=>num(s.reps)>0
);

if(!realSets.length)return;

z.exercises.add(e.name);

z.sets+=realSets.length;

z.volume+=volume(realSets);

});

})

);


let totalVol=0;
let totalSets=0;

let h=`

<div class="report">

<b>
📊 ${
days===15
?'HISTORIAL DE 15 DÍAS'
:'HISTORIAL MENSUAL (30 DÍAS)'
}
</b>

<br>

<span style="color:var(--sub)">
Solo ejercicios y series realmente realizados.
</span>

</div>
`;

let entries=Object.entries(groups)
.sort(
(a,b)=>a[0].localeCompare(b[0],'es')
);

if(!entries.length){

document.getElementById('reports').innerHTML=
h+
'<div class="empty">No hay ejercicios realizados en este periodo.</div>';

return;

}

entries.forEach(([name,z])=>{

totalVol+=z.volume;
totalSets+=z.sets;

h+=`

<div class="muscleReport">

<h3>💪 ${esc(name)}</h3>

<div class="muscleStats">

<div class="muscleStat">
<b>${Math.round(z.volume)} kg</b>
<span>Volumen realizado</span>
</div>

<div class="muscleStat">
<b>${z.sets}</b>
<span>Series realizadas</span>
</div>

<div class="muscleStat">
<b>${z.exercises.size}</b>
<span>Ejercicios realizados</span>
</div>

</div>

<div style="font-size:.65rem;color:var(--sub);margin-top:6px">
Sesiones realizadas: ${z.sessions.size}
</div>

</div>
`;

});

h+=`

<div class="summary">

<h3>📈 TOTAL DEL PERIODO</h3>

<div>
📦 <b>${Math.round(totalVol)} kg</b>
de volumen realizado
</div>

<div>
🔢 <b>${totalSets}</b>
series realizadas
</div>

<div style="font-size:.68rem;color:var(--sub);margin-top:5px">
Los abdominales no se incluyen en el volumen en kg.
</div>

</div>
`;

document.getElementById('reports').innerHTML=h;

}
