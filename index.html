<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <title>Gym PWA Ultimate</title>

  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Gym%20Tracker%20Ultimate%22%2C%22short_name%22%3A%22GymPWA%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23121212%22%2C%22theme_color%22%3A%22%23121212%22%7D">

  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #bb86fc;
      --text: #e0e0e0;
      --danger: #cf6679;
      --secondary: #03dac6;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 1rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 1.2rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      min-height: 48px;
      touch-action: manipulation;
    }
    button:active { opacity: 0.8; }
    button.danger { background: var(--danger); color: #fff; }
    button.secondary { background: #333; color: var(--text); }
    select, input {
      background: #2d2d2d;
      border: 1px solid #444;
      color: var(--text);
      padding: 0.8rem;
      border-radius: 8px;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 0.8rem;
      font-size: 1rem;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      padding: 0.8rem 0;
    }
    .actions { display: flex; gap: 0.5rem; }
    canvas {
      width: 100%;
      height: 200px;
      background: #181818;
      border-radius: 8px;
      margin-top: 0.5rem;
    }
    .timer-display {
      font-size: 2.5rem;
      font-weight: bold;
      text-align: center;
      margin: 0.5rem 0;
      color: var(--secondary);
    }
    .timer-buttons { display: flex; gap: 0.5rem; justify-content: center; }
    .badge {
      display: block;
      background: #2a2a2a;
      border-left: 3px solid var(--accent);
      padding: 0.6rem;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    #installBtn {
      width: 100%;
      margin-bottom: 1rem;
      background: var(--secondary);
      color: #000;
    }
  </style>
</head>
<body>

  <h1>Gym Tracker Ultimate</h1>

  <!-- Botón de Instalación PWA -->
  <button id="installBtn" style="display:none;" onclick="installPWA()">
    📲 Instalar Aplicación en Móvil
  </button>

  <!-- Control Pantalla Encendida -->
  <div class="card">
    <button id="wakeLockBtn" class="secondary" style="width: 100%;" onclick="toggleWakeLock()">Activar Pantalla Encendida</button>
  </div>

  <!-- Registro de Entrenamiento + Sobrecarga Progresiva -->
  <div class="card">
    <h3>Registrar Serie</h3>
    <input type="text" id="inputExercise" placeholder="Ejercicio (ej. Press Banca)" oninput="updateSuggestion()">
    <input type="number" id="inputWeight" placeholder="Peso (kg)" step="0.5">
    <input type="number" id="inputReps" placeholder="Repeticiones">
    <button style="width: 100%;" onclick="addRecord()">Guardar Serie</button>
    
    <div id="suggestionBox" style="margin-top: 0.8rem;">
      <span class="badge" id="suggestionText">Introduce un ejercicio para ver sugerencia</span>
    </div>
  </div>

  <!-- Temporizador de Descanso con Web Audio API -->
  <div class="card">
    <h3>Temporizador de Descanso</h3>
    <div class="timer-display" id="timerDisplay">00:00</div>
    <div class="timer-buttons">
      <button class="secondary" onclick="startTimer(60)">60s</button>
      <button class="secondary" onclick="startTimer(90)">90s</button>
      <button class="secondary" onclick="startTimer(120)">120s</button>
      <button class="danger" onclick="resetTimer()">Detener</button>
    </div>
  </div>

  <!-- Gráfico de Evolución -->
  <div class="card">
    <h3>Evolución de 1RM Estimado</h3>
    <select id="exerciseSelect" onchange="renderChart()"></select>
    <canvas id="rmChart" width="400" height="200"></canvas>
  </div>

  <!-- Gestión de Copia de Seguridad -->
  <div class="card">
    <h3>Gestión de Datos</h3>
    <div style="display: flex; gap: 0.5rem;">
      <button style="flex: 1;" onclick="exportData()">Exportar JSON</button>
      <input type="file" id="importFile" onchange="importData(event)" style="display:none">
      <button class="secondary" style="flex: 1;" onclick="document.getElementById('importFile').click()">Importar JSON</button>
    </div>
  </div>

  <!-- Historial -->
  <div class="card">
    <h3>Historial de Registros</h3>
    <div id="historyList"></div>
  </div>

  <script>
    // -----------------------------------------------------------------
    // 1. SERVICE WORKER Y PWA PROMPT
    // -----------------------------------------------------------------
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'gym-pwa-v4';
        self.addEventListener('install', e => e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(['./']))));
        self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob))
        .catch(err => console.error('Error SW:', err));
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBtn').style.display = 'block';
    });

    async function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          document.getElementById('installBtn').style.display = 'none';
        }
        deferredPrompt = null;
      }
    }

    // -----------------------------------------------------------------
    // 2. PERSISTENCIA Y DATOS
    // -----------------------------------------------------------------
    let gymData = JSON.parse(localStorage.getItem('gym_data')) || [
      { id: 1, date: '2026-01-10', exercise: 'Press de Banca', weight: 80, reps: 8 },
      { id: 2, date: '2026-01-17', exercise: 'Press de Banca', weight: 82.5, reps: 8 }
    ];

    function saveData() {
      localStorage.setItem('gym_data', JSON.stringify(gymData));
      updateUI();
    }

    function calculate1RM(weight, reps) {
      return reps === 1 ? weight : Math.round(weight * (1 + reps / 30));
    }

    // -----------------------------------------------------------------
    // 3. SOBRECARGA PROGRESIVA AUTOMÁTICA
    // -----------------------------------------------------------------
    function updateSuggestion() {
      const exName = document.getElementById('inputExercise').value.trim().toLowerCase();
      const badge = document.getElementById('suggestionText');

      if (!exName) {
        badge.textContent = 'Introduce un ejercicio para ver sugerencia';
        return;
      }

      const matches = gymData
        .filter(item => item.exercise.toLowerCase() === exName)
        .sort((a, b) => b.id - a.id);

      if (matches.length === 0) {
        badge.textContent = 'Nuevo ejercicio: Registra la primera serie';
      } else {
        const last = matches[0];
        let nextWeight = last.weight;
        let nextReps = last.reps;

        if (last.reps >= 10) {
          nextWeight += 2.5;
          nextReps = 6;
          badge.textContent = `Sugerencia: Subir peso ➔ ${nextWeight}kg × ${nextReps} reps`;
        } else {
          nextReps += 1;
          badge.textContent = `Sugerencia: Buscar +1 rep ➔ ${nextWeight}kg × ${nextReps} reps`;
        }
      }
    }

    function addRecord() {
      const ex = document.getElementById('inputExercise').value.trim();
      const weight = parseFloat(document.getElementById('inputWeight').value);
      const reps = parseInt(document.getElementById('inputReps').value, 10);

      if (!ex || isNaN(weight) || isNaN(reps)) {
        alert('Por favor completa todos los campos correctamente.');
        return;
      }

      const newRecord = {
        id: Date.now(),
        date: new Date().toISOString().slice(0, 10),
        exercise: ex,
        weight: weight,
        reps: reps
      };

      gymData.unshift(newRecord);
      saveData();

      document.getElementById('inputWeight').value = '';
      document.getElementById('inputReps').value = '';
      updateSuggestion();
    }

    // -----------------------------------------------------------------
    // 4. TEMPORIZADOR CON WEB AUDIO API
    // -----------------------------------------------------------------
    let timerInterval = null;

    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      } catch (e) {
        console.log('Audio no permitido o no soportado');
      }
    }

    function startTimer(seconds) {
      resetTimer();
      let remaining = seconds;
      
      const updateDisplay = () => {
        const m = String(Math.floor(remaining / 60)).padStart(2, '0');
        const s = String(remaining % 60).padStart(2, '0');
        document.getElementById('timerDisplay').textContent = `${m}:${s}`;
      };

      updateDisplay();

      timerInterval = setInterval(() => {
        remaining--;
        updateDisplay();

        if (remaining <= 0) {
          clearInterval(timerInterval);
          playBeep();
          alert('¡Tiempo de descanso finalizado!');
        }
      }, 1000);
    }

    function resetTimer() {
      if (timerInterval) clearInterval(timerInterval);
      document.getElementById('timerDisplay').textContent = '00:00';
    }

    // -----------------------------------------------------------------
    // 5. WAKE LOCK API (PANTALLA ENCENDIDA)
    // -----------------------------------------------------------------
    let wakeLock = null;

    async function toggleWakeLock() {
      const btn = document.getElementById('wakeLockBtn');
      if ('wakeLock' in navigator) {
        try {
          if (!wakeLock) {
            wakeLock = await navigator.wakeLock.request('screen');
            btn.textContent = 'Pantalla Siempre Encendida: ACTIVA';
            btn.style.background = 'var(--secondary)';
            btn.style.color = '#000';
          } else {
            await wakeLock.release();
            wakeLock = null;
            btn.textContent = 'Activar Pantalla Encendida';
            btn.style.background = '#333';
            btn.style.color = 'var(--text)';
          }
        } catch (err) {
          alert('Error al gestionar Wake Lock: ' + err.message);
        }
      } else {
        alert('Tu navegador no soporta Wake Lock API.');
      }
    }

    // -----------------------------------------------------------------
    // 6. RENDERIZADO DE GRÁFICO CANVAS NATIVO
    // -----------------------------------------------------------------
    function renderChart() {
      const canvas = document.getElementById('rmChart');
      const ctx = canvas.getContext('2d');
      const selectedEx = document.getElementById('exerciseSelect').value;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!selectedEx) return;

      const filtered = gymData
        .filter(item => item.exercise === selectedEx)
        .sort((a, b) => new Date(a.date) - new Date(b.date));

      if (filtered.length < 2) {
        ctx.fillStyle = '#888';
        ctx.font = '14px sans-serif';
        ctx.fillText('Se necesitan al menos 2 registros para graficar', 40, 100);
        return;
      }

      const points = filtered.map(item => ({
        date: item.date,
        rm: calculate1RM(item.weight, item.reps)
      }));

      const padding = 30;
      const width = canvas.width - padding * 2;
      const height = canvas.height - padding * 2;

      const minRM = Math.min(...points.map(p => p.rm)) * 0.9;
      const maxRM = Math.max(...points.map(p => p.rm)) * 1.1;

      ctx.beginPath();
      ctx.strokeStyle = '#bb86fc';
      ctx.lineWidth = 3;

      points.forEach((pt, index) => {
        const x = padding + (index / (points.length - 1)) * width;
        const y = canvas.height - padding - ((pt.rm - minRM) / (maxRM - minRM)) * height;

        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      points.forEach((pt, index) => {
        const x = padding + (index / (points.length - 1)) * width;
        const y = canvas.height - padding - ((pt.rm - minRM) / (maxRM - minRM)) * height;

        ctx.fillStyle = '#03dac6';
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#e0e0e0';
        ctx.font = '10px sans-serif';
        ctx.fillText(`${pt.rm}kg`, x - 10, y - 10);
      });
    }

    function populateExerciseSelect() {
      const select = document.getElementById('exerciseSelect');
      const currentVal = select.value;
      const exercises = [...new Set(gymData.map(item => item.exercise))];

      select.innerHTML = '';
      exercises.forEach(ex => {
        const option = document.createElement('option');
        option.value = ex;
        option.textContent = ex;
        select.appendChild(option);
      });

      if (exercises.includes(currentVal)) select.value = currentVal;
    }

    // -----------------------------------------------------------------
    // 7. HISTORIAL Y COPIAS DE SEGURIDAD
    // -----------------------------------------------------------------
    function renderHistory() {
      const container = document.getElementById('historyList');
      container.innerHTML = '';

      if (gymData.length === 0) {
        container.innerHTML = '<p>No hay registros guardados.</p>';
        return;
      }

      gymData.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `
          <div>
            <strong>${item.exercise}</strong> <small>(${calculate1RM(item.weight, item.reps)}kg 1RM)</small><br>
            <small>${item.date} — ${item.weight}kg × ${item.reps} reps</small>
          </div>
          <div class="actions">
            <button class="secondary" onclick="editRecord(${item.id})">Editar</button>
            <button class="danger" onclick="deleteRecord(${item.id})">Borrar</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function deleteRecord(id) {
      if (confirm('¿Eliminar este registro?')) {
        gymData = gymData.filter(item => item.id !== id);
        saveData();
      }
    }

    function editRecord(id) {
      const record = gymData.find(item => item.id === id);
      if (!record) return;

      const newWeight = prompt('Nuevo peso (kg):', record.weight);
      const newReps = prompt('Nuevas repeticiones:', record.reps);

      if (newWeight !== null && newReps !== null) {
        const parsedWeight = parseFloat(newWeight);
        const parsedReps = parseInt(newReps, 10);

        if (!isNaN(parsedWeight) && !isNaN(parsedReps)) {
          record.weight = parsedWeight;
          record.reps = parsedReps;
          saveData();
        } else {
          alert('Error: Introduce números válidos.');
        }
      }
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(gymData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `gym_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function validateSchema(data) {
      return Array.isArray(data) && data.every(i => 
        typeof i === 'object' && i !== null &&
        typeof i.id === 'number' && typeof i.date === 'string' &&
        typeof i.exercise === 'string' && typeof i.weight === 'number' &&
        typeof i.reps === 'number'
      );
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedJson = JSON.parse(e.target.result);
          if (validateSchema(importedJson)) {
            gymData = importedJson;
            saveData();
            alert('¡Importación exitosa!');
          } else {
            alert('Error: Esquema JSON no válido.');
          }
        } catch (err) {
          alert('Error: Archivo JSON corrupto.');
        }
      };
      reader.readAsText(file);
    }

    function updateUI() {
      renderHistory();
      populateExerciseSelect();
      renderChart();
    }

    // Carga inicial
    updateUI();
  </script>
</body>
</html>
