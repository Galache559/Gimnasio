<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#121212"><title>Mi Gimnasio Pro v4</title><style>
:root{--b:#121212;--c:#1e1e1e;--i:#252525;--a:#00e676;--t:#fff;--s:#aaa;--br:#333;--r:#ff5252;--g:#ffd700;--bl:#29b6f6}*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent}body{background:var(--b);color:var(--t);padding-bottom:82px}header{position:sticky;top:0;z-index:10;background:var(--c);padding:14px;text-align:center;border-bottom:1px solid var(--br)}h1{font-size:1.2rem;color:var(--a)}.container{max-width:650px;margin:auto;padding:12px}nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--c);display:flex;border-top:1px solid var(--br);padding:8px 0}nav button{width:25%;background:none;border:0;color:var(--s);font-size:.72rem}nav button span{display:block;font-size:1.2rem}nav button.active{color:var(--a);font-weight:bold}.tab{display:none}.tab.active{display:block}.card{background:var(--c);border:1px solid var(--br);border-radius:12px;padding:14px;margin-bottom:12px}.card h2{font-size:1rem;color:var(--a);margin-bottom:12px;display:flex;justify-content:space-between}button,.btn{cursor:pointer}.btn{background:var(--a);color:#000;border:0;border-radius:8px;padding:11px;width:100%;font-weight:bold}.out{background:transparent;color:var(--t);border:1px solid var(--br)}.danger{background:transparent;color:var(--r);border:1px solid var(--r)}.sm{width:auto;padding:6px 10px;font-size:.78rem}input,select{width:100%;background:#2a2a2a;color:#fff;border:1px solid var(--br);border-radius:6px;padding:9px;margin-bottom:8px}.days{display:grid;grid-template-columns:1fr 1fr;gap:8px}.timer{background:var(--i);border:1px solid var(--a);border-radius:10px;text-align:center;padding:10px;margin-bottom:12px}.clock{font:700 2rem monospace;color:var(--a);margin:4px}.tb{display:flex;gap:6px;justify-content:center}.tb button,.finish{background:#333;color:#fff;border:1px solid var(--br);padding:6px 9px;border-radius:6px}.group{color:var(--s);font-size:.76rem;text-transform:uppercase;margin:15px 0 7px}.ex{background:var(--i);padding:10px;border-radius:9px;margin-bottom:10px}.exh{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:7px}.badge{background:var(--g);color:#000;border-radius:4px;padding:2px 5px;font-size:.65rem}.last,.suggest,.hist{font-size:.72rem;padding:6px;border-radius:5px;margin-bottom:6px}.last{color:var(--a);background:#07351f}.suggest{color:var(--bl);background:#062d3c}.hist{color:var(--s);background:#1b1b1b}table{width:100%;border-collapse:collapse}th{color:var(--s);font-size:.68rem;font-weight:normal}td{text-align:center;padding:2px}td input{margin:0;text-align:center;padding:7px 2px;font-size:.78rem}.rm,.vol{font-size:.72rem;margin-top:5px}.rm{color:var(--g)}.vol{color:var(--a)}.actions{display:flex;gap:5px;margin-top:6px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal{padding:8px 2px;background:var(--i);border-radius:5px;font-size:.78rem}.cal.on{background:var(--a);color:#000;font-weight:bold}.empty{text-align:center;color:var(--s);padding:18px;font-size:.85rem}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.stat{background:var(--i);padding:9px;border-radius:8px;text-align:center}.stat b{display:block;color:var(--a);font-size:1rem}.stat span{font-size:.68rem;color:var(--s)}canvas{width:100%;height:190px;background:#191919;border:1px solid var(--br);border-radius:8px}.report{border-bottom:1px solid var(--br);padding:9px;font-size:.78rem}
</style></head><body>
<header><h1>MI GIMNASIO PRO V4</h1></header><div class="container">

<section id="tab-entrenar" class="tab active">
<div class="timer"><div style="display:flex;justify-content:space-between"><span style="font-size:.75rem;color:var(--s)">⏱️ DESCANSO</span><button class="finish" onclick="wake()">💡 Pantalla</button></div><div id="clock" class="clock">00:00</div><div class="tb"><button onclick="timer(60)">60s</button><button onclick="timer(90)">90s</button><button onclick="timer(120)">120s</button><button onclick="stopTimer()">STOP</button></div></div>
<div class="card"><h2>Selecciona el día</h2><div class="days"><button class="btn out" onclick="selectDay(1)">Día 1</button><button class="btn out" onclick="selectDay(2)">Día 2</button><button class="btn out" onclick="selectDay(3)">Día 3</button><button class="btn out" onclick="selectDay(4)">Día 4</button></div></div>
<div id="work" style="display:none"><div class="card"><h2 id="daytitle"></h2><label>Fecha</label><input type="date" id="date"><div id="form"></div><button class="btn" onclick="saveWorkout()">💾 GUARDAR ENTRENAMIENTO</button></div></div>
</section>

<section id="tab-rutina" class="tab"><div class="card"><h2>⚙️ Configurar rutina</h2><select id="cfgday" onchange="loadConfig()"><option value="1">Día 1</option><option value="2">Día 2</option><option value="3">Día 3</option><option value="4">Día 4</option></select><div id="editor"></div><button class="btn" onclick="saveConfig()">GUARDAR RUTINA</button></div><div class="card"><h2>💾 Copia</h2><button class="btn out" onclick="exportData()">📦 EXPORTAR JSON</button><br><br><button class="btn out" onclick="$('file').click()">📥 IMPORTAR JSON</button><input id="file" type="file" accept=".json" style="display:none" onchange="importData(event)"></div></section>

<section id="tab-calendario" class="tab"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><button class="btn out sm" onclick="month(-1)">❮</button><h2 id="monthname" style="margin:0"></h2><button class="btn out sm" onclick="month(1)">❯</button></div><div class="calendar" id="calendar"></div><div id="detail"></div></div></section>

<section id="tab-informes" class="tab"><div class="card"><h2>📊 Resumen</h2><div id="stats" class="stats"></div></div><div class="card"><h2>📈 Progresión</h2><select id="chartselect" onchange="chart()"></select><canvas id="canvas"></canvas></div><div class="card"><h2>📋 Historial</h2><div style="display:flex;gap:5px"><button class="btn out" onclick="report(15)">15 días</button><button class="btn out" onclick="report(30)">30 días</button><button class="btn out" onclick="report(90)">90 días</button><button class="btn out" onclick="window.print()">PDF</button></div><div id="reports" class="empty">Selecciona un periodo.</div></div></section>
</div>

<nav><button id="n-entrenar" class="active" onclick="tab('entrenar')"><span>🏋️</span>Entrenar</button><button id="n-rutina" onclick="tab('rutina')"><span>⚙️</span>Rutina</button><button id="n-calendario" onclick="tab('calendario')"><span>📅</span>Calendario</button><button id="n-informes" onclick="tab('informes')"><span>📊</span>Informes</button></nav>

<script>
const $=id=>document.getElementById(id),K='gym_',D={g1:'Grupo 1',e1:['Ej 1','Ej 2'],img1:['',''],rest1:90,g2:'Grupo 2',e2:['Ej 1','Ej 2'],img2:['',''],rest2:90};
let routine=JSON.parse(localStorage.getItem(K+'routine'))||{},logs=JSON.parse(localStorage.getItem(K+'logs'))||[],day=null,monthDate=new Date(),interval=null,seconds=0,lock=null;
for(let i=1;i<5;i++)if(!routine[i])routine[i]=JSON.parse(JSON.stringify(D));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const save=()=>{localStorage.setItem(K+'routine',JSON.stringify(routine));localStorage.setItem(K+'logs',JSON.stringify(logs))};
const rm=(w,r)=>w&&r?(r==1?w:Math.round(w*(1+r/30))):0;
function tab(x){document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));$('tab-'+x).classList.add('active');document.querySelectorAll('nav button').forEach(e=>e.classList.remove('active'));$('n-'+x).classList.add('active');if(x==='rutina')loadConfig();if(x==='calendario')renderCalendar();if(x==='informes'){stats();fillChart()}}
async function wake(){if(!('wakeLock'in navigator))return alert('Wake Lock no disponible');try{if(!lock)lock=await navigator.wakeLock.request('screen');else{await lock.release();lock=null}}catch(e){}}
function timer(s){clearInterval(interval);seconds=s;showClock();interval=setInterval(()=>{seconds--;showClock();if(seconds<=0){clearInterval(interval);beep()}},1000)}
function stopTimer(){clearInterval(interval);seconds=0;showClock()}function showClock(){$('clock').innerText=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
function beep(){try{let c=new AudioContext,o=c.createOscillator();o.connect(c.destination);o.frequency.value=900;o.start();o.stop(c.currentTime+.3)}catch(e){}}
function last(ex){for(let i=logs.length-1;i>=0;i--)for(const g of logs[i].groups||[])for(const e of g.exercises||[])if(e.name===ex)return{date:new Date(logs[i].date).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'}),sets:e.sets||[]};return null}
function max(ex){let m=0;logs.forEach(l=>(l.groups||[]).forEach(g=>(g.exercises||[]).forEach(e=>{if(e.name===ex)(e.sets||[]).forEach(s=>m=Math.max(m,+s.weight||0))})));return m}
function selectDay(d){
day=d;$('work').style.display='block';$('daytitle').innerText='Entrenamiento - Día '+d;$('date').value=new Date().toISOString().slice(0,10);
let x=routine[d],h='';
[['g1','e1','img1'],['g2','e2','img2']].forEach(a=>{
h+=`<div class="group">${esc(x[a[0]])}</div>`;
(x[a[1]]||[]).forEach((ex,i)=>{
let l=last(ex),sets=l?l.sets.slice(0,3):[1,2,3].map(()=>({reps:10,weight:'',rir:2,rpe:8}));while(sets.length<3)sets.push({reps:10,weight:'',rir:2,rpe:8});
let lw=Math.max(...sets.map(s=>+s.weight||0));
h+=`<div class="ex"><div class="exh"><span>${esc(ex)}</span><span id="pr-${a[0]}-${i}" class="badge" style="display:none">🏆 PR</span></div>${l?`<div class="last">Último ${l.date}: ${sets.map((s,j)=>`S${j+1} ${s.reps}×${s.weight}kg`).join(' · ')}</div>`:''}${lw?`<div class="suggest" onclick="suggest('${a[0]}',${i},${(lw*1.025).toFixed(1)})">💡 Sugerencia: ${(lw*1.025).toFixed(1)} kg</div>`:''}<table><thead><tr><th>S</th><th>Reps</th><th>Kg</th><th>RIR</th><th>RPE</th><th></th></tr></thead><tbody>`;
sets.forEach((s,j)=>h+=`<tr><td>${j+1}</td><td><input type="number" id="${a[0]}-${i}-r${j}" value="${s.reps||10}" oninput="calc('${a[0]}',${i})"></td><td><input type="number" step=".5" id="${a[0]}-${i}-w${j}" value="${s.weight||''}" oninput="calc('${a[0]}',${i});pr('${a[0]}',${i},'${esc(ex).replace(/'/g,"\\'")}')"></td><td><input type="number" min="0" max="10" step=".5" id="${a[0]}-${i}-q${j}" value="${s.rir??2}" oninput="calc('${a[0]}',${i})"></td><td><input type="number" min="1" max="10" step=".5" id="${a[0]}-${i}-p${j}" value="${s.rpe??8}"></td><td><button class="finish" onclick="timer(90)">▶</button></td></tr>`);
h+=`</tbody></table><div class="rm" id="rm-${a[0]}-${i}">🔥 1RM: --</div><div class="vol" id="vol-${a[0]}-${i}">📦 Volumen: 0 kg</div><div class="actions"><button class="finish" onclick="timer(90)">⏱️ 90s</button><button class="finish" onclick="historyEx('${esc(ex).replace(/'/g,"\\'")}')">📜 Historial</button></div></div>`;
});});$('form').innerHTML=h
}
function calc(g,i){let best=0,vol=0;for(let j=0;j<3;j++){let w=+$(`${g}-${i}-w${j}`).value||0,r=+$(`${g}-${i}-r${j}`).value||0;best=Math.max(best,rm(w,r));vol+=w*r}$(`rm-${g}-${i}`).innerText=`🔥 1RM: ${best?'~'+best+' kg':'--'}`;$(`vol-${g}-${i}`).innerText=`📦 Volumen: ${vol.toFixed(1)} kg`}
function suggest(g,i,w){$(`${g}-${i}-w2`).value=w;calc(g,i)}
function pr(g,i,ex){let m=max(ex),v=Math.max(...[0,1,2].map(j=>+$(`${g}-${i}-w${j}`).value||0));$(`pr-${g}-${i}`).style.display=v>m&&m>0?'inline':'none'}
function historyEx(ex){let a=[];logs.forEach(l=>(l.groups||[]).forEach(g=>(g.exercises||[]).forEach(e=>{if(e.name===ex)a.push(`${new Date(l.date).toLocaleDateString('es-ES')} · ${(e.sets||[]).map(s=>`${s.reps}×${s.weight}kg RIR${s.rir??'-'} RPE${s.rpe??'-'}`).join(' · ')`)})));alert(a.slice(-6).reverse().join('\n')||'Sin historial')}
function saveWorkout(){
if(!day)return;let x=routine[day],log={id:Date.now(),date:new Date($('date').value+'T12:00:00').toISOString(),day,groups:[]};
[['g1','e1'],['g2','e2']].forEach(a=>{let g={name:x[a[0]],exercises:[]};(x[a[1]]||[]).forEach((ex,i)=>{let sets=[];for(let j=0;j<3;j++)sets.push({reps:+$(`${a[0]}-${i}-r${j}`).value||0,weight:+$(`${a[0]}-${i}-w${j}`).value||0,rir:+$(`${a[0]}-${i}-q${j}`).value||0,rpe:+$(`${a[0]}-${i}-p${j}`).value||0});g.exercises.push({name:ex,sets})});log.groups.push(g)});logs.push(log);save();alert('✅ Entrenamiento guardado');$('work').style.display='none'
}
function field(g,n,img){return`<div class="ex"><input class="${g}e" value="${esc(n)}" placeholder="Ejercicio"><input class="${g}i" value="${esc(img||'')}" placeholder="URL imagen/GIF"><button class="btn danger sm" onclick="this.parentElement.remove()">Eliminar</button></div>`}
function loadConfig(){let x=routine[$('cfgday').value],h=`<label>Grupo 1</label><input id="g1n" value="${esc(x.g1)}"><div class="group">Ejercicios <button class="btn out sm" onclick="add('g1')">+ Añadir</button></div><div id="g1c">${(x.e1||[]).map((e,i)=>field('g1',e,(x.img1||[])[i])).join('')}</div><label>Grupo 2</label><input id="g2n" value="${esc(x.g2)}"><div class="group">Ejercicios <button class="btn out sm" onclick="add('g2')">+ Añadir</button></div><div id="g2c">${(x.e2||[]).map((e,i)=>field('g2',e,(x.img2||[])[i])).join('')}</div>`;$('editor').innerHTML=h}
function add(g){$(g+'c').insertAdjacentHTML('beforeend',field(g,'',''))}
function saveConfig(){let d=$('cfgday').value,x={g1:$('g1n').value.trim()||'Grupo 1',e1:[],img1:[],g2:$('g2n').value.trim()||'Grupo 2',e2:[],img2:[]};['g1','g2'].forEach(g=>document.querySelectorAll('.'+g+'e').forEach((e,i)=>{if(e.value.trim()){x[g==='g1'?'e1':'e2'].push(e.value.trim());x[g==='g1'?'img1':'img2'].push(document.querySelectorAll('.'+g+'i')[i].value.trim())}}));routine[d]=x;save();alert('✅ Rutina guardada')}
function exportData(){let b=new Blob([JSON.stringify({routine,logs},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='gym_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(d.routine)routine=d.routine;if(Array.isArray(d.logs))logs=d.logs;save();alert('✅ Datos importados');location.reload()}catch(x){alert('❌ JSON no válido')}};r.readAsText(f)}
function month(n){monthDate.setMonth(monthDate.getMonth()+n);renderCalendar()}
function renderCalendar(){let y=monthDate.getFullYear(),m=monthDate.getMonth(),names=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];$('monthname').innerText=names[m]+' '+y;let first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),h=['Lu','Ma','Mi','Ju','Vi','Sá','Do'].map(x=>`<b style="font-size:.7rem;color:var(--s)">${x}</b>`).join('');for(let i=0;i<first;i++)h+='<div class="cal empty"></div>';for(let d=1;d<=days;d++){let on=logs.some(l=>{let z=new Date(l.date);return z.getFullYear()===y&&z.getMonth()===m&&z.getDate()===d});h+=`<div class="cal ${on?'on':''}" onclick="detail(${y},${m},${d})">${d}</div>`}$('calendar').innerHTML=h}
function detail(y,m,d){let a=logs.filter(l=>{let z=new Date(l.date);return z.getFullYear()===y&&z.getMonth()===m&&z.getDate()===d}),h=`<div class="group">${d}/${m+1}/${y}</div>`;if(!a.length)return $('detail').innerHTML=h+'<div class="empty">Sin entrenamiento.</div>';a.forEach(l=>{h+=`<div class="report"><b>Día ${l.day}</b>`;(l.groups||[]).forEach(g=>{h+=`<div style="color:var(--a)">${esc(g.name)}</div>`;(g.exercises||[]).forEach(e=>h+=`<div>${esc(e.name)}: ${(e.sets||[]).map(s=>`${s.reps}×${s.weight}kg RIR${s.rir??'-'} RPE${s.rpe??'-'}`).join(' · ')}</div>`)});h+='</div>'});$('detail').innerHTML=h}
function allExercises(){let s=new Set();Object.values(routine).forEach(d=>[...(d.e1||[]),...(d.e2||[])].forEach(e=>s.add(e)));logs.forEach(l=>(l.groups||[]).forEach(g=>(g.exercises||[]).forEach(e=>s.add(e.name))));return[...s].filter(Boolean)}
function fillChart(){let s=$('chartselect'),v=s.value;s.innerHTML='<option value="">Ejercicio</option>'+allExercises().map(e=>`<option>${esc(e)}</option>`).join('');s.value=v||s.options[1]?.value||'';chart()}
function chart(){let n=$('chartselect').value,c=$('canvas'),x=c.getContext('2d');c.width=c.clientWidth*devicePixelRatio;c.height=190*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);let W=c.clientWidth,H=190;x.clearRect(0,0,W,H);if(!n)return;let p=[];logs.forEach(l=>(l.groups||[]).forEach(g=>(g.exercises||[]).forEach(e=>{if(e.name===n)(e.sets||[]).forEach(s=>{if(+s.weight)p.push({d:new Date(l.date),w:+s.weight})})})));p.sort((a,b)=>a.d-b.d);if(!p.length)return;let mi=Math.min(...p.map(a=>a.w)),ma=Math.max(...p.map(a=>a.w)),r=ma-mi||1,q=25;x.strokeStyle='#333';x.beginPath();x.moveTo(q,10);x.lineTo(q,H-25);x.lineTo(W-10,H-25);x.stroke();x.strokeStyle='#00e676';x.lineWidth=2;x.beginPath();p.forEach((a,i)=>{let X=q+(W-q-15)*i/Math.max(1,p.length-1),Y=H-25-(a.w-mi)/r*(H-45);i?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke()}
function stats(){let v=0,s=0,days=new Set;logs.forEach(l=>{days.add(new Date(l.date).toDateString());(l.groups||[]).forEach(g=>(g.exercises||[]).forEach(e=>(e.sets||[]).forEach(z=>{v+=(+z.weight||0)*(+z.reps||0);s++})))});$('stats').innerHTML=`<div class="stat"><b>${days.size}</b><span>Sesiones</span></div><div class="stat"><b>${v.toFixed(0)} kg</b><span>Volumen</span></div><div class="stat"><b>${s}</b><span>Series</span></div><div class="stat"><b>${allExercises().length}</b><span>Ejercicios</span></div>`}
function report(n){let cut=Date.now()-n*864e5,a=logs.filter(l=>new Date(l.date)>=cut).sort((x,y)=>new Date(y.date)-new Date(x.date));$('reports').innerHTML=a.length?a.map(l=>{let v=0;(l.groups||[]).forEach(g=>(g.exercises||[]).forEach(e=>(e.sets||[]).forEach(s=>v+=(+s.weight||0)*(+s.reps||0))));return`<div class="report"><b>${new Date(l.date).toLocaleDateString('es-ES')} · Día ${l.day}</b><br>📦 ${v.toFixed(0)} kg</div>`}).join(''):`<div class="empty">Sin entrenamientos en ${n} días.</div>`}
renderCalendar();showClock();
</script></body></html>
